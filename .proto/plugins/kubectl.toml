# proto schema plugin for kubectl (https://kubernetes.io/docs/reference/kubectl/).
# Downloads the official release binary from dl.k8s.io and verifies it against the SHA-256
# file published next to it.
# Reference: https://moonrepo.dev/docs/proto/non-wasm-plugin

name = "kubectl"
type = "cli"

[platform.linux]
download-file = "kubectl"
checksum-file = "kubectl.sha256"

[install]
download-url = "https://dl.k8s.io/release/v{version}/bin/linux/{arch}/{download_file}"
checksum-url = "https://dl.k8s.io/release/v{version}/bin/linux/{arch}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[install.exes.kubectl]
exe-path = "kubectl"
primary = true

[resolve]
git-url = "https://github.com/kubernetes/kubernetes"
