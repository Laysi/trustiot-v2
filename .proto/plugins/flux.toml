# proto schema plugin for the Flux CLI (https://github.com/fluxcd/flux2).
# Downloads the official release archive and verifies it against the
# checksums file published with the release.
# Reference: https://moonrepo.dev/docs/proto/non-wasm-plugin

name = "flux"
type = "cli"

[platform.linux]
download-file = "flux_{version}_linux_{arch}.tar.gz"
checksum-file = "flux_{version}_checksums.txt"

[platform.macos]
download-file = "flux_{version}_darwin_{arch}.tar.gz"
checksum-file = "flux_{version}_checksums.txt"

[install]
download-url = "https://github.com/fluxcd/flux2/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/fluxcd/flux2/releases/download/v{version}/{checksum_file}"

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[install.exes.flux]
exe-path = "flux"
primary = true

[resolve]
git-url = "https://github.com/fluxcd/flux2"
