[package]
name = "workstation"
description = "TrustIoT v2 production workstation tool (decision 12): the workstation's own key and certificate, and the platform administrator's login it calls the factory registration API with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "trustiot-workstation"
path = "src/main.rs"
doc = false

[dependencies]
# PKCS #8 PEM bodies, decoded into memory that is wiped afterwards.
base64.workspace = true
bytes.workspace = true
# RFC 3339 times of a certificate's validity.
chrono = { workspace = true, features = ["alloc"] }
# The certs API's request and response types, its M1 error body, the workstation profile
# (purpose OID and subject prefix) the certs service issues, and the registration's signing input.
contract = { path = "../../crates/contract" }
# Registration nonces and the retry jitter, from the operating system's CSPRNG.
getrandom.workspace = true
# HTTP/1.1 over hyper, one connection per request (src/http.rs): no pool, so nothing is ever
# sent twice behind the caller's back. TLS is rustls with ring; not reqwest (see
# crates/ai-clients/README.md, "HTTP 與 TLS").
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# O_NOFOLLOW when opening secret files.
libc.workspace = true
# The gateway's provisioning report (`protocol::provisioning`, Laysi/trustiot-v2#613) and the
# hardware ID rule (`GatewayId`) of `register --gateway`.
protocol = { path = "../../crates/protocol" }
# The workstation's ECDSA P-256 key, its CSR and the registration's signature; `zeroize` wipes
# the key's PKCS #8 copy. `x509-parser` reads a gateway's CSR, checks its signature and encodes
# its public key as the certs service does before hashing it.
rcgen = { workspace = true, features = ["crypto", "pem", "ring", "x509-parser", "zeroize"] }
# A registration's root CRL is checked with the gateway agent's own checks (Laysi/trustiot-v2#832),
# so the workstation never sends one the gateway would refuse.
root-crl = { path = "../../crates/root-crl" }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
# The system's trust anchors, unless --ca-file names others.
rustls-native-certs.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The SHA-256 of a registration's body, of the gateway's keys and of the root certificate.
sha2.workspace = true
thiserror.workspace = true
# `process`: the system's ssh, for `register --gateway`; `macros` for its `join!`.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tracing.workspace = true
# Log lines on stderr, only from this crate (TRUSTIOT_WORKSTATION_LOG).
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }
# `printable` escapes format characters (bidi overrides, zero-width spaces) besides controls.
unicode-properties = { workspace = true, features = ["general-category"] }
# The platform URL.
url.workspace = true
# Reads the workstation certificate: purpose, subject, validity and public key; `verify` checks
# the signatures of a registration's certificate chain (ring, already in the build).
x509-parser = { workspace = true, features = ["verify"] }
zeroize.workspace = true

[dev-dependencies]
# `trustiot-agent provision` itself (`agent::provision::run`) against a software TPM, behind the
# fake ssh of tests/pipeline_swtpm.rs; without the test-only `test-exempt-addresses` feature.
agent = { path = "../../edge/agent" }
# Stand-ins for the login, logout and workstation certificate endpoints, on loopback.
axum = { workspace = true, features = ["http1", "json", "tokio"] }
# Test CAs and the certificates they sign; reading the CSR the stand-in receives.
rcgen = { workspace = true, features = ["crypto", "pem", "ring", "x509-parser", "zeroize"] }
# The software TPM (swtpm in a container, `testkit::swtpm`, Laysi/trustiot-v2#611).
testkit = { path = "../../crates/testkit" }
time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
