[package]
name = "identity-keys"
description = "The internal identity signing keys of TrustIoT v2: the key set the cluster generates, the public JWK Set every service verifies with, and when each key signs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Strict base64url for the keys' members (RFC 7515 and 8037).
base64.workspace = true
# Ed25519 key pairs; `pem` and `pkcs8` read a key made by a person before
# Laysi/trustiot-v2#404 (the move from it), `zeroize` wipes keys on drop.
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8", "zeroize"] }
# New keys come from the operating system's CSPRNG.
getrandom.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# RFC 7638 thumbprints, the key ids.
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true
