[package]
name = "testkit"
description = "Test support for TrustIoT v2: the cross-tenant negative test suite (decision 29), test identity tokens, throwaway containers, a fake Modbus endpoint with fault injection (M7), and the gateway's MQTT path (test PKI, WebSocket front, Mosquitto with mTLS). A dev-dependency only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Only ever a [dev-dependencies] entry (tools/repo-check enforces it). The suite runs SQL that
# its macros build from declarations at compile time, so tools/sql-check treats these sources as
# test code (TEST_SUPPORT).

[dependencies]
# Signs test identity tokens (`identity`) with a key made for the test process.
base64.workspace = true
contract = { path = "../contract" }
ed25519-dalek.workspace = true
http.workspace = true
# The migration Job, which `product` runs to apply the whole product's Postgres schema.
migrate = { path = "../../tools/migrate" }
# A throwaway CA and server certificate for the TLS Postgres (`postgres`).
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
# The gateway role of the MQTT broker (`mqtt::mosquitto`).
protocol = { path = "../protocol" }
# The test PKI, the WebSocket front and in-process TLS servers (`mqtt`).
futures-util = { workspace = true, features = ["sink", "std"] }
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# Stops a listening socket for every copy of its descriptor (`mqtt::stop_listening`).
socket2.workspace = true
# Names the swtpm image after the SHA-256 of its Containerfile (`swtpm`); rustls' provider, so
# no second crypto library.
ring.workspace = true
# Calls the service under test over plain HTTP on the loopback interface.
reqwest.workspace = true
serde_json.workspace = true
service-kit = { path = "../service-kit" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
# Also the fake Modbus endpoint (`modbus`) and the clock helpers (`clock`).
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# The self-test's example service.
axum = { workspace = true, features = ["http1", "json", "tokio"] }
serde = { workspace = true, features = ["derive"] }
# `test-util`: the fake Modbus tests pause the clock (`start_paused`).
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
# A Modbus client written by others: the fake endpoint's tests check its hand-written framing
# against it.
tokio-modbus = { workspace = true, features = ["rtu", "tcp"] }

[lints]
workspace = true
