[package]
name = "protocol"
description = "Gateway <-> cloud MQTT message formats (topics, payloads, limits, broker ACL) shared by the edge agent and the cloud services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The gateway is a Raspberry Pi: every dependency here must be pure Rust and build for
# aarch64-unknown-linux-gnu without a C toolchain. `tests/dependencies.rs` enforces an allowlist.
[dependencies]
cbor4ii = { workspace = true, features = ["half-f16", "serde1", "use_std"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
