[package]
name = "service-kit"
description = "Shared skeleton for TrustIoT v2 cloud services: configuration, health, SIGTERM handling, tracing, scheduled-job locks, and tenant-isolated Postgres."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# A demonstration service built on the kit. The integration tests run it as a real process (and as
# PID 1 in a container) to prove the shutdown, health, and logging behaviour end to end.
[[bin]]
name = "example-service"
path = "src/bin/example-service.rs"
test = false
doc = false

[features]
default = ["contract"]
# Everything in the kit that needs crates/contract: the M1 error body of the errors the kit answers
# itself, verification of internal identity tokens (`identity`), and tenant-scoped Postgres
# transactions (`tenant`), which take the tenant from that identity. services/ai-gateway must not
# depend on crates/contract (decision 28), so it turns default features off;
# tests/dependency_isolation.rs checks that this keeps contract out.
contract = ["dep:base64", "dep:contract", "dep:ed25519-dalek", "dep:getrandom", "dep:zeroize"]

[dependencies]
axum = { workspace = true, features = ["http1", "json", "matched-path", "query", "tokio"] }
# Strict base64url decoding of the internal identity token's segments (`contract` feature).
base64 = { workspace = true, optional = true }
contract = { path = "../contract", optional = true }
# Ed25519 signature verification of internal identity tokens (`contract` feature); `fast` adds the
# precomputed tables that speed it up. It also signs the proofs of a run delegation
# (Laysi/trustiot-v2#551) with the run's own key, which `zeroize` wipes on drop.
ed25519-dalek = { workspace = true, optional = true, features = ["fast", "zeroize"] }
# The operating system's CSPRNG, for a run delegation's key (`contract` feature).
getrandom = { workspace = true, optional = true }
humantime.workspace = true
opentelemetry = { workspace = true, features = ["internal-logs", "logs", "metrics", "trace"] }
opentelemetry-otlp = { workspace = true, features = ["http-proto", "internal-logs", "logs", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["internal-logs", "logs", "metrics", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The SHA-256 of each migration file a service expects (`migrations`), compared with the hash the
# migration Job recorded.
sha2.workspace = true
# TLS with rustls and ring: connections always verify the server (`postgres`, checklist M3). The
# root Cargo.toml replaces webpki-roots with an empty list, so the configured CA is the only trust
# anchor (Laysi/trustiot-v2#272); a feature that loads the system store instead is refused by
# tests/postgres_trust.rs.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
toml.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "std", "tracing-log"] }
# Wipes the seed of a run delegation's key (`contract` feature).
zeroize = { workspace = true, optional = true }

[dev-dependencies]
# The `log` crate and its tracing bridge, to send events through the same path a dependency such
# as reqwest uses (telemetry log filter tests).
log.workspace = true
tracing-log = { workspace = true, features = ["log-tracer", "std"] }
# A throwaway CA and server certificate for the TLS Postgres the tenant tests start.
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
# The black-hole TCP proxy of the job-lock partition tests.
tokio = { workspace = true, features = ["io-util"] }
# The empty stand-in for webpki-roots that sqlx is built with (tests/postgres_trust.rs).
webpki-roots.workspace = true

[lints]
workspace = true
