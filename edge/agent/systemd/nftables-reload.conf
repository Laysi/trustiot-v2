# Drop-in for Debian's nftables.service (edge/agent/README.md, section "systemd"). Installed as
# /usr/lib/systemd/system/nftables.service.d/trustiot-agent-egress.conf, together with
# trustiot-agent-egress.service.
#
# Debian's reload runs `nft -f /etc/nftables.conf`, which begins with `flush ruleset`: on its own it
# would remove the agent's egress rules while the agent keeps running, until the egress unit loads
# them again. This reload has nft include the host's configuration and the agent's rules in one
# transaction instead, so the rules are never absent. nft reads both files itself: when either is
# missing, unreadable or does not load, the whole transaction fails and nothing changes (a shell
# pipeline that feeds them to nft would hide a failed read and apply the flush alone). A restart or
# stop of nftables.service restarts or stops the agent first: trustiot-agent-egress.service
# requires it.

[Service]
ExecReload=
ExecReload=/usr/sbin/nft 'include "/etc/nftables.conf"; include "/usr/share/trustiot-agent/trustiot-agent-egress.nft"'
