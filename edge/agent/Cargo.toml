[package]
name = "agent"
description = "The TrustIoT gateway agent (decision 10): the trustiot-agent service with its MQTT 5 connection to the cloud (a 443 WebSocket with mTLS inside), its TPM identity key (decision 12), presence and heartbeat, and its Modbus reading (rebuild checklist F1, F5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "trustiot-agent"
path = "src/main.rs"

# The agent runs on the gateway: every dependency must build for aarch64-unknown-linux-gnu (ci.yml
# builds every edge/ member for that target). All are pure Rust except ring (the TLS provider),
# whose build script compiles C and assembly with the target's C compiler: native on an arm64
# host, Zig through cargo-zigbuild when cross-compiling. tests/dependencies.rs keeps out
# webpki-roots, rustls-native-certs, OpenSSL, aws-lc and the TPM C libraries.
[dependencies]
bytes.workspace = true
# The WebSocket's Stream and Sink, adapted to AsyncRead and AsyncWrite for the inner TLS.
futures-util = { workspace = true, features = ["sink", "std"] }
protocol = { path = "../../crates/protocol" }
# SHA-256 of what the TPM signs, and the check of the TPM key's test signature (`tpm`). rustls'
# own provider, so no second crypto library.
ring.workspace = true
# TLS 1.3 only, so neither crate needs its `tls12` feature; ring is the only provider. The TPM
# key is a rustls `SigningKey` (`tpm`).
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
# TCP keepalive with its interval and probe count (`transport::configure_tcp`); tokio can only
# switch keepalive on. `all` adds those options (and their getters), no code of its own.
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
# The client handshake only; TLS is ours (tokio-rustls), so no TLS or root-store features.
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
# The gateway ID (CN), the public key and the expiry of the client certificate.
x509-parser.workspace = true

[dev-dependencies]
# A test CA and certificates made at test time, also for the TPM key in the TPM tests.
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
# The fake TPM's software key (`ring::signature::EcdsaKeyPair`).
ring = { workspace = true, features = ["alloc"] }
serde_json.workspace = true
# The fake Modbus endpoint with fault injection (`testkit::modbus`), the paused clock, the
# Mosquitto broker with mTLS and WebSocket front (`testkit::mqtt`), and the swtpm container
# (`testkit::container`).
testkit = { path = "../../crates/testkit" }
# `process` runs the executable (tests/binary.rs).
tokio = { workspace = true, features = ["macros", "process", "rt", "test-util"] }

[lints]
workspace = true
