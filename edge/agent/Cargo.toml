[package]
name = "agent"
description = "The TrustIoT gateway agent (decision 10). So far its Modbus reading (rebuild checklist F1, F2, F5): merged reads, a Modbus TCP and RTU-over-TCP client for the read function codes 1-4 with one shared connection per endpoint, decoding, and scaling; and polling each device on a fixed schedule with timeouts, reconnect backoff, TCP keepalive and a watchdog (F4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test code only: `TcpConnection::exempt_for_tests` and `Endpoints::exempt_for_tests`, which let a
# test reach the fake Modbus endpoint on 127.0.0.1 although the address guard refuses loopback
# (src/modbus/address.rs, Laysi/trustiot-v2#653). Only dev-dependencies enable it (the one on
# this crate below, and tools/lab-dataset's for its recorder test), so a build of the agent or of
# a tool that uses it never has it; `cargo test -p repo-check` fails when a normal or build
# dependency, another feature or a default enables it.
test-exempt-addresses = []

# The agent runs on the gateway: every dependency must build for aarch64-unknown-linux-gnu
# without a C toolchain (ci.yml builds every edge/ member for that target).
[dependencies]
# getifaddrs: the gateway's own interface addresses, which the address guard refuses.
libc.workspace = true
protocol = { path = "../../crates/protocol" }
# TCP keepalive's idle time, probe interval and probe count (`all` has the last two).
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }

[dev-dependencies]
# This crate's own tests, with the feature that lets them reach the fake endpoint on loopback.
agent = { path = ".", features = ["test-exempt-addresses"] }
# The fake Modbus endpoint with fault injection (`testkit::modbus`) and the paused clock.
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
