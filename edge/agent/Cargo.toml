[package]
name = "agent"
description = "The TrustIoT gateway agent (decision 10). So far its Modbus reading (rebuild checklist F1, F5): merged reads, a Modbus TCP client for the read function codes 1-4, decoding, and scaling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The agent runs on the gateway: every dependency must build for aarch64-unknown-linux-gnu
# without a C toolchain (ci.yml builds every edge/ member for that target).
[dependencies]
protocol = { path = "../../crates/protocol" }
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[dev-dependencies]
# The fake Modbus endpoint with fault injection (`testkit::modbus`) and the paused clock.
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
