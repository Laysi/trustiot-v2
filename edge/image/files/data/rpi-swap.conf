# TrustIoT gateway image (edge/image, Laysi/trustiot-v2#810): swap only into compressed memory.
# rpi-swap's default (auto, zram+file today) writes idle pages to /var/swap on the unencrypted
# root partition, and those pages can hold what the agent read from the encrypted data partition.
# Installed as /etc/rpi/swap.conf.d/60-trustiot.conf (edge/image/README.md, section 「日誌與置換空間」).
[Main]
Mechanism=zram
