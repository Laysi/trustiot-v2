# TrustIoT gateway image (edge/image, Laysi/trustiot-v2#810): unlocking the data partition.
# Installed as /usr/lib/systemd/system/systemd-cryptsetup@trustiot_data.service.d/trustiot-data.conf,
# a drop-in for the unit systemd-cryptsetup-generator makes from the /etc/crypttab line
# (edge/image/README.md, section 「資料分割區加密」).

[Unit]
# Never unlock a volume the setup did not create or check in this boot.
Requires=trustiot-data-setup.service
After=trustiot-data-setup.service
# The TPM on SPI shows up only when its driver probes, during boot.
Wants=dev-tpmrm0.device
After=dev-tpmrm0.device

[Service]
# The generated unit waits forever (TimeoutSec=infinity); a TPM that does not answer must not
# hold the volume's unlock, and with it the agent, in limbo.
TimeoutStartSec=2min
# systemd-cryptsetup holds the volume key: no core dump of it on the root partition.
LimitCORE=0
