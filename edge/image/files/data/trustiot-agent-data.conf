# TrustIoT gateway image (edge/image, Laysi/trustiot-v2#810): the agent runs only on the encrypted
# data partition. Installed as /usr/lib/systemd/system/trustiot-agent.service.d/trustiot-data.conf
# (edge/image/README.md, section 「資料分割區加密」).

[Unit]
# StateDirectory=trustiot-agent implies this already; named here so that the image does not
# depend on that rule. When the volume is not unlocked, the mount fails and the agent does not
# start.
RequiresMountsFor=/var/lib/trustiot-agent
# And never on the empty directory of the root partition underneath.
AssertPathIsMountPoint=/var/lib/trustiot-agent
# Not after the data partition was wiped because the TPM can no longer open it
# (Laysi/trustiot-v2#867): the gateway goes back to the factory. The setup leaves this file at
# every boot while the volume's header carries the mark of the wipe, until the factory removes it
# (edge/image/README.md, section 「TPM 永久解不開時」).
ConditionPathExists=!/run/trustiot-back-to-factory

[Service]
# The agent holds the partition's contents in memory: no core dump of it on the root partition.
LimitCORE=0
