# TrustIoT gateway image (edge/image, Laysi/trustiot-v2#810): the journal stays in memory, so what
# services log about the data partition's contents (the agent at debug level logs device
# addresses, for example) never reaches the unencrypted root partition. Installed as
# /etc/systemd/journald.conf.d/zz-trustiot.conf (edge/image/README.md, section 「日誌與置換空間」).
# journald applies drop-ins in file name order across directories, and systemd's own
# /usr/lib/systemd/journald.conf.d/syslog.conf sets ForwardToSyslog=yes: this name sorts after it.
[Journal]
Storage=volatile
ForwardToSyslog=no
