[package]
name = "migrate"
description = "TrustIoT v2 migration Job: applies every service's Postgres migrations and the ClickHouse DDL with the migration role, creates the service roles idempotently, and gates service pods until it has finished."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "migrate"
path = "src/main.rs"
test = false
doc = false

[dependencies]
# SCRAM-SHA-256 verifiers for the service roles' passwords, computed here so a plaintext password
# never appears in an SQL statement.
base64.workspace = true
# The certs service's issuing CA keys the certs pod's init container keeps
# (`migrate certs-ca-keys`, src/ca_keys.rs).
ca-keys = { path = "../../crates/ca-keys" }
# The event `migrate bootstrap-platform-admin` publishes (`identity.platform_admin_granted`) and
# the user ID it carries (src/platform_admin.rs).
contract = { path = "../../crates/contract" }
getrandom.workspace = true
hmac.workspace = true
# The internal identity signing keys the identity pod's init container keeps
# (`migrate identity-signing-keys`, src/signing_keys.rs).
identity-keys = { path = "../../crates/identity-keys" }
# The outbox tables' DDL (crates/outbox/src/schema.rs), applied in producers' and consumers'
# schemas.
outbox = { path = "../../crates/outbox" }
# The gateway buffer's maximum age, which the raw data retention must exceed
# (services/ingest/src/retention.rs, compiled in as src/lib.rs's `retention`).
protocol = { path = "../../crates/protocol" }
# The Kubernetes API (wait-for-job) and an HTTPS ClickHouse: HTTP/1.1 over hyper with rustls and
# ring, and only the CA the deployment names as trust anchor (no system or public roots). Not
# reqwest: see src/http.rs.
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# kill(2): the MQTT broker's trust sidecar sends the broker SIGHUP (src/mqtt_trust.rs).
libc.workspace = true
percent-encoding.workspace = true
# The MQTT broker's placeholder CA and its CRL, generated when no gateway CA is available
# (src/mqtt_trust.rs).
rcgen = { workspace = true, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tokio-rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Configuration (the platform settings and TRUSTIOT__* variables), JSON logs, and verify-full
# Postgres connections. No contract feature: the Job handles no internal identity.
service-kit = { path = "../../crates/service-kit", default-features = false }
sha2.workspace = true
# Same TLS stack as service-kit: every connection verifies the server (checklist M3).
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tracing.workspace = true
uuid.workspace = true
# Parses the CA certificates and CRLs the MQTT broker is to load (src/mqtt_trust.rs).
x509-parser = { workspace = true, features = ["verify"] }
# Wipes key material read from a file or the Secret.
zeroize.workspace = true

[dev-dependencies]
# A person's PKCS#8 PEM key (from before Laysi/trustiot-v2#404) for the import tests.
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
# The TLS Postgres the integration tests start (shared with crates/service-kit's tests).
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
# The fake Kubernetes API of the wait-for-job tests serves HTTPS (tokio-rustls, a normal
# dependency) with a certificate from a test CA.
tokio = { workspace = true, features = ["io-util", "net", "sync"] }

[lints]
workspace = true
