[package]
name = "openapi"
description = "Generates api/openapi.json by merging the OpenAPI spec every service exposes from code with the shared M1 error schemas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The services whose specs go into api/openapi.json (SERVICES in src/lib.rs).
assets = { path = "../../services/assets" }
assistant = { path = "../../services/assistant" }
certs = { path = "../../services/certs" }
contract = { path = "../../crates/contract" }
gateway-ops = { path = "../../services/gateway-ops" }
identity = { path = "../../services/identity" }
telemetry-query = { path = "../../services/telemetry-query" }
serde_json.workspace = true
thiserror.workspace = true
utoipa.workspace = true

[lints]
workspace = true
