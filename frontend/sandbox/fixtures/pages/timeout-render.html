<svg width="200" height="60"><rect id="blink" width="20" height="20"></rect></svg>
<p>本週 <b id="week"></b> kWh</p>
<script>
  let timer;
  tq.on("data", (tq) => {
    tq.decor(document.getElementById("blink"));
    tq.text(document.getElementById("week"), "f|week_kwh", ",.1f");
    clearInterval(timer);
    // The document never stays unchanged long enough to count as drawn.
    timer = setInterval(() => document.getElementById("blink").classList.toggle("on"), 50);
  });
</script>
