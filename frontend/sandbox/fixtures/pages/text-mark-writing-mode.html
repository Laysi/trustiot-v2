<p>本週 <b id="week" style="writing-mode: vertical-rl"></b> kWh</p>
<p>目標 <b id="target" style="writing-mode: vertical-rl; rotate: 45deg"></b> kWh</p>
<p>尖峰 <b id="peak" style="writing-mode: sideways-lr"></b> kW</p>
<div style="writing-mode: vertical-lr; height: 120px"><p>第一天 <b id="day0" style="writing-mode: horizontal-tb"></b> kWh</p></div>
<svg width="240" height="120">
  <text id="day1" x="20" y="20" style="writing-mode: vertical-rl"></text>
  <text id="day2" x="80" y="20" style="writing-mode: sideways-rl"></text>
</svg>
<p>第七天 <b id="day6"></b> kWh</p>
<script>
  // Every number but the last is set in a vertical or sideways writing mode (its own or an
  // ancestor's), which turns it on screen; no transform is involved and textContent is unchanged.
  tq.on("data", (tq) => {
    tq.text(document.getElementById("week"), "f|week_kwh", ",.1f");
    tq.text(document.getElementById("target"), "k|target_kwh", ",.0f");
    tq.text(document.getElementById("peak"), "f|peak_kw", ",.2f");
    tq.text(document.getElementById("day0"), "c|daily_energy|kwh|0", ",.2f");
    tq.text(document.getElementById("day1"), "c|daily_energy|kwh|1", ",.2f");
    tq.text(document.getElementById("day2"), "c|daily_energy|kwh|2", ",.2f");
    tq.text(document.getElementById("day6"), "c|daily_energy|kwh|6", ",.2f");
  });
</script>
