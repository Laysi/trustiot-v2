<p>本週 <b id="week" style="unicode-bidi: bidi-override; direction: rtl"></b> kWh</p>
<script>
  // The digits read right-to-left under a bidi override: textContent is 690.0, the eye sees 0.096.
  tq.on("data", (tq) => {
    tq.text(document.getElementById("week"), "f|week_kwh", ",.1f");
  });
</script>
