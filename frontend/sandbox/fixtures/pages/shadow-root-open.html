<p>本週 <b id="week"></b> kWh</p>
<div id="host"></div>
<script>
  tq.on("data", (tq) => {
    tq.text(document.getElementById("week"), "f|week_kwh", ",.1f");
    const host = document.getElementById("host");
    if (host.shadowRoot === null) host.attachShadow({ mode: "open" }).append("隱藏的內容");
  });
</script>
