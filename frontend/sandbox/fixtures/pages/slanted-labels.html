<style>
  .kpi b { display: inline-block; rotate: -10deg; font: 600 28px/1.2 system-ui; }
  .bar { fill: var(--tq-series-1); }
</style>
<p class="kpi">本週<b id="week"></b>kWh</p>
<svg id="daily" width="600" height="300" viewBox="0 0 480 240"></svg>
<script>
  // Tick labels slanted -45° as d3 examples do, in a chart its viewBox scales up evenly.
  tq.on("data", (tq) => {
    tq.text(document.getElementById("week"), "f|week_kwh", ",.1f");
    const daily = tq.dataset("daily_energy");
    const svg = d3.select("#daily");
    svg.selectAll("*").remove();
    const x = d3.scaleBand(daily.rows.map((row) => row.day), [40, 470]).padding(0.2);
    const y = d3.scaleLinear([0, d3.max(daily.rows, (row) => row.kwh) ?? 0], [180, 10]).nice();
    const bottom = svg.append("g").attr("transform", "translate(0,180)");
    tq.axis(bottom.node(), d3.axisBottom(x), { dataset: "daily_energy", column: "day", format: "%m/%d" });
    bottom.selectAll(".tick text").attr("transform", "rotate(-45)").attr("text-anchor", "end");
    tq.axis(svg.append("g").attr("transform", "translate(40,0)").node(), d3.axisLeft(y), {
      dataset: "daily_energy",
      column: "kwh",
      format: ",.0f",
    });
    const bars = svg
      .append("g")
      .selectAll("rect")
      .data(daily.rows.filter((row) => row.kwh !== null))
      .join("rect")
      .attr("class", "bar")
      .attr("x", (row) => x(row.day))
      .attr("width", x.bandwidth())
      .attr("y", (row) => y(row.kwh))
      .attr("height", (row) => y(0) - y(row.kwh));
    tq.mark(bars, (row) => `c|daily_energy|kwh|${row.$row}`, { chart: "daily", channel: "height" });
  });
</script>
