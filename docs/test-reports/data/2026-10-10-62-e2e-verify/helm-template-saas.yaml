apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: trustiot-ingress-cookie-check
  labels:
    helm.sh/chart: trustiot-0.1.0
    app.kubernetes.io/name: trustiot
    app.kubernetes.io/instance: trustiot
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: trustiot
    app.kubernetes.io/component: ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: trustiot-ingress
  action: CUSTOM
  provider:
    name: trustiot-identity
  rules:
    # No public path is enabled: every request is checked.
    - {}

---
# Source: trustiot/templates/ingress.yaml
# Internal APIs between services live under /internal (decision 27). No route forwards that
# prefix, and this denies it even when a route such as "/" would match. CUSTOM runs first, so a
# request without a cookie gets 401 and one with a valid cookie gets 403.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: trustiot-ingress-deny-internal
  labels:
    helm.sh/chart: trustiot-0.1.0
    app.kubernetes.io/name: trustiot
    app.kubernetes.io/instance: trustiot
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: trustiot
    app.kubernetes.io/component: ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: trustiot-ingress
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - "/internal*"

---
# Source: trustiot/templates/ingress.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: trustiot-ingress
  labels:
    helm.sh/chart: trustiot-0.1.0
    app.kubernetes.io/name: trustiot
    app.kubernetes.io/instance: trustiot
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: trustiot
    app.kubernetes.io/component: ingress
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      app.kubernetes.io/name: trustiot
      app.kubernetes.io/instance: trustiot
      app.kubernetes.io/component: ingress
      app.kubernetes.io/part-of: trustiot
    parametersRef:
      group: ""
      kind: ConfigMap
      name: trustiot-ingress-options
  listeners:
    # cloudflared to the gateway is plain HTTP inside the host; Cloudflare terminates TLS.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
