---
# Source: trustiot/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trustiot-ingress
  labels:
    helm.sh/chart: trustiot-0.1.0
    app.kubernetes.io/name: trustiot
    app.kubernetes.io/instance: trustiot
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: trustiot
    app.kubernetes.io/component: ingress
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: trustiot-ingress
  policyTypes:
    - Ingress
  ingress:
    # Only the host (cloudflared, kubelet probes) may connect; other pods may not.
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32

---
# Source: trustiot/templates/ingress.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustiot-ingress-options
  labels:
    helm.sh/chart: trustiot-0.1.0
    app.kubernetes.io/name: trustiot
    app.kubernetes.io/instance: trustiot
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: trustiot
    app.kubernetes.io/component: ingress
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: istio-proxy
              resources:
                limits:
                  cpu: "2"
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
  service: |
    spec:
      # Reached only by cloudflared on the host; nothing listens on the host or the network.
      type: ClusterIP
  podDisruptionBudget: |
    spec:
      minAvailable: 1

