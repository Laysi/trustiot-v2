# Lab only (trustiot-mac-m1), Laysi/trustiot-v2#255 e2e, generated by make-hcc.ts from
# deploy/istio/istiod-values.yaml (with its meshConfig.pathNormalization): the provider
# "trustiot-e2e-255" points the repo's provider settings at the identity double in namespace
# e2e-255; the lab's existing providers are repeated unchanged (Helm replaces lists).
#
# Apply:     sudo k3s kubectl apply -f <this file>
# Roll back: sudo k3s kubectl -n kube-system delete helmchartconfig istiod
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: istiod
  namespace: kube-system
spec:
  valuesContent: |-
    meshConfig:
      extensionProviders:
        - envoyExtAuthzHttp:
            failOpen: false
            headersToUpstreamOnAllow:
              - x-internal-identity
            includeRequestHeadersInCheck:
              - cookie
            pathPrefix: /check
            port: 8080
            service: identity.poc.svc.cluster.local
            timeout: 0.5s
          name: identity
        - name: trustiot-e2e-255
          envoyExtAuthzHttp:
            service: trustiot-identity.e2e-255.svc.cluster.local
            port: 8080
            pathPrefix: /internal/ext-authz
            failOpen: false
            timeout: 0.5s
            statusOnError: "503"
            includeRequestHeadersInCheck:
              - cookie
            headersToUpstreamOnAllow:
              - x-internal-identity
      pathNormalization:
        normalization: DECODE_AND_MERGE_SLASHES
