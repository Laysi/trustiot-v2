# Lab only (trustiot-mac-m1), Laysi/trustiot-v2#63: re-runs the ingress e2e test under the new
# default-deny NetworkPolicy and service AuthorizationPolicies. Adds the extension provider
# "trustiot-e2e-63" for the identity double in namespace e2e-63, next to the edge PoC's provider
# "identity". k3s's helm-controller layers this HelmChartConfig over the istiod HelmChart in
# ~/stack/platform/istio.yaml without changing that file. Helm replaces lists instead of merging
# them, so the PoC provider is repeated here unchanged.
#
# Apply:     sudo k3s kubectl apply -f lab-istiod-helmchartconfig.yaml
# Roll back: sudo k3s kubectl -n kube-system delete helmchartconfig istiod
#            (helm-controller upgrades istiod again with only the HelmChart's values)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: istiod
  namespace: kube-system
spec:
  valuesContent: |-
    meshConfig:
      extensionProviders:
        - name: identity
          envoyExtAuthzHttp:
            service: identity.poc.svc.cluster.local
            port: 8080
            timeout: 0.5s
            failOpen: false
            pathPrefix: /check
            includeRequestHeadersInCheck: [cookie]
            headersToUpstreamOnAllow: [x-internal-identity]
        # Same settings as deploy/istio/istiod-values.yaml, pointed at the e2e namespace.
        - name: trustiot-e2e-63
          envoyExtAuthzHttp:
            service: trustiot-identity.e2e-63.svc.cluster.local
            port: 8080
            pathPrefix: /internal/ext-authz
            failOpen: false
            timeout: 0.5s
            statusOnError: "503"
            includeRequestHeadersInCheck: [cookie]
            headersToUpstreamOnAllow: [x-internal-identity]
