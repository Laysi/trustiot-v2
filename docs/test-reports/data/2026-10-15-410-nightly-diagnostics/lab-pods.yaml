apiVersion: v1
kind: Namespace
metadata:
  name: e2e-410
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: e2e-410
  annotations:
    note: __ANNOTATION__
spec:
  containers:
    - name: assets
      image: registry.invalid/trustiot/assets:nightly
      env:
        - name: PLAIN_VALUE
          value: __ENV__
---
apiVersion: v1
kind: Pod
metadata:
  name: exits-nonzero
  namespace: e2e-410
spec:
  containers:
    - name: identity
      image: docker.io/rancher/mirrored-library-busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo __LOG__; echo __TERM__ > /dev/termination-log; exit 3"]
      env:
        - name: PLAIN_VALUE
          value: __ENV__
---
apiVersion: v1
kind: Pod
metadata:
  name: out-of-memory
  namespace: e2e-410
spec:
  containers:
    - name: ingest
      image: docker.io/rancher/mirrored-library-busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo __LOG__; x=$(head -c 40000000 /dev/zero | tr '\\0' a); sleep 60"]
      resources:
        limits:
          memory: 16Mi
        requests:
          memory: 8Mi
      env:
        - name: PLAIN_VALUE
          value: __ENV__
---
apiVersion: v1
kind: Pod
metadata:
  name: never-ready
  namespace: e2e-410
spec:
  containers:
    - name: dashboard
      image: docker.io/rancher/mirrored-library-busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: PLAIN_VALUE
          value: __ENV__
      readinessProbe:
        exec:
          command: ["sh", "-c", "echo __PROBE__; exit 1"]
        periodSeconds: 5
