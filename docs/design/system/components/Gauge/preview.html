<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gauge — 預覽</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>
// ?theme=dark or ?theme=light sets html[data-theme] before first paint; without it the system setting decides.
(function () {
  var t = new URLSearchParams(location.search).get("theme");
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="ti-stack" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
  <article class="ti-tile"><div class="ti-gauge">
    <div class="ti-gauge__head"><span class="ti-tile__label">冷卻水塔 2 號・出水溫度</span><span class="ti-status ti-status--warning"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>警告</span></div>
    <button type="button" class="ti-source" aria-haspopup="dialog" aria-expanded="false" aria-label="冷卻水塔 2 號・出水溫度：32.6 °C，查看資料來源"><span class="ti-gauge__value">32.6</span><span class="ti-tile__unit">°C</span><span class="ti-source__hint"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg></span></button>
    <div role="meter" aria-label="冷卻水塔 2 號・出水溫度" aria-valuemin="20" aria-valuemax="40" aria-valuenow="32.6" aria-valuetext="32.6 °C，警告；警告 32、嚴重 34，量程 20–40 °C">
      <svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true" style="height:16px">
        <rect class="ti-gauge__track" x="0" y="4" width="100" height="8"/>
        <rect class="ti-gauge__zone--warning" x="60.00" y="4" width="10.00" height="8"/>
        <rect class="ti-gauge__zone--critical" x="70.00" y="4" width="30.00" height="8"/>
        <rect class="ti-gauge__fill--warning" x="0" y="4" width="63.00" height="8"/>
        <line class="ti-gauge__mark ti-gauge__mark--warning" x1="60.00" x2="60.00" y1="0" y2="16" vector-effect="non-scaling-stroke"/>
        <line class="ti-gauge__mark ti-gauge__mark--critical" x1="70.00" x2="70.00" y1="0" y2="16" vector-effect="non-scaling-stroke"/>
      </svg>
      <div aria-hidden="true" style="position:relative;height:16px;margin-top:var(--space-1);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap">
        <span class="ti-num" style="position:absolute;right:calc(40.00% + 4px);color:var(--status-warning)">警告 32</span>
        <span class="ti-num" style="position:absolute;left:calc(70.00% + 4px);color:var(--status-critical)">嚴重 34</span>
      </div>
    </div>
    <p class="ti-muted ti-num" style="font-size:12px;line-height:16px">量程 20–40 °C</p>
  </div></article>
  <article class="ti-tile"><div class="ti-gauge">
    <div class="ti-gauge__head"><span class="ti-tile__label">空壓機 1 號・電流</span><span class="ti-status ti-status--normal"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>正常</span></div>
    <button type="button" class="ti-source" aria-haspopup="dialog" aria-expanded="false" aria-label="空壓機 1 號・電流：42.7 A，查看資料來源"><span class="ti-gauge__value">42.7</span><span class="ti-tile__unit">A</span><span class="ti-source__hint"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg></span></button>
    <div role="meter" aria-label="空壓機 1 號・電流" aria-valuemin="0" aria-valuemax="80" aria-valuenow="42.7" aria-valuetext="42.7 A，正常；警告 60、嚴重 70，量程 0–80 A">
      <svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true" style="height:16px">
        <rect class="ti-gauge__track" x="0" y="4" width="100" height="8"/>
        <rect class="ti-gauge__zone--warning" x="75.00" y="4" width="12.50" height="8"/>
        <rect class="ti-gauge__zone--critical" x="87.50" y="4" width="12.50" height="8"/>
        <rect class="ti-gauge__fill--normal" x="0" y="4" width="53.38" height="8"/>
        <line class="ti-gauge__mark ti-gauge__mark--warning" x1="75.00" x2="75.00" y1="0" y2="16" vector-effect="non-scaling-stroke"/>
        <line class="ti-gauge__mark ti-gauge__mark--critical" x1="87.50" x2="87.50" y1="0" y2="16" vector-effect="non-scaling-stroke"/>
      </svg>
      <div aria-hidden="true" style="position:relative;height:16px;margin-top:var(--space-1);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap">
        <span class="ti-num" style="position:absolute;right:calc(25.00% + 4px);color:var(--status-warning)">警告 60</span>
        <span class="ti-num" style="position:absolute;left:calc(87.50% + 4px);color:var(--status-critical)">嚴重 70</span>
      </div>
    </div>
    <p class="ti-muted ti-num" style="font-size:12px;line-height:16px">量程 0–80 A</p>
  </div></article>
</div>

</body>
</html>
