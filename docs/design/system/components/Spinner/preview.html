<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spinner — 預覽</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>
// ?theme=dark or ?theme=light sets html[data-theme] before first paint; without it the system setting decides.
(function () {
  var t = new URLSearchParams(location.search).get("theme");
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="ti-stage">
  <span class="ti-spinner" role="status"><svg class="ti-icon ti-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>正在載入資料點…</span>
  <button type="button" class="ti-btn ti-btn--destructive" disabled><svg class="ti-icon ti-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>登出中…</button>
</div>

</body>
</html>
