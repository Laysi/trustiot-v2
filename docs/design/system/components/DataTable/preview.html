<script>
(function () {
  var btn = document.getElementById("sort"), th = document.getElementById("sort-th"), body = document.getElementById("body");
  var order = ["none", "descending", "ascending"], icons = { none: '<svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>', descending: '<svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>', ascending: '<svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(180deg)"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>' };
  var original = Array.prototype.slice.call(body.rows);
  btn.addEventListener("click", function () {
    var next = order[(order.indexOf(th.getAttribute("aria-sort")) + 1) % 3];
    th.setAttribute("aria-sort", next);
    var rows = original.slice();
    if (next !== "none") rows.sort(function (a, b) { return (+a.dataset.v - +b.dataset.v) * (next === "ascending" ? 1 : -1); });
    rows.forEach(function (r) { body.appendChild(r); });
    btn.lastElementChild.remove();
    btn.insertAdjacentHTML("beforeend", icons[next]);
  });
})();
</script>
