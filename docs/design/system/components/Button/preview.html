<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — 預覽</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>
// ?theme=dark or ?theme=light sets html[data-theme] before first paint; without it the system setting decides.
(function () {
  var t = new URLSearchParams(location.search).get("theme");
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="ti-stack">
  <div class="ti-stage" style="padding:0">
    <button type="button" class="ti-btn ti-btn--default">顯示</button>
    <button type="button" class="ti-btn ti-btn--secondary">取消</button>
    <button type="button" class="ti-btn ti-btn--outline"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>更新資料</button>
    <button type="button" class="ti-btn ti-btn--ghost">個人設定</button>
    <button type="button" class="ti-btn ti-btn--link">顯示最近 7 天</button>
    <button type="button" class="ti-btn ti-btn--destructive"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>登出所有裝置</button>
  </div>
  <div class="ti-stage" style="padding:0">
    <button type="button" class="ti-btn ti-btn--default ti-btn--sm">小（h-8）</button>
    <button type="button" class="ti-btn ti-btn--default">預設（h-9）</button>
    <button type="button" class="ti-btn ti-btn--default ti-btn--lg">大（h-10）</button>
    <button type="button" class="ti-btn ti-btn--outline ti-btn--icon" aria-label="更新資料"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button type="button" class="ti-btn ti-btn--outline ti-btn--outline-danger"><svg class="ti-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8"/><path d="M10 19v-3.96 3.15"/><path d="M7 19h5"/><rect width="6" height="10" x="16" y="12" rx="2"/></svg>登出所有裝置</button>
    <button type="button" class="ti-btn ti-btn--default" disabled><svg class="ti-icon ti-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>登出中…</button>
  </div>
</div>

</body>
</html>
