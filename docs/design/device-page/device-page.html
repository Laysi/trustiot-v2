    }
    const base = 229.9 + 3.3 * Math.sin(x * Math.PI * 2 + 0.6) + 0.5 * Math.sin(x * 37) + 0.35 * Math.sin(x * 211) + (r() - 0.5) * 0.12;
    const spread = 0.35 + r() * 0.9 + (x > 0.58 && x < 0.6 ? 2.8 : 0);
    out.push({ t, avg: base, min: base - spread * (0.4 + r() * 0.6), max: base + spread * (0.4 + r() * 0.6), count: 6 });
  }
  return out;
}

const RANGES = ["1 小時", "6 小時", "24 小時", "7 天", "30 天", "90 天"];

function histHeader(title, key, ai = true) {
  return `<div class="card-h"><div class="hist-title"><h2 id="hist">${title} 的歷史</h2><span class="xs muted mono">${key}</span></div>
    ${ai ? `<div class="ai-row only-wide"><button class="btn btn-ai btn-sm">${I("spark")}分析這段</button><button class="btn btn-ai btn-sm">${I("spark")}跟上週比</button></div>` : ""}</div>`;
}

function aiRowPhone() {
  return `<div class="ai-row only-phone" style="padding:0 16px 14px"><button class="btn btn-ai btn-sm" style="flex:1">${I("spark")}分析這段</button><button class="btn btn-ai btn-sm" style="flex:1">${I("spark")}跟上週比</button></div>`;
}

function statsBlock(data, zoomed = false) {
  const v = data.filter((d) => d.avg !== null);
  let mn = v[0], mx = v[0], sum = 0, cnt = 0;
  for (const d of v) { if (d.min < mn.min) mn = d; if (d.max > mx.max) mx = d; sum += d.avg * d.count; cnt += d.count; }
  return `<dl class="stats" ${zoomed ? 'aria-label="放大範圍內的統計"' : ""}>
    <div class="stat"><dt>${zoomed ? "平均（放大範圍）" : "平均"}</dt><dd>${n2(sum / cnt)}</dd></div>
    <div class="stat"><dt>最小</dt><dd>${n2(mn.min)}<span class="when">${mdhm(mn.t)}</span></dd></div>
    <div class="stat"><dt>最大</dt><dd>${n2(mx.max)}<span class="when">${mdhm(mx.t)}</span></dd></div>
    <div class="stat"><dt>讀數</dt><dd>${n0(cnt)} 筆<span class="when">${v.length < data.length ? `${n0(data.length - v.length)} 分鐘沒有讀數` : "無缺漏"}</span></dd></div>
  </dl>`;
}

function chartFoot(kind = "num", rows = 1440) {
  const legend = kind === "bool"
    ? `<span><span class="sw"></span>每 1 分鐘內為「開」的比例</span><span><span class="sw sw-gap"></span>沒有讀數</span>`
    : `<span><span class="sw"></span>每 1 分鐘的平均</span><span><span class="sw sw-band"></span>最小到最大</span><span><span class="sw sw-gap"></span>沒有讀數</span>`;
  return `<div class="chart-foot"><div class="legend">${legend}<span>時區 ${TZ}</span></div>
    <button class="btn btn-ghost btn-sm">${I("table")}以表格顯示（${n0(rows)} 列）</button></div>`;
}

const CHARTS = [];
function chartBox(id, data, opts = {}) {
  CHARTS.push({ id, data, opts });
  return `<div class="chart-wrap" id="${id}" role="slider" tabindex="0" aria-label="圖表，可以用方向鍵逐一讀取每個區間" ${opts.focus ? 'style="outline:2px solid var(--ring);outline-offset:-2px;border-radius:10px"' : ""}></div>`;

  }
  if (STATE === "never" || STATE === "nopoints") return ""; // no blank chart: the readings card already explains
  if (STATE === "text") return textHistory();
  const p = sel;
  const title = p.label ?? p.key;
  let data, extra = "", foot = "", body = "";

    return `<section class="card col-main">${histHeader(title, p.key, false)}${toolbar}${body}</section>`;
  }
  if (STATE === "outside") {
    body = `<div class="empty" role="status"><div class="ic">${I("cal")}</div><h3>這段時間超出可查期間</h3>

      <div class="acts"><button class="btn btn-primary">顯示 8/3 13:36 到現在</button></div></div>`;
    return `<section class="card col-main">${histHeader(title, p.key, false)}${toolbar}${body}</section>`;
  }
  if (STATE === "rangeempty") {
    body = `<div class="empty" role="status"><div class="ic">${I("line")}</div><h3>最近 1 小時沒有讀數</h3>
      <p><span class="mono">voltage_a</span> 在 12:36 到 13:36 之間沒有存入讀數，但較早的時間有資料。可以看更長的範圍，或確認設備有回報這個資料點。</p>

  else if (STATE === "truncated") data = series({ hours: 24, startAt: NOW - 15 * 3600e3 });

  if (STATE === "truncated") extra = `<div style="padding:12px 20px 0"><div class="note note-info">${I("info")}<div class="body"><p>範圍的開頭早於可查期間，圖從可查到的最早時間 8/3 13:36 開始。</p></div></div></div>`;
  if (STATE === "custom") extra = customPanel();
  const hover = STATE === "hover";
  const view = STATE === "hover" ? [NOW - 11.5 * 3600e3, NOW - 8 * 3600e3] : null;
  const stats = kind === "bool" ? boolStats(data) : statsBlock(view ? data.filter((d) => d.t >= view[0] && d.t < view[1]) : data, !!view);
  const zoom = STATE === "hover" ? `<div class="zoombar" role="status">${I("line")}<span class="sp">已放大到 11/1 02:06 – 05:36${phone() ? "" : "（框選、滾輪或拖曳下方導覽列）"}</span><button class="btn btn-primary btn-sm">把這段設為範圍</button><button class="btn btn-ghost btn-sm">${I("reset")}重設縮放</button></div>` : "";
  const fromchat = STATE === "fromchat" ? `<div style="padding:12px 20px 0"><div class="note note-info">${I("chat")}<div class="body"><p>從對話開啟：範圍與標示的時段來自 AI 的回答。</p></div></div></div>` : "";
  const readout = hover && phone() ? `<div class="readout" id="ro" role="status"></div>` : "";
  return `<section class="card col-main" aria-labelledby="hist">${histHeader(title, p.key)}${toolbar}${extra}${fromchat}${stats}${zoom}
    ${chartBox("c1", data, { kind, hover: hover ? 1 : null, hoverAt: NOW - 9.75 * 3600e3, view: STATE === "hover" ? [NOW - 11.5 * 3600e3, NOW - 8 * 3600e3] : null, mark: STATE === "fromchat", slider: !phone() && kind === "num", focus: STATE === "hover" && phone() })}${readout}${chartFoot(kind)}${aiRowPhone()}</section>`;

function boolStats(data) {
  const v = data.filter((d) => d.avg !== null);

      <thead><tr><th>值</th><th>從</th><th>到</th><th class="r">區間數</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="mono">${r[2]}</td><td class="num">${r[0]}</td><td class="num">${r[1]}</td><td class="r">${r[3]}</td></tr>`).join("")}</tbody></table></div>
    ${aiRowPhone()}</section>`;
}

function customPanel() {
  return `<div class="custom" role="group" aria-labelledby="cr-h"><p id="cr-h" class="sm" style="font-weight:600">自訂範圍</p><div class="fields">
    <div class="field"><label for="f1">開始</label><div class="input" id="f1"><span class="num">2026/11/01 08:00</span>${I("cal")}</div></div>
    <div class="field"><label for="f2">結束</label><div class="input" id="f2" aria-invalid="true" aria-describedby="f2e"><span class="num">2026/11/01 06:00</span>${I("cal")}</div><span class="err" id="f2e">結束時間要晚於開始時間。</span></div></div>
    <p class="xs muted">時間以你的時區（${TZ}）計算，可以在個人設定更改。可查到 2026/8/3 13:36 以後的資料。</p>
    <div class="acts"><button class="btn btn-primary btn-sm">顯示</button><button class="btn btn-ghost btn-sm">取消</button></div></div>`;
}

function page() {
  if (STATE === "notfound") {
    return `<div class="status-page" role="status"><div class="ic">${I("cpu")}</div><h1>找不到這台設備</h1>
      <p>示範組織沒有這個網址的設備。它可能已被刪除，或屬於其他組織：可以在頁首切換組織後再找找看。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary">看所有設備</button><button class="btn btn-outline">回到對話</button></div></div>`;
  }
  if (STATE === "pageerror") {
    return `<nav class="crumbs"><a href="#">設備</a></nav><div class="note note-err" role="alert" style="margin-top:12px">${I("x")}<div class="body"><p class="t">無法載入設備</p><p>伺服器暫時無法回應（503）。網址沒有問題，稍後再試通常就會恢復。</p><div class="acts"><button class="btn btn-outline btn-sm">${I("refresh")}重試</button></div></div></div>`;
  }
  if (STATE === "never" || STATE === "nopoints") return `${header()}<div class="grid">${latestCard()}<div class="col-side">${infoCard()}</div></div>`;
  return `${header()}${staleBanner()}<div class="grid">${historyCard()}<div class="col-side">${latestCard()}${infoCard()}</div></div>`;
}

// ---------- chart (static stand-in for the ECharts component) ----------
function drawChart({ id, data, opts }) {
  const el = document.getElementById(id); if (!el) return;
  const W = el.clientWidth - 20, H = phone() ? 220 : 300, slider = opts.slider ? 44 : 0;
  const m = { l: opts.kind === "bool" ? 40 : 44, r: 8, t: 10, b: 24 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const full = data;
  if (opts.view) data = data.filter((d) => d.t >= opts.view[0] && d.t < opts.view[1]);
  const t0 = data[0].t, t1 = data[data.length - 1].t + 60e3;
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * iw;
  let lo, hi;
  if (opts.kind === "bool") { lo = 0; hi = 1; } else {
    const v = data.filter((d) => d.avg !== null); lo = Math.min(...v.map((d) => d.min)); hi = Math.max(...v.map((d) => d.max));
    const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => k >= raw); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; opts.step = step;
  }
  const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  let s = `<svg width="${W}" height="${H + slider}" aria-hidden="true">`;
  s += `<defs><pattern id="hatch-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--border)" stroke-width="3"/></pattern></defs>`;
  // y grid
  const yt = opts.kind === "bool" ? [0, 0.5, 1] : (() => { const a = []; for (let v = lo; v <= hi + 1e-9; v += opts.step) a.push(v); return a; })();
  for (const v of yt) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${opts.kind === "bool" ? Math.round(v * 100) + "%" : n0(v)}</text>`;
  // x ticks: every 3 h (wide) or 6 h (phone), aligned to local hours
  const every = (opts.view ? (phone() ? 1 : 0.5) : phone() ? 6 : 3) * 3600e3, off = 8 * 3600e3;
  for (let t = Math.ceil((t0 + off) / every) * every - off; t < t1; t += every) {
    const lab = hm(t) === "00:00" ? md(t) : hm(t);
    s += `<line x1="${x(t)}" x2="${x(t)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--input)"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  }
  // segments and gaps
  const segs = []; let cur = []; const gaps = []; let gs = null;
  data.forEach((d) => { if (d.avg === null) { if (cur.length) segs.push(cur), (cur = []); if (gs === null) gs = d.t; } else { if (gs !== null) gaps.push([gs, d.t]), (gs = null); cur.push(d); } });
  if (cur.length) segs.push(cur); if (gs !== null) gaps.push([gs, t1]);
  for (const [a, b] of gaps) {
    if (b - a < 3 * 60e3) continue;
    s += `<rect x="${x(a)}" y="${m.t}" width="${x(b) - x(a)}" height="${ih}" fill="url(#hatch-${id})" opacity=".8"/>`;
    const mins = Math.round((b - a) / 60e3), lab = mins >= 60 ? `${Math.floor(mins / 60)} 小時 ${mins % 60} 分鐘沒有讀數` : `${mins} 分鐘沒有讀數`;
    if (x(b) - x(a) > 40) { const cx = (x(a) + x(b)) / 2, wl = lab.length * 11, tx = Math.min(cx, W - m.r - wl / 2 - 4); s += `<rect x="${tx - wl / 2 - 6}" y="${m.t + 4}" width="${wl + 12}" height="20" rx="5" fill="var(--card)" stroke="var(--border)"/><text x="${tx}" y="${m.t + 18}" text-anchor="middle" style="font-weight:600;fill:var(--foreground)">${lab}</text>`; }
  }
  if (opts.mark) { const a = NOW - 10.6 * 3600e3, b = NOW - 9.05 * 3600e3; s += `<rect x="${x(a)}" y="${m.t}" width="${x(b) - x(a)}" height="${ih}" fill="var(--brand-soft)" stroke="var(--primary)" stroke-dasharray="3 3"/><text x="${x(b) + 6}" y="${m.t + 14}" style="fill:var(--foreground);font-weight:600">AI 標示的時段</text>`; }
  for (const sg of segs) {
    if (opts.kind === "bool") {
      let p = `M${x(sg[0].t)},${y(0)}`; for (const d of sg) p += ` L${x(d.t)},${y(d.avg)} L${x(d.t + 60e3)},${y(d.avg)}`; p += ` L${x(sg[sg.length - 1].t + 60e3)},${y(0)} Z`;
      s += `<path d="${p}" fill="var(--chart-band)"/>`;
      let l = ""; sg.forEach((d, i) => (l += `${i ? " L" : "M"}${x(d.t)},${y(d.avg)} L${x(d.t + 60e3)},${y(d.avg)}`)); s += `<path d="${l}" fill="none" stroke="var(--primary)" stroke-width="1.5"/>`;
    } else {
      let band = sg.map((d, i) => `${i ? "L" : "M"}${x(d.t).toFixed(1)},${y(d.max).toFixed(1)}`).join(" ");
      band += " " + sg.slice().reverse().map((d) => `L${x(d.t).toFixed(1)},${y(d.min).toFixed(1)}`).join(" ") + " Z";
      s += `<path d="${band}" fill="var(--chart-band)"/>`;
      s += `<path d="${sg.map((d, i) => `${i ? "L" : "M"}${x(d.t).toFixed(1)},${y(d.avg).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--primary)" stroke-width="1.75" stroke-linejoin="round"/>`;
    }
  }
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--input)"/>`;
  let tip = "";
  if (opts.hover !== null && opts.hover !== undefined) {
    const d = data.reduce((best, c) => (c.avg !== null && Math.abs(c.t - opts.hoverAt) < Math.abs(best.t - opts.hoverAt) ? c : best), data.find((c) => c.avg !== null));
    const hx = x(d.t), hy = y(d.avg);
    s += `<line x1="${hx}" x2="${hx}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--foreground)" stroke-dasharray="3 3" opacity=".5"/>`;
    s += `<line x1="${hx - 6}" x2="${hx + 6}" y1="${y(d.min)}" y2="${y(d.min)}" stroke="var(--primary)" stroke-width="1.5"/><line x1="${hx - 6}" x2="${hx + 6}" y1="${y(d.max)}" y2="${y(d.max)}" stroke="var(--primary)" stroke-width="1.5"/>`;
    s += `<circle cx="${hx}" cy="${hy}" r="5" fill="var(--background)" stroke="var(--primary)" stroke-width="2.5"/>`;
    const ro = document.getElementById("ro");
    if (ro) ro.innerHTML = `<div><b>${mdhm(d.t)}</b> 的 1 分鐘</div><div class="row"><span>平均 <b>${n2(d.avg)}</b></span><span>最小 <b>${n2(d.min)}</b></span><span>最大 <b>${n2(d.max)}</b></span><span>${d.count} 筆</span></div>`;
    if (!phone()) {
      const left = hx > W / 2 ? hx - 226 : hx + 16;
      tip = `<div class="tip" style="left:${left + 8}px;top:${m.t + 20}px"><div style="font-weight:600">${mdhm(d.t)} 的 1 分鐘</div><dl><dt>平均</dt><dd>${n2(d.avg)}</dd><dt>最小</dt><dd>${n2(d.min)}</dd><dt>最大</dt><dd>${n2(d.max)}</dd><dt>讀數</dt><dd>${d.count} 筆</dd></dl></div>`;
    }
  }
  if (slider) {
    const sy = H + 8, sh = 30;
    const v = full.filter((d) => d.avg !== null);
    const x = (t) => m.l + ((t - full[0].t) / (full[full.length - 1].t + 60e3 - full[0].t)) * iw;
    s += `<rect x="${m.l}" y="${sy}" width="${iw}" height="${sh}" rx="6" fill="var(--muted)"/>`;
    const yy = (val) => sy + sh - 4 - ((val - lo) / (hi - lo)) * (sh - 8);
    s += `<path d="${v.filter((_, i) => i % 6 === 0).map((d, i) => `${i ? "L" : "M"}${x(d.t).toFixed(1)},${yy(d.avg).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--muted-foreground)" stroke-width="1"/>`;
    if (STATE === "hover") {
      const a = x(opts.view[0]), b = x(opts.view[1]);
      s += `<rect x="${a}" y="${sy}" width="${b - a}" height="${sh}" fill="var(--chart-band)" stroke="var(--primary)"/><rect x="${a - 4}" y="${sy + 6}" width="8" height="${sh - 12}" rx="3" fill="var(--background)" stroke="var(--primary)"/><rect x="${b - 4}" y="${sy + 6}" width="8" height="${sh - 12}" rx="3" fill="var(--background)" stroke="var(--primary)"/>`;
    }
  }
  el.innerHTML = s + "</svg>" + tip;
}

function render() {
  CHARTS.length = 0;
  document.getElementById("app").innerHTML = `<main id="main">${page()}</main>` + reviewBar();
  CHARTS.forEach(drawChart);
  const r = document.getElementById("rv"); if (r) r.onchange = () => { location.hash = `state=${r.value}`; location.reload(); };
}
const STATES = ["normal", "hover", "bool", "text", "loading", "stale", "never", "nopoints", "outside", "truncated", "rangeempty", "custom", "error", "model-failed", "pageerror", "notfound", "long", "fromchat", "dark"];
function reviewBar() { return `<div class="review">狀態 <select id="rv">${STATES.map((s) => `<option ${s === STATE ? "selected" : ""}>${s}</option>`).join("")}</select></div>`; }
render();
let rw = window.innerWidth; window.addEventListener("resize", () => { if (window.innerWidth !== rw) { rw = window.innerWidth; render(); } });
</script>
<script>
/* app shell: docs/design/app-shell.md (the same script in every page) */
(() => {
  const shell = document.querySelector("[data-app-shell]");
  if (!shell) return;
  const pops = [...shell.querySelectorAll("[data-app-shell-pop]")];
  const parts = (pop) => ({ btn: pop.querySelector("[aria-haspopup]"), menu: pop.querySelector('[role="menu"]') });
  const items = (menu) => [...menu.querySelectorAll('[role^="menuitem"]')].filter((el) => el.getClientRects().length > 0);
  const close = (pop, refocus) => {
    const { btn, menu } = parts(pop);
    if (menu.hidden) return;
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    if (refocus) btn.focus();
  };
  const open = (pop, where) => {
    for (const p of pops) if (p !== pop) close(p, false);
    const { btn, menu } = parts(pop);
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    if (!where) return;
    const list = items(menu);
    const chosen = list.find((el) => el.getAttribute("aria-current") === "page" || el.getAttribute("aria-checked") === "true");
    (where === "last" ? list[list.length - 1] : chosen || list[0])?.focus();
  };
  for (const pop of pops) {
    const { btn, menu } = parts(pop);
    btn.addEventListener("click", () => (menu.hidden ? open(pop, "first") : close(pop, false)));
    btn.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); open(pop, e.key === "ArrowUp" ? "last" : "first"); }
      else if (e.key === "Escape" && !menu.hidden) { e.preventDefault(); close(pop, true); }
    });
    menu.addEventListener("keydown", (e) => {
      const list = items(menu);
      const i = list.indexOf(document.activeElement);
      const go = (n) => { e.preventDefault(); list[(n + list.length) % list.length]?.focus(); };
      if (e.key === "ArrowDown") go(i + 1);
      else if (e.key === "ArrowUp") go(i < 0 ? -1 : i - 1);
      else if (e.key === "Home") go(0);
      else if (e.key === "End") go(-1);
      else if (e.key === "Escape") { e.preventDefault(); close(pop, true); }
      else if (e.key === "Tab") {
        // Close first, then move focus ourselves: the items are about to be hidden, so the
        // browser's own Tab move would start from a hidden element.
        e.preventDefault();
        close(pop, false);
        const sel = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]';
        const order = [...document.querySelectorAll(sel)].filter((el) => el.tabIndex >= 0 && el.getClientRects().length > 0);
        (order[order.indexOf(btn) + (e.shiftKey ? -1 : 1)] ?? btn).focus();
      }
    });
    menu.addEventListener("click", (e) => {
      const item = e.target.closest('[role^="menuitem"]');
      if (!item) return;
      if (item.dataset.org) {
        for (const r of menu.querySelectorAll("[data-org]")) r.setAttribute("aria-checked", String(r === item));
        btn.querySelector(".app-shell__org-name").textContent = item.dataset.org;
        btn.setAttribute("aria-label", "切換組織，目前是" + item.dataset.org);
      }
      close(pop, item.tagName !== "A");
    });
  }
  document.addEventListener("pointerdown", (e) => {
    const inside = e.target instanceof Element ? e.target.closest("[data-app-shell-pop]") : null;
    for (const p of pops) if (p !== inside) close(p, false);
  });
  // Mock-only switches: a page state (ms4-ms5's ?state=) can mark itself with data-shell-* and
  // ?menu=open draws the menu open for review.
  const state = document.querySelector("[data-state].on")?.dataset ?? {};
  if (state.shellPage === "home") {
    for (const el of shell.querySelectorAll(".app-shell__back, .app-shell__back-icon")) el.remove();
    shell.querySelector(".app-shell__bar--sub")?.classList.remove("app-shell__bar--sub");
    shell.querySelector('[aria-current="page"]')?.removeAttribute("aria-current");
  }
  if (state.shellRole === "viewer") shell.querySelector("[data-app-shell-admin]")?.remove();
  if (state.shellUnread === "0") {
    for (const el of shell.querySelectorAll("[data-app-shell-unread]")) el.remove();
    shell.querySelector(".app-shell__menu-btn")?.removeAttribute("aria-label");
  }
  const nav = shell.querySelector("[data-app-shell-nav]");
  if (new URLSearchParams(location.search).get("menu") === "open" || state.shellMenu === "open") open(nav, null);
})();
</script>
