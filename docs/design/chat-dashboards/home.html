<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁＝對話｜對話與儀表板設計稿</title>
<link rel="stylesheet" href="assets/base.css">
<script src="assets/ui.js"></script>
</head>
<body data-page="home">
<div class="app">
  <header class="site-header" id="site-header"></header>

  <main class="home">
    <div class="home__in">
      <div class="home__hero">
        <span data-logo="logo--lg"></span>
        <div style="display: grid; gap: 8px">
          <h1 class="home__title">下午好，想知道設備的什麼事？</h1>
          <p class="muted"><span data-org>東區示範廠</span>・12 台設備、3 台 TrustIoT 閘道器・每個數字都附資料來源</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <label for="home-msg" class="sr-only">問 TrustIoT</label>
        <textarea id="home-msg" rows="3" placeholder="問問你的設備，例如：冷卻水塔 2 號這週用電多少？" aria-describedby="home-hint"></textarea>
        <div class="composer__bar">
          <span id="home-hint" class="composer__hint">Enter 送出，Shift + Enter 換行</span>
          <span id="home-sending" class="spinner" role="status" hidden><i data-icon="loader" class="spin"></i>正在查詢讀數…</span>
          <div class="composer__actions">
            <button type="submit" class="btn btn--default btn--icon" id="home-send" aria-label="送出" disabled><i data-icon="arrow-up"></i></button>
          </div>
        </div>
      </form>

      <p id="home-done" role="status" class="muted" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px" hidden>回答已產生。<a href="conversation.html" style="display: inline-flex; align-items: center; gap: 4px; font-weight: 500; text-decoration: none">看「對話中」畫面<i data-icon="arrow-right"></i></a></p>

      <section aria-labelledby="home-sugg" style="display: grid; gap: 12px">
        <h2 id="home-sugg" class="section-label" style="font-size: 14px; line-height: 20px">根據你設備最近的變化，可以先問：</h2>
        <ul class="suggest" id="suggest" aria-labelledby="home-sugg"></ul>
      </section>

      <p class="home__foot">
        <span>常看的圖表可以在回答裡按「釘選到儀表板」。</span>
        <a href="list.html">已存的儀表板（5）</a>
      </p>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var h = TI.h;
  var SUGGESTIONS = [
    { q: "冷卻水塔 2 號這週為什麼耗電變高？", meta: "用電比上週同期高 18%", icon: "zap" },
    { q: "哪些閘道器現在離線？", meta: "1 台 TrustIoT 閘道器超過 10 分鐘沒有回報", icon: "router" },
    { q: "倉儲區今天的濕度有沒有超過 70 %RH？", meta: "倉儲區溫濕度計・每 5 分鐘", icon: "thermometer" },
    { q: "空壓機 1 號這個月運轉了幾小時？", meta: "空壓機 1 號・電流與運轉時數", icon: "clock" },
    { q: "昨晚 22:00 後有哪些設備發出警告？", meta: "3 則警告，2 則已恢復", icon: "triangle-alert" },
    { q: "把三台冷卻水塔的出水溫度畫在一起", meta: "冷卻水塔 1–3 號・最近 24 小時", icon: "chart-line" }
  ];
  var text = document.getElementById("home-msg");
  var send = document.getElementById("home-send");
  var hint = document.getElementById("home-hint");
  var sending = document.getElementById("home-sending");
  var done = document.getElementById("home-done");
  var list = document.getElementById("suggest");
  var busy = false, timer = null;
  var buttons = SUGGESTIONS.map(function (s) {
    var b = h("button", { type: "button", class: "suggest__item", "aria-pressed": "false",
      onclick: function () {
        text.value = s.q;
        buttons.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        done.hidden = true;
        update();
        text.focus();
      } }, TI.icon(s.icon), h("span", { text: s.q }), h("span", { class: "suggest__meta", text: s.meta }));
    list.appendChild(h("li", null, b));
    return b;
  });
  function update() { send.disabled = !text.value.trim() || busy; }
  function submit() {
    if (!text.value.trim() || busy) return;
    busy = true; done.hidden = true; hint.hidden = true; sending.hidden = false; update();
    clearTimeout(timer);
    timer = setTimeout(function () { busy = false; sending.hidden = true; hint.hidden = false; done.hidden = false; update(); }, 1200);
  }
  text.addEventListener("input", function () {
    buttons.forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
    done.hidden = true; update();
  });
  text.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  document.getElementById("composer").addEventListener("submit", function (e) { e.preventDefault(); submit(); });
})();
</script>
</body>
</html>
