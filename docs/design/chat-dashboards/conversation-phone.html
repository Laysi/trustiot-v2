<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對話中（手機 390）｜對話與儀表板設計稿</title>
<link rel="stylesheet" href="assets/base.css">
<script src="assets/ui.js"></script>
</head>
<body data-page="conversation-phone">
<div class="app app--phone">
  <header class="site-header" id="site-header"></header>

  <main style="flex: 1 1 auto; padding: 16px">
    <ol class="thread" aria-label="對話內容" id="thread">
      <li class="ask" style="max-width: 85%"><span class="sr-only">你問：</span>冷卻水塔 2 號這週為什麼耗電變高？</li>
      <li class="answer answer--bare">
        <article class="answer__body" aria-label="TrustIoT 的回答">
          <div class="answer__text">
            <p>這週到目前用了 <strong>1,216 kWh</strong>，比上週同期多 18%。</p>
            <p>10/29 起風扇平均功率由 6.1 kW 升到 8.8 kW，1 號、3 號沒有變化，所以不是天氣造成的。建議檢查散熱片與風扇皮帶。</p>
          </div>
          <div class="tile-grid tile-grid--2" style="gap: 8px">
            <article class="tile tile--compact" aria-label="本週用電">
              <span class="tile__label">本週用電</span>
              <div class="tile__main"><span><span class="tile__value">1,216</span> <span class="tile__unit">kWh</span></span></div>
              <span class="delta delta--bad"><i data-icon="trending-up"></i>+18%</span>
            </article>
            <article class="tile tile--compact" aria-label="風扇平均功率，10/29 起">
              <span class="tile__label">風扇功率（10/29 起）</span>
              <div class="tile__main"><span><span class="tile__value">8.8</span> <span class="tile__unit">kW</span></span></div>
              <span class="status status--plain status--warning"><i data-icon="triangle-alert"></i>警告</span>
            </article>
          </div>
          <section class="embed" id="embed" aria-labelledby="ph-chart" style="padding: 12px">
            <div class="embed__head">
              <div>
                <h3 class="embed__title" id="ph-chart">冷卻水塔風扇功率</h3>
                <p class="embed__desc">最近 7 天，每 2 小時平均，kW</p>
              </div>
            </div>
            <div id="chart"></div>
          </section>
          <div class="answer__actions">
            <button type="button" class="btn btn--default btn--sm" id="pin-btn"><i data-icon="pin"></i>釘選</button>
            <button type="button" class="btn btn--ghost btn--sm" id="answer-src" aria-haspopup="dialog" aria-expanded="false"><i data-icon="database"></i>資料來源</button>
            <button type="button" class="btn btn--outline btn--sm" id="compare"><i data-icon="history"></i>跟上週比</button>
          </div>
          <div role="status" id="pin-status"></div>
          <div id="src-slot"></div>
        </article>
      </li>
    </ol>
  </main>

  <div style="position: sticky; bottom: 0; z-index: 5; padding: 8px 12px 16px; border-top: 1px solid var(--border); background: var(--background)">
    <form class="composer composer--phone" id="composer">
      <label for="ph-msg" class="sr-only">繼續問 TrustIoT</label>
      <div class="composer__row">
        <textarea id="ph-msg" rows="1" placeholder="繼續問…"></textarea>
        <button type="submit" class="btn btn--default btn--icon" id="ph-send" aria-label="送出" disabled><i data-icon="arrow-up"></i></button>
      </div>
    </form>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script>
(function () {
  "use strict";
  var h = TI.h, icon = TI.icon, D = TI.data;
  var $ = function (id) { return document.getElementById(id); };
  var src = false;

  var idx = []; for (var i = 0; i < 80; i++) idx.push(i);
  TI.timeSeries($("chart"), {
    series: ["1 號", "2 號", "3 號"].map(function (n, k) { return { name: n, cls: "s" + (k + 1) }; }),
    times: idx, vals: D.fanVals, yMin: 0, yMax: 12, yTicks: [12, 6, 0],
    height: 168, yW: 20, top: 0, bottom: 20, right: 0, unit: " kW", interactive: false, legendClass: "legend--sm",
    ariaLabel: "冷卻水塔 1 到 3 號的風扇功率，2 號從 10/29 起由約 6 kW 升到約 9 kW",
    timeLabel: function (t, i) { return D.fanTimeLabel(i); },
    xTicks: function () { return [{ align: "left", text: "10/26" }, { pct: 45.6, text: "10/29" }, { align: "right", text: "11/01" }]; }
  });

  $("pin-btn").addEventListener("click", function () {
    $("embed").classList.add("embed--pinned");
    $("pin-btn").hidden = true;
    TI.replace($("pin-status"), [h("span", { class: "pinned" }, icon("check"), "已釘選到「冷卻水塔週報」")]);
  });
  $("answer-src").addEventListener("click", function () {
    src = !src;
    $("answer-src").setAttribute("aria-expanded", String(src));
    var close = function () { src = false; $("answer-src").setAttribute("aria-expanded", "false"); TI.replace($("src-slot"), []); };
    TI.replace($("src-slot"), src ? [TI.sourcePanel(D.conversationSources.answer, { onClose: close })] : []);
  });
  var text = $("ph-msg"), send = $("ph-send");
  function update() { send.disabled = !text.value.trim(); }
  $("compare").addEventListener("click", function () { text.value = "跟上週同一時段比？"; update(); text.focus(); });
  text.addEventListener("input", update);
  $("composer").addEventListener("submit", function (e) { e.preventDefault(); text.value = ""; update(); });
})();
</script>
</body>
</html>
