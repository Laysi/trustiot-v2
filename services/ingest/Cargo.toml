[package]
name = "ingest"
description = "TrustIoT v2 ingest service: telemetry from gateways into ClickHouse with end-to-end acknowledgement, tenants from its own gateway binding projection. Holds the ClickHouse schema (migrations/clickhouse)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The service is built in steps under Laysi/trustiot-v2#91: readiness and the gateway binding
# projection (Laysi/trustiot-v2#640), then the telemetry path (Laysi/trustiot-v2#641). The crate also carries the ClickHouse DDL in migrations/clickhouse, the
# raw and aggregate data retention (src/retention.rs), the statements on the aggregate tables
# (src/rollup.rs), the disk watermark alert (alerts/), and the tests that run them against a real
# ClickHouse.

[[bin]]
name = "ingest"
path = "src/main.rs"
test = false
doc = false

[dependencies]
axum.workspace = true
# Reading and receive times as ClickHouse's DateTime64(3, 'UTC') text, and the range a reading
# time must fall in.
chrono = { workspace = true, features = ["now"] }
contract = { path = "../../crates/contract" }
# Telemetry batches from the broker and their acknowledgements (src/telemetry).
mqtt-client = { path = "../../crates/mqtt-client" }
# The telemetry path's metrics, exported through service-kit's meter provider.
opentelemetry = { workspace = true, features = ["metrics"] }
# The rows of a batch as JSONEachRow.
serde_json.workspace = true
# The pipeline's stop signal (service-kit's stopping token).
tokio-util.workspace = true
# Device IDs must be UUIDs (the telemetry table's device_id).
uuid.workspace = true
# Consumes assets.gateway_bound (decision 4).
outbox = { path = "../../crates/outbox" }
# The gateway's hardware ID, and the gateway buffer's maximum age, which the raw data retention
# must exceed (src/retention.rs).
protocol = { path = "../../crates/protocol" }
serde = { workspace = true, features = ["derive"] }
service-kit = { path = "../../crates/service-kit" }
# Same TLS stack as service-kit: every connection verifies the server (checklist M3).
sqlx = { workspace = true, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# ClickHouse over its HTTP interface: HTTP/1.1 over hyper with rustls and ring, and only the CA the
# deployment names as trust anchor (no system or public roots). Not reqwest: see src/transport.rs.
base64.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
percent-encoding.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tokio-rustls = { workspace = true, features = ["ring"] }

[dev-dependencies]
# Binds gateways through the assets service's own code, as the producer of the event.
assets = { path = "../assets" }
# Encodes test batches that carry fields the protocol does not define (tests/telemetry.rs).
cbor4ii = { workspace = true, features = ["serde1", "use_std"] }
# The broker accounts and roles the chart gives the services (tests/telemetry.rs builds the test
# broker's role for service:ingest from tools/migrate's own definition).
migrate = { path = "../../tools/migrate" }
# Talks to ClickHouse over its HTTP interface, plain HTTP to a local test container.
reqwest.workspace = true
# The product's schema (the migration Job), test identity tokens, and the cross-tenant suite.
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
