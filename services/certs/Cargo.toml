[package]
name = "certs"
description = "TrustIoT v2 certs service: the online issuing CA under an offline root. Signs gateway client certificates, production workstation certificates and the MQTT broker's server certificate from CSRs with the profile it decides, keeps the ledger of what it signed and revoked, and regenerates and publishes each issuing CA's CRL on a schedule."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "certs"
path = "src/main.rs"
test = false
doc = false

# The offline root ceremony (services/certs/README.md): never deployed, run by an operator on an
# offline machine.
[[bin]]
name = "certs-ca"
path = "src/bin/certs-ca.rs"
test = false
doc = false

[dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio"] }
# PEM bodies of certificates and CRLs.
base64.workspace = true
# The issuing CA keys the pod's init container keeps in a Secret (crates/ca-keys).
ca-keys = { path = "../../crates/ca-keys" }
# Timestamps of the ledger and the CRLs, read from and written to Postgres.
chrono.workspace = true
contract = { path = "../../crates/contract" }
# Serial numbers come from the operating system's CSPRNG.
getrandom.workspace = true
# RFC 3339 times in log lines.
humantime.workspace = true
# The CRL gauges.
opentelemetry = { workspace = true, features = ["metrics"] }
# The factory registration writes `certs.gateway_registered` in its transaction.
outbox = { path = "../../crates/outbox" }
# The gateway id, which is a gateway certificate's common name (decision 6).
protocol = { path = "../../crates/protocol" }
# Signs certificates and CRLs; `x509-parser` reads the issuing CA certificates as issuers,
# `zeroize` wipes the root key's PKCS#8 copy in certs-ca.
rcgen = { workspace = true, features = ["crypto", "pem", "ring", "x509-parser", "zeroize"] }
rustls-pki-types = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
# The workstation certificate API reads its JSON bodies field by field, to name each problem.
serde_json.workspace = true
service-kit = { path = "../../crates/service-kit" }
# Fingerprints of the CA files, to reload only what changed.
sha2.workspace = true
# Same TLS stack as service-kit: every connection verifies the server (checklist M3).
sqlx = { workspace = true, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# The workstation certificate API's OpenAPI document (tools/openapi).
utoipa.workspace = true
# Parses and verifies CSRs and the CA certificates.
x509-parser = { workspace = true, features = ["verify"] }
# Wipes the key file's text after parsing.
zeroize.workspace = true

[dev-dependencies]
# Decodes the OTLP metric export the CRL test receives, to read the gauges.
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "metrics"] }
prost = { workspace = true, features = ["std"] }
reqwest.workspace = true
# A second verifier for what the service signs: rustls's webpki client-certificate check with the
# CRLs, as a TLS server that authenticates gateways would run it.
rustls = { workspace = true, features = ["ring", "std"] }
# The product's schema (the migration Job) and the cross-tenant suite.
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }
# Captures the audit log lines of the platform role's reads in tests/bindings.rs.
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[lints]
workspace = true
