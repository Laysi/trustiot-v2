[package]
name = "identity"
description = "TrustIoT v2 identity service: server-side sessions, the ingress gateway's ext_authz check, and the internal identity tokens every other service trusts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "identity"
path = "src/main.rs"
test = false
doc = false

[dependencies]
# The wire types of the AI gateway's admin API, which the platform administrators' model role
# routes call (src/ai_model_roles.rs, Laysi/trustiot-v2#608).
ai-gateway-api = { path = "../../crates/ai-gateway-api" }
# `query`: the event log's `from`, `to`, `limit` and `cursor` parameters.
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
# Strict base64url: token segments and the session cookie have exactly one encoding.
base64.workspace = true
# `created_at` of a tenant, read from Postgres and returned in the API; the `Date` of a login
# email.
chrono = { workspace = true, features = ["alloc", "now", "serde"] }
contract = { path = "../../crates/contract" }
# Signs internal identity tokens with Ed25519. `zeroize` wipes the key on drop.
ed25519-dalek = { workspace = true, features = ["fast", "zeroize"] }
# Session secrets and login codes, from the operating system's CSPRNG.
getrandom.workspace = true
# Login codes are stored as HMAC-SHA-256 under a key derived from the signing key, so the
# database alone cannot test them.
hmac.workspace = true
# The AI gateway admin API's own HTTP/1.1 client (src/ai_model_roles/admin_client.rs): plain
# `http://` inside the cluster, where ztunnel's mTLS encrypts, so no TLS feature at all; not
# reqwest, whose TLS features would be unified into every member (crates/ai-clients/README.md,
# "HTTP 與 TLS"). `Limited` bounds the answer it reads.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
# The signing keys the identity pod's init container generates (Laysi/trustiot-v2#404): their
# file format and which key signs when.
identity-keys = { path = "../../crates/identity-keys" }
# The time zone names a user's preference may hold (src/preferences.rs): the IANA Time Zone
# Database's, compiled in, so every replica accepts the same names whatever its system has.
jiff-tzdb.workspace = true
# Writes `identity.tenant_created` in the transaction that creates the tenant, and consumes every
# producer's events into the event log (Laysi/trustiot-v2#130).
outbox = { path = "../../crates/outbox" }
# The SMTP client that mails login codes (src/mail.rs): always TLS, rustls with ring like the
# rest of the workspace, trusting the image's CA bundle or the configured CA file only.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-kit = { path = "../../crates/service-kit" }
# The database stores only the SHA-256 of a session cookie.
sha2.workspace = true
# Same TLS stack as service-kit: every connection verifies the server (checklist M3).
sqlx = { workspace = true, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# With rustls above: the SMTP client's TLS.
tokio-rustls = { workspace = true, features = ["ring"] }
tracing.workspace = true
# Tenant names: the Unicode general category of each character (control, format and separator
# characters are refused). Already in the build through sqlx's SCRAM (stringprep).
unicode-properties = { workspace = true, features = ["general-category"] }
# The client API's OpenAPI document (tools/openapi merges it into api/openapi.json).
utoipa = { workspace = true, features = ["chrono", "uuid"] }
# Wipes the signing keys file's text after parsing.
zeroize.workspace = true

[dev-dependencies]
# The PKCS#8 PEM form of a test key, to show the service refuses a key file of the format before
# Laysi/trustiot-v2#404 and never logs any form of the key.
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
# The migration Job's `bootstrap-platform-admin`, which creates the first platform administrator
# that tests/platform_admin.rs logs in (Laysi/trustiot-v2#582).
migrate = { path = "../../tools/migrate" }
# The TLS Postgres the integration tests start (shared with crates/service-kit's tests), and the
# certificate of the fake SMTP relay of tests/login.rs.
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
# The cross-tenant negative test suite (decision 29).
testkit = { path = "../../crates/testkit" }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
