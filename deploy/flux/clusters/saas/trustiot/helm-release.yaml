# The TrustIoT release on the SaaS cluster. The chart comes from the OCIRepository in chart.yaml
# (pinned by digest, keyless signature verified); values are layered as deploy/chart/values.yaml
# describes: the chart's defaults, the SaaS shape (values-saas.yaml, copied from the deployed
# release) and this install's overlay (values-instance.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trustiot
  namespace: trustiot
spec:
  # Drift check and retry interval; a new chart or new values start an upgrade right away.
  interval: 10m
  releaseName: trustiot
  chartRef:
    kind: OCIRepository
    name: trustiot
  # Upper bound for one install or upgrade, including waiting for every workload and Job.
  timeout: 10m
  maxHistory: 10
  install:
    remediation:
      retries: 3
  upgrade:
    # A failed upgrade rolls back to the last release that worked, then retries.
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: trustiot-values
      valuesKey: values-saas.yaml
    - kind: ConfigMap
      name: trustiot-values
      valuesKey: values-instance.yaml
