# Demo overlay (deploy/chart/values.yaml, layer 3): what the demo environment changes from the
# SaaS shape (values-saas.yaml, copied from the deployed release). Laysi/trustiot-v2#457;
# deploy/flux/README.md, 「展示叢集」, says how to change it.
#
# The host names and the mail sender are not here: they are private (docs/architecture/secrets.md,
# 「公開 repo 的資訊規則」) and reach the chart from the SOPS-encrypted Secret trustiot-demo-values
# (trustiot-demo-values.sops.yaml), one key per value, which the HelmRelease reads last. Never put
# secret values here either: they go into SOPS-encrypted Secrets in this directory. Every host
# name in this file is under .invalid or .test, or a public service that `bun test deploy/flux`
# lists; the test refuses any other.

global:
  # The read-only GHCR pull token (ghcr-pull.sops.yaml); the same Secret lets Flux pull the chart.
  imagePullSecrets:
    - ghcr-pull

ingress:
  tunnel:
    # The ingress Service's fixed ClusterIP, where the tunnel's stage-2 routes point
    # (Laysi/trustiot-v2#478, Laysi/trustiot-v2#469): an address in the static band of the demo
    # machine's Service range, clear of kubernetes and kube-dns, that no Service or IPAddress held
    # when it was set (Laysi/trustiot-v2#480). ClusterIP is immutable once the Service exists:
    # change it only as deploy/chart/README.md, 「固定的入口 ClusterIP」, says. It is the only IP
    # address this file may name (`bun test deploy/flux`).
    clusterIP: 10.43.0.80
  # Cookie routes on the app host. `host: app` names the chart value hosts.app, not a host name: the
  # real one is only in the private values. Helm replaces this list as a whole, so a change that
  # adds a route keeps every route here (deploy/flux/README.md, 「日常變更」).
  routes:
    # The identity service's own API (services/identity/README.md): the production workstation
    # tool's logout (DELETE /api/identity/v1/sessions/current) and the platform administrator's
    # check of the event log (Laysi/trustiot-v2#619).
    - host: app
      path: /api/identity
      match: PathPrefix
      service: identity
    # The certs service's platform-admin API: workstation certificates and factory registration
    # (services/certs/README.md, 「工作站憑證」 and 「出廠登錄」; Laysi/trustiot-v2#619).
    - host: app
      path: /api/certs
      match: PathPrefix
      service: certs

# The slice's services are switched on here, one by one, as their issues land in a release
# (deploy/flux/README.md, 「展示叢集」). A service is on only while the deployed chart
# has its image.
services:
  identity:
    enabled: true
  assets:
    enabled: true
  # Laysi/trustiot-v2#619. It starts without the root certificate: the issuing CA key waits for the
  # ceremony, and the workstation certificate API answers 503 (ca_not_ready) until then
  # (docs/runbooks/demo-environment.md, 「簽發 CA 的儀式」).
  certs:
    enabled: true

postgres:
  bundled:
    # One gateway with a few meters; the demo keeps no backups (Laysi/trustiot-v2#457 accepts
    # losing its data). local-path does not enforce the size; the disk has room to grow.
    storage:
      size: 10Gi

clickhouse:
  bundled:
    storage:
      size: 20Gi

qdrant:
  # The SaaS shape uses Qdrant Cloud, which the demo slice does not need: only the knowledge
  # service uses Qdrant, and it stays off. The schema wants a URL in external mode, so this one is
  # under .invalid (RFC 6761), which never resolves: a service that tried to use it would fail at
  # once instead of reaching anything. Set a real URL and credentialsSecret with the knowledge
  # service.
  external:
    url: https://qdrant.invalid:6333

# Resend's SMTP relay (docs/architecture/secrets.md, 外部服務, SMTP 帳密). The sender
# (smtp.from) is in the private values; the Secret trustiot-smtp holds username "resend" and the
# API key that may only send, from the sending domain only.
smtp:
  host: smtp.resend.com
  # STARTTLS on 587; if 587 is blocked, 2587 with starttls, or 465 with tls.
  port: 587
  security: starttls
  credentialsSecret:
    name: trustiot-smtp

observability:
  sentry:
    # No Sentry project for the demo: errors stay in the logs in ClickHouse.
    enabled: false
