# The TrustIoT release of the demo environment. chart.yaml and values-saas.yaml are rewritten by
# scripts/flux/pin-chart.ts in a PR; values-demo.yaml and the SOPS-encrypted Secrets are edited
# by hand (deploy/flux/README.md, 「展示叢集」).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - chart.yaml
  - helm-release.yaml
  # SOPS-encrypted Secrets (*.sops.yaml in this directory, deploy/flux/README.md 「展示叢集」).
  # ghcr-pull, trustiot-smtp and trustiot-anthropic are listed here once they exist.
  - trustiot-demo-values.sops.yaml
configMapGenerator:
  - name: trustiot-values
    namespace: trustiot
    files:
      - values-saas.yaml
      - values-demo.yaml
    options:
      # A fixed name, so that the HelmRelease can refer to it; the label makes helm-controller
      # upgrade the release as soon as the values change.
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
