# istiod Helm values for TrustIoT: the mesh's path normalization and the ext_authz provider of
# the ingress gateway (decision 27).
# Use together with values-k3s.yaml or values-openshift.yaml; README.md has the install commands.
#
# The chart's AuthorizationPolicy refers to this provider by name (ingress.authzProvider), so
# the two must match. The provider points at the identity service of the release "trustiot" in
# namespace "trustiot" (<release>-identity.<namespace>.svc.cluster.local); change `service`
# when you install under another release name or namespace.

meshConfig:
  # Every proxy in the mesh (the ingress gateway included) decodes %2F and %5C, applies RFC 3986
  # normalization and merges repeated slashes before routing and authorization, and forwards the
  # normalized path. Without it "//internal/..." and "/%2finternal/..." slip past the chart's
  # DENY on /internal* while a backend may still treat them as /internal (Laysi/trustiot-v2#255).
  # MERGE_SLASHES alone is not enough: it leaves %2F encoded. Mesh-wide, so a path segment can
  # never carry an encoded "/" (README.md).
  pathNormalization:
    normalization: DECODE_AND_MERGE_SLASHES
  extensionProviders:
    - name: trustiot-identity
      envoyExtAuthzHttp:
        service: trustiot-identity.trustiot.svc.cluster.local
        port: 8080
        # The identity service's check endpoint; the gateway appends the original path. It is
        # under /internal, which the ingress never routes.
        pathPrefix: /internal/ext-authz
        # Fail closed: an unreachable, failing or slow identity service rejects the request.
        # Istio's default timeout is 600 s.
        failOpen: false
        timeout: 0.5s
        # 503 instead of the default 403, so the SPA can tell "service unavailable" from
        # "sign in again" (401 from the identity service).
        statusOnError: "503"
        # Only the cookie, the two headers of the cross-site request check and the user and
        # tenant a page shows go to the identity service (Host, method, path and Authorization are
        # always included). Without Origin and Sec-Fetch-Site the identity service cannot refuse
        # cross-site requests (services/identity/README.md, CSRF); without the two
        # trustiot-expected-* headers it cannot refuse a request from a tab that still shows the
        # user or tenant another tab replaced (Laysi/trustiot-v2#678).
        includeRequestHeadersInCheck:
          - cookie
          - origin
          - sec-fetch-site
          - trustiot-expected-user
          - trustiot-expected-tenant
        # On allow, the identity service's x-internal-identity replaces any client copy, so the
        # identity service must always return it.
        headersToUpstreamOnAllow:
          - x-internal-identity

pilot:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
