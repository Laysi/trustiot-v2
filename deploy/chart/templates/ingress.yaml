{{- /*
Ingress gateway (decision 27): Istio implements the Kubernetes Gateway API. Every request needs
the cookie, which an AuthorizationPolicy with the CUSTOM action sends to the identity service
(ext_authz through the mesh extension provider ingress.authzProvider); only the public paths skip
it, and the SPA's static files on hosts.app while services.web is enabled. Requests to public
paths lose any x-internal-identity header (the static files' requests also lose the Cookie),
every route drops its underscore spellings, and nothing under /internal is reachable from
outside. Istio creates the gateway Deployment and Service from the Gateway and the options
ConfigMap below.
*/ -}}
{{- $v := .Values -}}
{{- $gateway := include "trustiot.ingress.gatewayName" . -}}
{{- $listener := include "trustiot.ingress.listener" . -}}
{{- $listenerPort := include "trustiot.ingress.listenerPort" . -}}
{{- $options := include "trustiot.componentName" (dict "root" . "name" "ingress-options") -}}
{{- $plan := include "trustiot.ingress.plan" . | fromYaml -}}
{{- /* Checked on every render, so a value set with direct exposure is refused, not ignored. */ -}}
{{- $clusterIP := include "trustiot.ingress.tunnelClusterIP" . -}}
{{- $labels := include "trustiot.componentLabels" (dict "root" . "name" "ingress") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $options }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- /* Strategic-merge patches that Istio applies to the objects it generates. */}}
  deployment: |
    spec:
      replicas: {{ $v.ingress.replicas }}
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $v.ingress.resources | nindent 16 }}
  service: |
    spec:
      {{- if eq $v.ingress.exposure "tunnel" }}
      # Reached only by cloudflared on the host; nothing listens on the host or the network.
      type: ClusterIP
      {{- if $clusterIP }}
      # Fixed, so a recreated Service keeps the address cloudflared forwards to (ingress.tunnel.clusterIP).
      clusterIP: {{ $clusterIP }}
      {{- end }}
      {{- else }}
      type: {{ $v.ingress.direct.serviceType }}
      {{- end }}
  {{- if gt (int $v.ingress.replicas) 1 }}
  podDisruptionBudget: |
    spec:
      minAvailable: 1
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      app.kubernetes.io/name: {{ include "trustiot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingress
      app.kubernetes.io/part-of: trustiot
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $options }}
  listeners:
    {{- if eq $listener "http" }}
    # cloudflared to the gateway is plain HTTP inside the host; Cloudflare terminates TLS.
    - name: http
      port: {{ $listenerPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    {{- else }}
    # The gateway terminates the outer TLS; gateways keep their own mTLS inside the WebSocket.
    - name: https
      port: {{ $listenerPort }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ $v.ingress.direct.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- range $host := list "app" "gateway" "ota" }}
{{- $rules := list }}
{{- range $plan.public }}
{{- if eq .host $host }}
{{- $rules = append $rules (dict "item" . "public" true) }}
{{- end }}
{{- end }}
{{- range $plan.routes }}
{{- if eq .host $host }}
{{- $rules = append $rules (dict "item" . "public" false) }}
{{- end }}
{{- end }}
{{- if $rules }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "trustiot.componentName" (dict "root" $ "name" (printf "ingress-%s" $host)) }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway }}
      sectionName: {{ $listener }}
  hostnames:
    - {{ get $v.hosts $host | quote }}
  rules:
    {{- range $rules }}
    - matches:
        - path:
            type: {{ .item.match }}
            value: {{ .item.path | quote }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            # Clients always reach us over HTTPS (Cloudflare or this gateway's TLS), so backends
            # can rely on it for Secure cookies and redirect URLs.
            set:
              - name: x-forwarded-proto
                value: https
            remove:
              {{- if .item.static }}
              # The SPA's static files need no session, so the web service never holds one.
              - cookie
              {{- end }}
              {{- if .public }}
              # Public path: no ext_authz check overwrites the header, so drop any client copy.
              # A cookie route must keep it: route filters run after ext_authz and would drop
              # the identity service's value too.
              - x-internal-identity
              {{- end }}
              # Underscore spellings are other header names to Envoy, which forwards them, but
              # CGI/WSGI-style servers read "-" and "_" alike (Laysi/trustiot-v2#255).
              - x_internal_identity
              - x-internal_identity
              - x_internal-identity
      backendRefs:
        - name: {{ .item.backend.name }}
          port: {{ .item.backend.port }}
    {{- end }}
{{- end }}
{{- end }}
---
{{- /*
Cookie check on every request except a public path on its own host. Rules are ORed: the first
catches every non-public path, and one more rule per public path catches it on any other host,
so an exemption never leaks to a host where that path is routed elsewhere. Istio matches paths
exactly after the mesh's path normalization (deploy/istio/istiod-values.yaml), so encoded or
case variants are checked too. The host is exempt with or without a port ("<host>:*"), as the
gateway routes it: a gateway may send "Host: gw.example.com:443" (Laysi/trustiot-v2#255).
While services.web serves the SPA's static files, hosts.app is checked only on the cookie
prefixes and /internal, and every other host as without them; a public path outside the cookie
prefixes is then not checked on hosts.app either, where it reaches the static files.
The last rules check a public path on its own host too when the method is not one it lists
(Laysi/trustiot-v2#859), so only the listed methods skip the check; the DENY policy below then
refuses such a request even with a valid cookie.
*/}}
{{- $exempt := dict }}
{{- $static := dict }}
{{- $exact := list }}
{{- range $plan.public }}
{{- if .static }}
{{- $static = . }}
{{- else }}
{{- $_ := set $exempt .path (append (get $exempt .path | default list) .hostname) }}
{{- $exact = append $exact . }}
{{- end }}
{{- end }}
{{- $checked := list }}
{{- range include "trustiot.ingress.cookiePrefixes" . | fromYamlArray }}
{{- $checked = concat $checked (list . (printf "%s/*" .)) }}
{{- end }}
{{- $checked = append $checked "/internal*" }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" (dict "root" . "name" "ingress-cookie-check") }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway }}
  action: CUSTOM
  provider:
    name: {{ $v.ingress.authzProvider }}
  rules:
    {{- if $static }}
    # Every host but hosts.app: every path except the public paths.
    - to:
        - operation:
            notHosts:
              - {{ $static.hostname | quote }}
              - {{ printf "%s:*" $static.hostname | quote }}
            {{- if $exempt }}
            notPaths:
              {{- range $path := keys $exempt | sortAlpha }}
              - {{ $path | quote }}
              {{- end }}
            {{- end }}
    # Every host, hosts.app included: the cookie prefixes and /internal, except the public paths.
    - to:
        - operation:
            paths:
              {{- range $checked }}
              - {{ . | quote }}
              {{- end }}
            {{- if $exempt }}
            notPaths:
              {{- range $path := keys $exempt | sortAlpha }}
              - {{ $path | quote }}
              {{- end }}
            {{- end }}
    {{- range $path := keys $exempt | sortAlpha }}
    {{- $hosts := get $exempt $path }}
    {{- if not (include "trustiot.ingress.underCookiePrefix" $path) }}
    {{- $hosts = append $hosts $static.hostname }}
    {{- end }}
    - to:
        - operation:
            paths:
              - {{ $path | quote }}
            notHosts:
              {{- range $hosts | uniq | sortAlpha }}
              - {{ . | quote }}
              - {{ printf "%s:*" . | quote }}
              {{- end }}
    {{- end }}
    # Each public path on its own host with a method it does not list.
    {{- include "trustiot.ingress.otherMethodRules" $exact | trim | nindent 4 }}
    {{- else if $exempt }}
    - to:
        - operation:
            notPaths:
              {{- range $path := keys $exempt | sortAlpha }}
              - {{ $path | quote }}
              {{- end }}
    {{- range $path := keys $exempt | sortAlpha }}
    - to:
        - operation:
            paths:
              - {{ $path | quote }}
            notHosts:
              {{- range get $exempt $path | uniq | sortAlpha }}
              - {{ . | quote }}
              - {{ printf "%s:*" . | quote }}
              {{- end }}
    {{- end }}
    # Each public path on its own host with a method it does not list.
    {{- include "trustiot.ingress.otherMethodRules" $exact | trim | nindent 4 }}
    {{- else }}
    # No public path is enabled: every request is checked.
    - {}
    {{- end }}
---
# Internal APIs between services live under /internal (decision 27). No route forwards that
# prefix, and this denies it even when a route such as "/" would match. CUSTOM runs first, so a
# request without a cookie gets 401 and one with a valid cookie gets 403. Spellings such as
# "//internal" and "/%2finternal" match only because the mesh merges slashes and decodes %2F
# before authorization (meshConfig.pathNormalization in deploy/istio/istiod-values.yaml).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" (dict "root" . "name" "ingress-deny-internal") }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway }}
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - "/internal*"
{{- if $exact }}
---
# Each public path admits only the methods its service serves there (Laysi/trustiot-v2#859): any
# other method on its own host is refused here, before any route, so it never reaches the
# public path's backend or a cookie route that also covers the path. CUSTOM runs first and checks
# these requests too, so one without a cookie gets 401 and one with a valid cookie 403.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" (dict "root" . "name" "ingress-deny-methods") }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway }}
  action: DENY
  rules:
    {{- include "trustiot.ingress.otherMethodRules" $exact | trim | nindent 4 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $gateway }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ $gateway }}
  policyTypes:
    - Ingress
  ingress:
    {{- if eq $v.ingress.exposure "tunnel" }}
    # Only the host may connect, and only to the listener (cloudflared) and Istio's status port
    # (the kubelet's probes); other pods may not connect at all.
    - from:
        {{- range $v.ingress.tunnel.allowedSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- include "trustiot.ingress.policyPorts" . | nindent 8 }}
    {{- else }}
    # The customer network reaches the HTTPS listener; the kubelet checks readiness on Istio's
    # status port.
    - ports:
        {{- include "trustiot.ingress.policyPorts" . | nindent 8 }}
    {{- end }}
