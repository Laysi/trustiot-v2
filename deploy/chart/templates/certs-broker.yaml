{{- /*
The MQTT broker's server certificate (Laysi/trustiot-v2#557; services/certs/README.md, "broker
伺服器憑證"): the certs service issues it on a port of its own, the container port named
broker-certs (the service's broker.listen_addr, default 8082), which serves POST
/internal/certs/v1/broker-certificate and nothing else. A certificate for the broker's name lets
whoever holds its key pose as the broker to every gateway, so only the broker's certificate
CronJob (templates/mqtt-broker-certificate.yaml, Laysi/trustiot-v2#535), which writes the key
into the broker's Secret, may ask for one; not even the broker's pod reaches this port. Its own
objects, all named <release>-certs-broker:
- a Service with that port only, which the CronJob addresses
  (http://<release>-certs-broker.<namespace>.svc:8082): its port is always 8082
  ("trustiot.certs.brokerServicePort") and forwards to the container port by name, so overriding
  the container port does not move the address; the certs service's own Service leaves the port
  out ("trustiot.service.service");
- an AuthorizationPolicy (ztunnel, L4) that admits the CronJob's ServiceAccount (the plan's
  brokerCallers) on that port only. The certs service's own policy (templates/mesh.yaml) admits
  the ingress gateway, the services that list certs in mesh.calls and the broker's trust sidecar
  on its API ports only (the plan's apiPorts). ALLOW policies add up: a connection passes when
  one of them matches;
- a NetworkPolicy that admits HBONE from the CronJob's pods. It cannot see the application port
  inside the tunnel, so the port split is the AuthorizationPolicy's alone.
Without the MQTT broker the AuthorizationPolicy has no rules and the NetworkPolicy no ingress:
they admit nothing. Rendered while the certs service is enabled and has the broker-certs port; the
plan fails the render when the broker runs but there is no such port.
*/ -}}
{{- if hasKey .Values.services "certs-broker" }}
{{- fail "services.certs-broker: the name belongs to the certs service's MQTT broker certificate issuance (its Service and policies)" }}
{{- end }}
{{- $mesh := include "trustiot.mesh.plan" . | fromYaml }}
{{- range $service := $mesh.services }}
{{- if and (eq $service.name "certs") $service.brokerPort }}
{{- $certs := dict "root" $ "name" "certs" }}
{{- $ctx := dict "root" $ "name" "certs-broker" }}
{{- $principals := list }}
{{- range $service.brokerCallers | default list }}
{{- $principals = append $principals (include "trustiot.mesh.principal" (dict "root" $ "serviceAccount" (include "trustiot.componentName" (dict "root" $ "name" .)))) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  # Always ClusterIP, like every service's (templates/_service.tpl).
  type: ClusterIP
  selector:
    {{- include "trustiot.selectorLabels" $certs | nindent 4 }}
  ports:
    # Fixed, so the broker's address stays the same when the container port changes
    # ("trustiot.certs.brokerServicePort"); the policies below match the container port, which
    # is what ztunnel sees.
    - name: broker-certs
      port: {{ include "trustiot.certs.brokerServicePort" $ }}
      targetPort: broker-certs
      protocol: TCP
      appProtocol: http
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $certs | nindent 6 }}
  action: ALLOW
  {{- if $principals }}
  rules:
    # The broker's certificate CronJob: the broker-certs port only.
    - from:
        - source:
            principals:
              {{- range $principals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports:
              - {{ printf "%d" (int $service.brokerPort) | quote }}
  {{- else }}
  # The MQTT broker is not deployed: this policy admits nothing (the certs service's own policy
  # still admits its callers on the API ports).
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $certs | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $service.brokerCallers }}
  ingress:
    # Mesh traffic arrives only on ztunnel's HBONE port, from the CronJob's pod IP.
    - from:
        {{- range $service.brokerCallers }}
        - podSelector:
            matchLabels:
              {{- include "trustiot.selectorLabels" (dict "root" $ "name" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ include "trustiot.mesh.hbonePort" $ }}
          protocol: TCP
  {{- else }}
  # The MQTT broker is not deployed: this policy admits nothing (the certs service's own policy
  # still admits its callers and the kubelet's probes).
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
