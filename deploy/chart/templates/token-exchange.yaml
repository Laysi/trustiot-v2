{{- /*
The identity service's token exchange (decision 27, Laysi/trustiot-v2#106): POST
/internal/token-exchange on a port of its own, the container port named token-exchange (the
service's exchange.listen_addr, default 8082), with its own objects, all named
<release>-identity-exchange, so the cookie check (ext_authz) and the exchange never share a
grant:
- a Service with that port only, which the services that call on behalf of users address
  (http://<release>-identity-exchange:8082); the identity service's own Service leaves the port
  out ("trustiot.service.service");
- an AuthorizationPolicy (ztunnel, L4) that admits the callers on behalf of users
  ("trustiot.mesh.onBehalfCalls", the plan's exchangeCallers) on that port only. The identity
  service's own policy (templates/mesh.yaml) admits the ingress gateway and the services that list
  identity in mesh.calls on its API ports only (the plan's apiPorts), so a caller on behalf of
  users never reaches the ext_authz check, which turns any session cookie into a token for any
  service. ALLOW policies add up: a connection passes when one of them matches;
- a NetworkPolicy that admits HBONE from the same callers' pods. It cannot see the application
  port inside the tunnel, so the port split is the AuthorizationPolicy's alone; the NetworkPolicy
  keeps every other pod away from the identity service, as the identity service's own one does.
Without callers on behalf of users the AuthorizationPolicy has no rules and the NetworkPolicy no
ingress: they admit nothing (a rule-less ALLOW policy matches no connection; NetworkPolicies add
up too). Rendered while the identity service is enabled and has the token-exchange port; the
plan fails the render when there are callers on behalf of users but no such port.
*/ -}}
{{- if hasKey .Values.services "identity-exchange" }}
{{- fail "services.identity-exchange: the name belongs to the identity service's token exchange (its Service and policies)" }}
{{- end }}
{{- $mesh := include "trustiot.mesh.plan" . | fromYaml }}
{{- range $service := $mesh.services }}
{{- if and (eq $service.name "identity") $service.exchangePort }}
{{- $identity := dict "root" $ "name" "identity" }}
{{- $ctx := dict "root" $ "name" "identity-exchange" }}
{{- $principals := list }}
{{- range $service.exchangeCallers | default list }}
{{- $principals = append $principals (include "trustiot.mesh.principal" (dict "root" $ "serviceAccount" (include "trustiot.componentName" (dict "root" $ "name" .)))) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  # Always ClusterIP, like every service's (templates/_service.tpl).
  type: ClusterIP
  selector:
    {{- include "trustiot.selectorLabels" $identity | nindent 4 }}
  ports:
    - name: token-exchange
      port: {{ $service.exchangePort }}
      targetPort: token-exchange
      protocol: TCP
      appProtocol: http
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $identity | nindent 6 }}
  action: ALLOW
  {{- if $principals }}
  rules:
    # The services that call on behalf of users: the token exchange's port only.
    - from:
        - source:
            principals:
              {{- range $principals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports:
              - {{ printf "%d" (int $service.exchangePort) | quote }}
  {{- else }}
  # No service calls another on behalf of users: this policy admits nothing (the identity
  # service's own policy still admits its callers on the API ports).
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $identity | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $service.exchangeCallers }}
  ingress:
    # Mesh traffic arrives only on ztunnel's HBONE port, from the caller's own pod IP.
    - from:
        {{- range $service.exchangeCallers }}
        - podSelector:
            matchLabels:
              {{- include "trustiot.selectorLabels" (dict "root" $ "name" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ include "trustiot.mesh.hbonePort" $ }}
          protocol: TCP
  {{- else }}
  # No caller on behalf of users: this policy admits nothing (the identity service's own policy
  # still admits its callers and the kubelet's probes).
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
