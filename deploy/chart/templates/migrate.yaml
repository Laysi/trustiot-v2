{{- /*
Migration Job (tools/migrate, Laysi/trustiot-v2#60; helpers and the reasons in _migrate.tpl):
- the Job, named after a hash of its spec, with its own ServiceAccount, whose token only the Job's
  container mounts;
- a Role that lets that ServiceAccount get and patch exactly the password Secrets of
  templates/passwords.yaml that the Job fills, and get the bundled ClickHouse's admin password
  Secret, which the ClickHouse pod's init container fills: no create (which cannot be limited by
  name and would let it create a token Secret for any ServiceAccount), no list or watch, no other
  Secret;
- a Role that lets the ServiceAccounts of the enabled services and of the collector read that one
  Job, which their init containers poll until it is complete.
The Job is kept after it completes: services that start later (a restart, a new replica) still
find it complete. Helm deletes it when an upgrade renders a Job with another name.
*/ -}}
{{- include "trustiot.migrate.check" . }}
{{- if include "trustiot.migrate.enabled" . }}
{{- $ctx := dict "root" . "name" "migrate" }}
{{- $job := include "trustiot.migrate.jobName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  {{- include "trustiot.migrate.jobSpec" . | nindent 2 }}
---
# Nothing connects to the Job's pod: no caller in the mesh (an ALLOW policy without rules refuses
# every connection) and no port in the NetworkPolicy, like every other workload of the chart.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  action: ALLOW
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- $fills := include "trustiot.migrate.passwordSecretObjects" . | fromYamlArray }}
{{- $admin := include "trustiot.clickhouse.adminPassword" . | fromYaml }}
{{- if include "trustiot.migrate.usesApi" . }}
---
# The password Secrets the Job fills, by name, and the bundled ClickHouse's generated admin
# password, which it only reads; nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
rules:
  {{- if $fills }}
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range $fills }}
      - {{ .name }}
      {{- end }}
    verbs:
      - get
      - patch
  {{- end }}
  {{- if $admin.generated }}
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $admin.name }}
    verbs:
      - get
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "trustiot.componentName" $ctx }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trustiot.componentName" $ctx }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- $services := list }}
{{- range $name, $entry := .Values.services }}
{{- if $entry.enabled }}
{{- $services = append $services $name }}
{{- end }}
{{- end }}
{{- /* The collector waits for the Job too: it starts with the password the Job generates. */}}
{{- if .Values.observability.collector.enabled }}
{{- $services = append $services "otel-collector" }}
{{- end }}
{{- if $services }}
{{- $status := dict "root" . "name" "migrate-status" }}
---
# Read access to this release's migration Job, for the init containers of the services and the
# collector only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "trustiot.componentName" $status }}
  labels:
    {{- include "trustiot.componentLabels" $status | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    resourceNames:
      - {{ $job }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "trustiot.componentName" $status }}
  labels:
    {{- include "trustiot.componentLabels" $status | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "trustiot.componentName" $status }}
subjects:
  {{- range $services }}
  - kind: ServiceAccount
    name: {{ include "trustiot.componentName" (dict "root" $ "name" .) }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
{{- end }}
{{- end }}
