{{- /*
Bundled ClickHouse (decision 14): one StatefulSet with a persistent volume, reachable only
inside the cluster. The server configuration ("trustiot.clickhouse.serverConfig") covers
listening, ports and logging only. Users, roles, row policies, settings profiles and quotas are
created with SQL by the migration Job from services/ingest/migrations/clickhouse; the only
account the image creates is the bootstrap admin, from CLICKHOUSE_USER and the password file.
*/ -}}
{{- if eq .Values.clickhouse.mode "bundled" }}
{{- $ch := .Values.clickhouse.bundled }}
{{- $ctx := dict "root" . "name" "clickhouse" }}
{{- $name := include "trustiot.componentName" $ctx }}
{{- $configName := include "trustiot.componentName" (dict "root" . "name" "clickhouse-config") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configName }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
data:
  trustiot.xml: |
    {{- include "trustiot.clickhouse.serverConfig" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  # In-cluster only, like every Service of this chart.
  type: ClusterIP
  selector:
    {{- include "trustiot.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: native
      port: 9000
      targetPort: native
      protocol: TCP
      appProtocol: tcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
  # Keep the data volume when the StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trustiot.componentLabels" $ctx | nindent 8 }}
        # Istio ambient: ztunnel adds mTLS to every connection to ClickHouse (decision 27).
        istio.io/dataplane-mode: ambient
      annotations:
        # Restart when the server configuration changes.
        checksum/clickhouse-config: {{ include "trustiot.clickhouse.serverConfig" . | sha256sum }}
        # The entrypoint reads the admin password only at start; changing the Secret reference
        # or adminSecretRevision (after a password rotation) restarts the server.
        checksum/admin-secret: {{ list $ch.adminSecret.name $ch.adminSecret.key $ch.adminSecretRevision | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Time to finish running merges and flush buffers before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml $ch.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $ch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ch.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ printf "%s:%s@%s" $ch.image.repository $ch.image.tag $ch.image.digest }}
          imagePullPolicy: {{ $ch.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ $ch.adminUser | quote }}
            # Read from the mounted Secret, so the password is not in the environment.
            - name: CLICKHOUSE_PASSWORD_FILE
              value: /etc/trustiot/clickhouse-admin/password
            # The bootstrap account may create users, roles, row policies, profiles and quotas.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $ch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d
              readOnly: true
            # The entrypoint writes the bootstrap account here.
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            - name: tmp
              mountPath: /tmp
            - name: admin-password
              mountPath: /etc/trustiot/clickhouse-admin
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $configName }}
        - name: users-d
          emptyDir:
            # Holds the bootstrap account's password; keep it in memory, never on disk.
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: admin-password
          secret:
            secretName: {{ $ch.adminSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ $ch.adminSecret.key }}
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
        # Selector labels only: volumeClaimTemplates cannot change after creation, and the
        # full label set carries the chart version.
        labels:
          {{- include "trustiot.selectorLabels" $ctx | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $ch.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $ch.storage.size }}
{{- end }}
