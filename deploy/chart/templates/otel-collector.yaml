{{- /*
OpenTelemetry collector (decision 22): receives OTLP from every service, redacts it, writes logs
and traces to ClickHouse's trustiot_logs database and optionally forwards them to the customer's
SIEM. The configuration is "trustiot.collector.config"; Secrets reach it only as environment
variables from secretKeyRef. Its ClickHouse account is created with SQL by the migration Job
(decision 14), not here, with a password the Job generates into the collector's own Secret
(templates/passwords.yaml); while the Job runs, the collector waits for it in an init container,
like the services, so it never starts before its password exists.
*/ -}}
{{- $collector := .Values.observability.collector }}
{{- if $collector.enabled }}
{{- $ctx := dict "root" . "name" "otel-collector" }}
{{- $name := include "trustiot.componentName" $ctx }}
{{- $configName := include "trustiot.componentName" (dict "root" . "name" "otel-collector-config") }}
{{- $config := include "trustiot.collector.config" . }}
{{- $pod := include "trustiot.otel-collector.pod" . | fromYaml }}
{{- $forward := $collector.forward }}
{{- if and $forward.enabled (not $forward.endpoint) }}
{{- fail "observability.collector.forward.endpoint is required when forwarding is enabled" }}
{{- end }}
{{- if and $forward.enabled $forward.caSecret.name (not (hasPrefix "https://" $forward.endpoint)) }}
{{- fail "observability.collector.forward.caSecret needs an https:// endpoint" }}
{{- end }}
{{- if and $forward.enabled $forward.authHeader.name (not $forward.authHeader.valueSecret.name) }}
{{- fail "observability.collector.forward.authHeader.valueSecret.name is required when authHeader.name is set" }}
{{- end }}
{{- $password := include "trustiot.migrate.passwordSecret" (dict "root" . "component" "otel-collector") | fromYaml }}
{{- $migrate := include "trustiot.migrate.enabled" . }}
{{- $containerSecurity := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
{{- $nodeSelector := $collector.nodeSelector | default dict }}
{{- if $migrate }}
{{- /* The init container runs the migration image, which is built for arm64 only (decision 5). */}}
{{- $arch := get $nodeSelector "kubernetes.io/arch" }}
{{- if and $arch (ne $arch "arm64") }}
{{- fail "observability.collector.nodeSelector: kubernetes.io/arch must be arm64 while migrate.enabled is true: the collector waits for the migration Job in an init container that runs the migration image, which is built for arm64 only" }}
{{- end }}
{{- $nodeSelector = merge (dict "kubernetes.io/arch" "arm64") $nodeSelector }}
{{- end }}
{{- $clickhouseCa := and (eq .Values.clickhouse.mode "external") .Values.clickhouse.external.caSecret.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configName }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  # In-cluster only, like every Service of this chart.
  type: ClusterIP
  selector:
    {{- include "trustiot.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new collector before stopping the old one, so services keep an endpoint.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trustiot.componentLabels" $ctx | nindent 8 }}
        # Istio ambient: ztunnel adds mTLS from the services and to ClickHouse (decision 27).
        istio.io/dataplane-mode: ambient
      annotations:
        # Restart when the configuration changes.
        checksum/config: {{ $config | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Time to flush the export queues after SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml $collector.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $migrate }}
      initContainers:
        {{- /* Holds the pod until the migration Job, which creates the account and its password,
        is complete (_migrate.tpl). */}}
        - {{ include "trustiot.migrate.initContainer" (dict "root" . "config" (dict "securityContext" $containerSecurity)) | indent 10 | trim }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ printf "%s:%s@%s" $collector.image.repository $collector.image.tag $collector.image.digest }}
          imagePullPolicy: {{ $collector.image.pullPolicy }}
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: CLICKHOUSE_USER
              value: {{ $collector.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $password.name }}
                  key: {{ $password.key }}
            {{- if and $forward.enabled $forward.authHeader.name }}
            - name: FORWARD_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ $forward.authHeader.valueSecret.name }}
                  key: {{ $forward.authHeader.valueSecret.key }}
            {{- end }}
          {{- /* The NetworkPolicy opens the probe ports from the same definition. */}}
          ports:
            {{- toYaml $pod.ports | nindent 12 }}
          startupProbe:
            {{- toYaml $pod.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml $pod.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml $pod.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml $collector.resources | nindent 12 }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            {{- if $clickhouseCa }}
            - name: clickhouse-ca
              mountPath: /etc/trustiot/clickhouse-ca
              readOnly: true
            {{- end }}
            {{- if and $forward.enabled $forward.caSecret.name }}
            - name: forward-ca
              mountPath: /etc/trustiot/forward-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $configName }}
        {{- if $migrate }}
        - {{ include "trustiot.migrate.kubeApiVolume" . | indent 10 | trim }}
        {{- end }}
        {{- if $clickhouseCa }}
        - name: clickhouse-ca
          secret:
            secretName: {{ .Values.clickhouse.external.caSecret.name }}
            items:
              - key: {{ .Values.clickhouse.external.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if and $forward.enabled $forward.caSecret.name }}
        - name: forward-ca
          secret:
            secretName: {{ $forward.caSecret.name }}
            items:
              - key: {{ $forward.caSecret.key }}
                path: ca.crt
        {{- end }}
{{- end }}
