{{- /*
The Secrets that hold the generated passwords of the services' Postgres login roles and of the
collector's ClickHouse account, one per consumer ("trustiot.migrate.passwordSecrets" in
_migrate.tpl; docs/architecture/secrets.md). The chart renders no secret value: each is declared
without data or stringData, and the migration Job generates every password and patches it in, so
nobody creates, copies or rotates one.
- helm.sh/resource-policy keep: an uninstall, or an upgrade that turns the consumer off, leaves the
  Secret and its passwords in place (a reinstall adopts it again).
- Helm never owns the data: an upgrade or a rollback renders no data, so it keeps what the Job wrote
  (docs/runbooks/migrations.md has what to do when it is lost anyway).
*/ -}}
{{- range include "trustiot.migrate.passwordSecrets" . | fromYamlArray }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "trustiot.componentLabels" (dict "root" $ "name" .component) | nindent 4 }}
    trustiot.io/filled-by: migrate
  annotations:
    helm.sh/resource-policy: keep
    trustiot.io/description: Generated by the migration Job; rotate with migrate.passwordGeneration.
type: Opaque
{{- end }}
