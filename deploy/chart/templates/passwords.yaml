{{- /*
The Secrets that hold the passwords generated in the cluster (docs/architecture/secrets.md),
"trustiot.filledSecretObjects" in _migrate.tpl:
- one per consumer of a password the migration Job generates: the services' Postgres login roles
  and the collector's ClickHouse account ("trustiot.migrate.passwordSecretObjects", one Secret
  even when it holds a service's app and platform role passwords);
- the bundled ClickHouse's bootstrap admin password, which the init container of the ClickHouse
  pod generates before the server starts ("trustiot.clickhouse.adminPassword" in _clickhouse.tpl,
  Laysi/trustiot-v2#403);
- the identity service's internal identity signing keys, which the init container of the identity
  pod generates ("trustiot.identity.keys" in _identity.tpl, Laysi/trustiot-v2#404).
The chart renders no secret value: each is declared without data or stringData, and tools/migrate
(the Job, or the init container of the ClickHouse or the identity pod) generates every password
and key and patches it in, so nobody creates, copies or rotates one.
- helm.sh/resource-policy keep: an uninstall, or an upgrade that turns the consumer off, leaves the
  Secret and its passwords in place (a reinstall adopts it again).
- Helm never owns the data: an upgrade or a rollback renders no data, so it keeps what tools/migrate
  wrote (docs/runbooks/migrations.md and docs/runbooks/secrets.md have what to do when it is lost
  anyway).
*/ -}}
{{- range include "trustiot.filledSecretObjects" . | fromYamlArray }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "trustiot.componentLabels" (dict "root" $ "name" .component) | nindent 4 }}
    trustiot.io/filled-by: migrate
  annotations:
    helm.sh/resource-policy: keep
    trustiot.io/description: Generated in the cluster by tools/migrate; nobody sets it (docs/architecture/secrets.md).
type: Opaque
{{- end }}
