{{- /*
Service-to-service authorization (decision 27): two independent layers, so either one alone
still refuses a call that is not on the list.
1. AuthorizationPolicy (enforced by ztunnel, L4): each service and in-cluster component (bundled
   ClickHouse) accepts mTLS connections only from the ServiceAccounts of its listed callers and,
   where it routes, the ingress gateway. One nobody may call gets a policy without rules, which
   refuses every connection. The identity service's policy admits its callers and the ingress
   gateway on its API ports only ("trustiot.mesh.identityPorts", to.operation.ports, an L4
   attribute ztunnel enforces): its token exchange port has its own Service and policies, for
   the services that call on behalf of users (templates/token-exchange.yaml,
   Laysi/trustiot-v2#106).
2. NetworkPolicy: everything in the namespace is denied by default; each service and component
   then admits ztunnel's HBONE port from the pods of the same callers, and connections from the
   node (kubelet probes, "trustiot.mesh.hostSource") on its probe ports only, because ztunnel
   lets those through unauthorized. It only stops new connections: ztunnel reuses HBONE
   connections, and a NetworkPolicy never cuts one that is already open, so the
   AuthorizationPolicy is the primary layer. It sees HBONE only, never the application port
   inside the tunnel, so the identity service's port split is the AuthorizationPolicy's alone.
No waypoint is deployed: L4 identity is all these rules need. Add one only for L7 rules between
services, and move the affected policies to it (README.md).
*/ -}}
{{- $v := .Values -}}
{{- $gateway := include "trustiot.ingress.gatewayName" . -}}
{{- $mesh := include "trustiot.mesh.plan" . | fromYaml -}}
# Default deny: a pod in this namespace accepts only what another NetworkPolicy here allows
# (the ingress gateway's own policy and the per-service policies below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustiot.componentName" (dict "root" . "name" "default-deny") }}
  labels:
    {{- include "trustiot.componentLabels" (dict "root" . "name" "default-deny") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- range $service := $mesh.services }}
{{- $ctx := dict "root" $ "name" $service.name }}
{{- $principals := list }}
{{- range $service.callers }}
{{- $principals = append $principals (include "trustiot.mesh.principal" (dict "root" $ "serviceAccount" (include "trustiot.componentName" (dict "root" $ "name" .)))) }}
{{- end }}
{{- if $service.ingress }}
{{- /* Istio names the gateway's ServiceAccount "<gateway>-istio". */}}
{{- $principals = append $principals (include "trustiot.mesh.principal" (dict "root" $ "serviceAccount" (printf "%s-istio" $gateway))) }}
{{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  action: ALLOW
  {{- if $principals }}
  rules:
    - from:
        - source:
            principals:
              {{- range $principals }}
              - {{ . | quote }}
              {{- end }}
      {{- with $service.apiPorts }}
      # The identity service: its API ports only, never the token exchange's
      # (templates/token-exchange.yaml).
      to:
        - operation:
            ports:
              {{- range . }}
              - {{ printf "%d" (int .) | quote }}
              {{- end }}
      {{- end }}
  {{- else }}
  # No caller is listed: an ALLOW policy without rules refuses every connection.
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustiot.componentName" $ctx }}
  labels:
    {{- include "trustiot.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustiot.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  {{- $probePorts := (include "trustiot.mesh.probePorts" $ctx | fromYaml).ports }}
  {{- if not (or $principals $probePorts) }}
  # Nobody may call it and no probe connects: deny every connection.
  ingress: []
  {{- else }}
  ingress:
    {{- if $principals }}
    # Mesh traffic arrives only on ztunnel's HBONE port, from the caller's own pod IP.
    - from:
        {{- range $service.callers }}
        - podSelector:
            matchLabels:
              {{- include "trustiot.selectorLabels" (dict "root" $ "name" .) | nindent 14 }}
        {{- end }}
        {{- if $service.ingress }}
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ $gateway }}
        {{- end }}
      ports:
        - port: {{ include "trustiot.mesh.hbonePort" $ }}
          protocol: TCP
    {{- end }}
    {{- if $probePorts }}
    # Connections from the node, which istio-cni SNATs to this address and ztunnel does not
    # authorize: kubelet probes, but also any hostNetwork process. Only the probe ports.
    - from:
        - ipBlock:
            cidr: {{ include "trustiot.mesh.hostSource" $ }}
      ports:
        {{- range $probePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
