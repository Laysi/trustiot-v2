# Defaults shared by every TrustIoT install. README.md documents every field.
#
# Values are layered (later layers win):
#   1. values.yaml                          defaults (this file)
#   2. values-saas.yaml | values-onprem.yaml   deployment shape
#   3. instance overlay                     hosts, external endpoints and Secret names of one install
# values.schema.json validates the merged result, so a missing or misspelled field fails
# `helm lint`, `helm template` and `helm install` instead of producing a broken release.
# Values never hold secret material: credentials are referenced by Secret name and key only.

global:
  # Deployment shape: "saas" (multi-tenant, behind Cloudflare Tunnel) or "onprem" (single tenant).
  # Set by values-saas.yaml or values-onprem.yaml.
  deploymentMode: ""
  # Names of existing Secrets (type kubernetes.io/dockerconfigjson) used to pull images,
  # for example the read-only GHCR pull token on SaaS.
  imagePullSecrets: []

# Public host names. Portability rule 1: use our own domain names (never IP addresses),
# so moving between SaaS and on-prem only changes DNS.
hosts:
  # SPA and API, served from the same origin (decision 2).
  app: ""
  # Gateways connect here: MQTT inside WebSocket on 443, and HTTPS certificate renewal.
  gateway: ""
  # Gateways download OTA updates from here.
  ota: ""

ingress:
  # How traffic reaches the ingress gateway (decisions 6 and 27):
  #   tunnel  ClusterIP only; cloudflared on the host forwards to it (SaaS).
  #   direct  The ingress gateway listens on 443 in the customer network (on-prem,
  #           and the SaaS fallback when Cloudflare is unavailable).
  # The MQTT broker is never exposed in either mode; gateways reach it only through
  # the ingress gateway and mqtt-bridge.
  exposure: ""
  # Istio mesh extension provider (istiod meshConfig.extensionProviders) that sends the cookie
  # of every request to the identity service (ext_authz). deploy/istio sets it up with
  # failOpen false, a short timeout and statusOnError 503; the chart only refers to it by name.
  authzProvider: trustiot-identity
  # Ingress gateway pods (Istio's gateway Deployment, configured through
  # infrastructure.parametersRef).
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "2"
      memory: 512Mi
  tunnel:
    # Sources allowed to reach the ingress pods when exposure is tunnel (NetworkPolicy): only the
    # host, where cloudflared and the kubelet run. On k3s the host reaches pods from cni0, the
    # first address of the node's pod CIDR (10.42.0.1 on a single-node default install).
    allowedSources:
      - 10.42.0.1/32
    # Fixed ClusterIP of the ingress gateway Service when exposure is tunnel (empty: Kubernetes
    # picks one). cloudflared forwards to this address, so set it wherever a tunnel route points
    # at the Service: a recreated Service then comes back with the same address instead of a new
    # one, and the old address cannot pass to another Service that the tunnel would then publish.
    # Pick an unused address in the static band of the cluster's Service range, the first
    # min(max(16, size / 16), 256) addresses (10.43.0.1-10.43.1.0 on k3s's default 10.43.0.0/16;
    # kubernetes and kube-dns hold 10.43.0.1 and 10.43.0.10). Kubernetes hands out dynamic
    # addresses from the rest of the range first and from the static band only when the rest is
    # used up, so no other Service takes it in practice; an address outside the band can go to any
    # Service created before ours. One IPv4 address; set only with exposure tunnel. ClusterIP is
    # immutable: changing it means deleting the Istio-generated Service so Istio recreates it
    # (README.md, "入口 gateway").
    clusterIP: ""
  direct:
    # Service type of the ingress gateway when exposure is direct; it listens on 443.
    # LoadBalancer uses k3s ServiceLB or the customer's load balancer.
    serviceType: LoadBalancer
    # Existing kubernetes.io/tls Secret with the outer TLS certificate (the customer's, or one
    # from our CA) for hosts.app, hosts.gateway and hosts.ota. Required when exposure is direct.
    tlsSecret: ""
  # The only paths that skip the cookie check (decision 27), besides the SPA's static files while
  # services.web is enabled. Each is one exact path on a fixed host and backend; the ingress
  # strips x-internal-identity from these requests. A path is exempt only while its backend
  # service is enabled.
  publicPaths:
    # hosts.app -> identity
    login: /auth/login
    # hosts.app -> identity (external uptime checks)
    healthCheck: /healthz
    # hosts.gateway -> certs (gateways renew certificates with a TPM signature, decision 12)
    certRenewal: /certs/renew
    # hosts.gateway -> mqtt-bridge (MQTT inside WebSocket)
    mqtt: /mqtt
  # Routes that need the cookie: {host: app|gateway|ota, path, match: PathPrefix|Exact,
  # service: <key under services>, port: <port name, default http>}. Services add their routes
  # when they ship. Paths under /internal/ are never routed (decision 27). While services.web is
  # enabled, a route on hosts.app must be /api, /auth or below them: every other path there is
  # the SPA's.
  routes: []

# Defaults for every entry under `services`. An entry overrides them field by field
# (maps merge recursively, lists and scalars are replaced); each probe under `probes`
# is replaced as a whole; `env` is appended to `serviceDefaults.env`.
serviceDefaults:
  image:
    # Registry prefix; the image is <registry>/<service name> unless `repository` is set.
    registry: ghcr.io/laysi/trustiot-v2
    # Full repository; overrides registry/<service name>.
    repository: ""
    # Empty means Chart.appVersion (services are released together, decision 4).
    tag: ""
    # sha256 digest; when set, the image is pinned to it.
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Container ports; the Service exposes the same port numbers (servicePort overrides it).
  ports:
    - name: http
      containerPort: 8080
      appProtocol: http
  # Container port of the health endpoints, named "health": services serve /healthz and /readyz
  # there and nothing else (crates/service-kit, http.health_listen_addr). The probes use it, and
  # the Service does not expose it: only the kubelet calls it.
  healthPort: 8081
  # Extra environment variables for every service, so they must not read Secrets. Names starting
  # with TRUSTIOT_ plus a letter or digit, SENTRY_ or OTEL_ are reserved for the chart.
  env: []
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # runAsUser is not fixed, so OpenShift's restricted-v2 SCC can assign the UID.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Kubernetes probe objects. Liveness and readiness are mandatory; set startup to {} to disable it.
  # They use the health port: the node reaches a pod only on its probe ports (README.md, "節點來源"),
  # so a probe on http would open the whole API to every process on the node.
  probes:
    startup:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: health
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  # Delay before SIGTERM so endpoint removal reaches the ingress and ztunnel first; 0 disables it.
  preStopSleepSeconds: 5
  # Time between SIGTERM and SIGKILL: services fail readiness, finish in-flight work and close
  # long-lived connections within it. The pod's terminationGracePeriodSeconds is
  # preStopSleepSeconds + drainSeconds, because Kubernetes counts the preStop sleep in it.
  drainSeconds: 30
  # Size limit of the writable /tmp (emptyDir); the root filesystem is read-only.
  tmpSizeLimit: 64Mi
  # Services do not call the Kubernetes API.
  automountServiceAccountToken: false
  # Images are built for arm64 only (decision 5).
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

# TrustIoT services (docs/architecture/deployment.md). Each one is switched on by the issue
# that ships its image; until then it stays disabled. Besides the serviceDefaults fields, an
# entry can list `credentials`: the dependency Secrets that only this service receives
# (qdrant-read, qdrant-write, object-storage, smtp, ai; the AI keys only for ai-gateway and the
# Qdrant keys only for knowledge); see README.md. A service that uses Postgres (mesh.calls) also
# has `database.maxConnections`: the size of its main pool, which the chart passes as
# TRUSTIOT__DATABASE__MAX_CONNECTIONS. Its other pools are fixed by its code; the render fails when
# every replica of every such service, plus one more of each during a rolling update, could open
# more connections than postgres.bundled.parameters.max_connections allows (README.md,
# 「叢集內的 Postgres」).
services:
  # The SPA's static files (services/web, decision 2). While enabled, every path on hosts.app
  # outside /api and /auth reaches it without the cookie check, and without the Cookie and
  # x-internal-identity headers (decision 27); cookie routes on hosts.app must then be /api,
  # /auth or below them.
  web:
    enabled: false
  identity:
    enabled: false
    # The API (http: the ext_authz check, the tenant API) and the token exchange on a port of its
    # own (token-exchange, the service's exchange.listen_addr; Laysi/trustiot-v2#106). The mesh
    # lets the ingress gateway and the services that list identity in mesh.calls reach the API port
    # only, and the services that call on behalf of users the token-exchange port only
    # (README.md, "呼叫矩陣"). The numbers are the service's defaults; keep both ports when
    # overriding the list: the render fails without token-exchange while mesh.calls has calls on
    # behalf of users.
    ports:
      - name: http
        containerPort: 8080
        appProtocol: http
      - name: token-exchange
        containerPort: 8082
        appProtocol: http
    # The signing keys file is mode 0440, owned by root and the pod's fsGroup, so the service reads
    # it through this group and no other user in the container can (README.md, "內部身分"). On
    # OpenShift set fsGroup to null: the restricted-v2 SCC assigns one from the namespace range.
    podSecurityContext:
      fsGroup: 65532
    # Mails login codes through the relay in `smtp` (services/identity/README.md, "登入").
    credentials:
      - smtp
    # The ext_authz check's pool, 3 to 100 (it always keeps 3 open). Each replica opens 21 more
    # in its other pools: 31 in all.
    database:
      maxConnections: 10
  assets:
    enabled: false
    # 2 to 100. Each replica opens 2 more to read the identity service's events: 12 in all.
    database:
      maxConnections: 10
  certs:
    enabled: false
    # 2 to 100. Each replica opens 4 more for factory registrations: 9 in all.
    database:
      maxConnections: 5
    # The API (http: the CA chain and CRLs for the MQTT broker, the workstation certificate API)
    # and the MQTT broker's server certificate issuance on a port of its own (broker-certs, the
    # service's broker.listen_addr; Laysi/trustiot-v2#557). The mesh lets the ingress gateway and
    # the services that list certs in mesh.calls reach the API port only, and the MQTT broker's
    # pod the broker-certs port too (README.md, "呼叫矩陣"). The numbers are the service's
    # defaults; keep both ports when overriding the list: the render fails without broker-certs
    # while the MQTT broker is enabled. The broker always calls the Service
    # <release>-certs-broker on 8082, which forwards to whatever containerPort broker-certs has.
    ports:
      - name: http
        containerPort: 8080
        appProtocol: http
      - name: broker-certs
        containerPort: 8082
        appProtocol: http
    # The issuing CA keys file is mode 0440, owned by root and the pod's fsGroup, so the service
    # reads it through this group and no other user in the container can (README.md, "閘道器憑證
    # CA"). A group of its own, not identity's: no other pod is in it. On OpenShift set fsGroup to
    # null, as for identity.
    podSecurityContext:
      fsGroup: 65533
  ingest:
    enabled: false
  telemetry-query:
    enabled: false
    # 2 to 100. Each replica opens 2 more to read the identity service's events: 12 in all.
    database:
      maxConnections: 10
  gateway-ops:
    enabled: false
  mqtt-bridge:
    enabled: false
  assistant:
    enabled: false
  # The AI gateway (services/ai-gateway, decisions 15 and 28): the providers, model roles and limits
  # come from `ai` below. Only the AI assistant, the knowledge base and alerts may call it
  # (mesh.calls; README.md, "服務間授權（mesh）").
  ai-gateway:
    enabled: false
    # The provider keys (ai.providers.*.apiKeySecret): only this service may list them, and the
    # gateway does not start without them, so the render fails while it is enabled without ai.
    credentials:
      - ai
    # A model's answer streams for minutes and cannot go on in another pod, so the gateway lets
    # the streams in flight run to their end while it drains (services/ai-gateway/README.md,
    # 「關機」). The chart sets its shutdown.drain_timeout to drainSeconds - 10 s (300 s here);
    # 11 to 3605.
    drainSeconds: 310
  alerts:
    enabled: false
  field-context:
    enabled: false
  knowledge:
    enabled: false

# Service-to-service authorization (decision 27). ztunnel adds mTLS to every connection and each
# service has its own ServiceAccount; a service accepts connections only from the callers listed
# here and, for the services it routes to, the ingress gateway. Two layers enforce the list
# independently: an AuthorizationPolicy per service (by ServiceAccount) and NetworkPolicies that
# deny everything else in the namespace.
mesh:
  # SPIFFE trust domain of the mesh (Istio meshConfig.trustDomain), used in the callers'
  # identities <trustDomain>/ns/<namespace>/sa/<ServiceAccount>.
  trustDomain: cluster.local
  # Who may call whom: <caller>: [<callee>, ...]. Callers are keys under `services`; callees are
  # keys under `services`, the in-cluster components `clickhouse` (bundled mode), `otel-collector`
  # and `mqtt-broker` (mqttBroker.enabled), or `postgres`. Each service's issue adds the internal APIs it calls. Calls
  # involving a disabled service or a component that is not deployed are skipped. The chart adds
  # the telemetry calls itself: every service to the collector, the collector to ClickHouse.
  # `postgres` (bundled or external) is how a service declares that it uses Postgres: only those
  # services get the server's CA file and, bundled, reach the Postgres pods (README.md).
  # A call from one service to another (ai-gateway aside) is also a call on behalf of users: the
  # identity service exchanges the request's token for one addressed to the callee along these
  # calls only, one hop (a token it exchanged is never exchanged again), and every such caller
  # may reach the identity service's token-exchange port, and no other port of it (README.md,
  # "呼叫矩陣"). Listing identity as a callee grants its API port instead, ext_authz check
  # included, so list it only for a service that calls the identity service's own API.
  calls:
    # The identity service keeps its sessions, users and tenants in Postgres
    # (services/identity/README.md).
    identity:
      - postgres
    # The assets service keeps its data in Postgres and reads the identity service's events from
    # there as its platform role (services/assets/README.md).
    assets:
      - postgres
    # The certs service keeps the ledger of the certificates it signed and its CRLs in Postgres
    # (services/certs/README.md).
    certs:
      - postgres
    # ClickHouse (decision 14): ingest writes telemetry, telemetry-query reads it with per-tenant
    # read-only accounts (docs/architecture/deployment.md). telemetry-query keeps which tenants
    # have an account in Postgres and reads the identity service's events from there as its
    # platform role (services/telemetry-query/README.md). The MQTT broker (Laysi/trustiot-v2#84):
    # mqtt-bridge carries the gateways' connections to its gateway port; ingest and gateway-ops
    # log in on its service port with their broker accounts. certs, dynamic security's
    # administrator, is added with the gateway registration (Laysi/trustiot-v2#82).
    ingest:
      - clickhouse
      - mqtt-broker
    telemetry-query:
      - clickhouse
      - postgres
    gateway-ops:
      - mqtt-broker
    mqtt-bridge:
      - mqtt-broker

# Internal identity (decision 27): for every request that passes the cookie check, the identity
# service signs a short-lived token for the backend, and every service verifies it with the
# identity service's public keys. The Ed25519 key pair is generated in the cluster: the identity
# pod's init container keeps the private keys in the Secret <release>-identity-signing-keys, which
# only the identity service reads, and their public keys in the ConfigMap
# <release>-internal-identity-keys, which every service mounts and rereads without a restart.
# Nobody creates, sees, copies or rotates a key (docs/architecture/secrets.md, 「內部身分簽章金鑰」).
internalIdentity:
  # Increase it to rotate the signing key: the identity service restarts, its init container adds
  # a new key, publishes its public key at once and lets it sign keyPropagationSeconds later; the
  # old key leaves at the first identity pod start (or run of the rotation CronJob below) after its
  # last token expired. Rotation by age keeps this generation, so this stays the number to raise
  # for a manual rotation and to revoke below. Only goes up: a rollback to a lower number changes
  # nothing (docs/runbooks/secrets.md).
  keyGeneration: "1"
  # Set it to a new generation (and keyGeneration to at least it) when a private key leaked: keys
  # of a lower generation are removed at once and a new key signs right away. Leave it afterwards.
  revokeBeforeGeneration: "0"
  # How long a new public key is published before its key signs: the time every pod needs to see
  # the ConfigMap change (the kubelet's sync period plus its cache, about a minute by default).
  # Raise it on a cluster with a longer kubelet syncFrequency. 120 to 86400.
  keyPropagationSeconds: 600
  # Automatic rotation by key age (Laysi/trustiot-v2#429): once the signing key was published this
  # many seconds ago, the CronJob <release>-identity-key-rotation adds a new key and rotates it in
  # like a manual rotation (published first, signing keyPropagationSeconds later, the old key
  # removed once its last token expired), with no restart. 0 turns it off. Otherwise at least
  # 2 * keyPropagationSeconds + 305 and at most 31536000 (365 days). Default: 90 days.
  maxKeyAgeSeconds: 7776000
  # When the CronJob checks the key's age, in Etc/UTC: @daily, @midnight, @hourly, or a cron
  # schedule whose day of month, month and day of week are *, so it runs every day (the schema
  # rejects anything sparser: a key would outlive maxKeyAgeSeconds by weeks, and the identity
  # service logs an ERROR when its key is two days past its rotation).
  keyRotationSchedule: "17 3 * * *"
  # Installations from before Laysi/trustiot-v2#404 only, while they move over (README.md,
  # 「內部身分」): the Secret a person made with the identity service's PKCS#8 private key, and
  # its public key {kid, x}. The init container imports that key once, under its key id, so the
  # rolling upgrade keeps one key; the next upgrade without both settings rotates it away. Leave
  # them empty on a new installation.
  publicKeys: []
  signingKeySecret:
    name: ""
    key: signing-key.pem

# Gateway certificate authority (decision 12, Laysi/trustiot-v2#78): the certs service signs the
# gateways' client certificates with an online issuing CA under an offline root
# (services/certs/README.md, 「CA 階層與私鑰保管」). The issuing CA's ECDSA P-256 key is generated in
# the cluster: the certs pod's init container keeps it in the Secret <release>-certs-ca-keys, which
# only the certs service reads, and writes its certificate signing request into the ConfigMap
# <release>-certs-ca-requests. An operator signs that request with the offline root and sets the
# certificate below; nobody sees or copies an issuing CA private key. Until an issuing CA
# certificate for one of its keys is set the service is ready but cannot sign: its gauge
# certs.ca.signing is 0 and it logs the waiting key at every check.
certificateAuthority:
  # Raise it to add an issuing CA key (rotation, or replacing a key that leaked): the certs pods
  # restart, the first one's init container adds a key of this generation and writes its request;
  # the older keys keep signing until the new key's certificate is set below. Only goes up: a
  # rollback to a lower number changes nothing. 1 to 9 digits.
  keyGeneration: "1"
  # Keys of a lower generation are removed at the next certs pod start: they no longer sign and
  # their CRLs are no longer published, so the broker refuses every certificate they signed
  # (services/certs/README.md, 「簽發 CA 金鑰遺失或外洩」). 0 removes nothing.
  removeKeysBeforeGeneration: "0"
  # The offline root CA's certificate: its DER in base64 on one line (public). Empty until the
  # root ceremony.
  rootCertificate: ""
  # The issuing CA certificates the root signed, one per key, each its DER in base64 on one line
  # (public); at most 4. The service picks up a change without a restart.
  issuingCertificates: []

# Migration Job (tools/migrate, Laysi/trustiot-v2#60): applies every service's Postgres
# migrations and the ClickHouse DDL with the migration role, creates the service roles and the
# collector's ClickHouse account, and runs before any service starts: every service pod waits in
# an init container until the Job is complete. The Job's name carries a hash of its spec, so it
# runs again whenever its image or settings change, and only then (README.md, "migration Job").
migrate:
  enabled: true
  image:
    # Our migration image (deploy/images/migrate), released with the services.
    repository: ghcr.io/laysi/trustiot-v2/migrate
    # Empty means Chart.appVersion.
    tag: ""
    # sha256 digest; when set, the image is pinned to it.
    digest: ""
    pullPolicy: IfNotPresent
  # Change it to run the Job again without another change, for example after a password Secret
  # lost its data (docs/runbooks/migrations.md). The services restart too.
  revision: "1"
  # The Job generates the password of every service's Postgres login role and of the collector's
  # ClickHouse account into one Secret per consumer (templates/passwords.yaml); nobody sets them.
  # Increase this number to rotate all of them: the next run generates new passwords, sets them,
  # and the services and the collector restart with them (docs/runbooks/secrets.md).
  passwordGeneration: "1"
  # How long the Job waits for Postgres and ClickHouse to accept connections, and for another run
  # to release the migration lock (TRUSTIOT__WAIT__DATABASES, TRUSTIOT__WAIT__LOCK).
  wait:
    databases: 10m
    lock: 10m
  # Kubernetes stops the Job after this many seconds; more than both waits above.
  activeDeadlineSeconds: 1800
  # Retries of a failed run; every run is idempotent.
  backoffLimit: 3
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 128Mi
  # The image is built for arm64 only (decision 5).
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations: []

# External dependencies (portability rule 2). Managed or self-hosted differs only in values.

postgres:
  # bundled: a CloudNativePG Cluster deployed by this chart in the release namespace
  #   (Laysi/trustiot-v2#58). The CloudNativePG operator is a platform component that must already
  #   run in the cluster (deploy/cloudnative-pg/README.md), like Istio.
  # external: a Postgres with Apache AGE that you run elsewhere.
  # Services that use Postgres list `postgres` under mesh.calls.
  mode: bundled
  # Each such service logs in with its own role, <service>_app ("-" in the service name written
  # "_"), whose password the migration Job generates into the Secret <release>-<service>-password
  # (migrate.passwordGeneration); the service gets it as TRUSTIOT__DATABASE__PASSWORD.
  bundled:
    image:
      # Our CloudNativePG operand image: PostgreSQL 18 with Apache AGE (deploy/images/postgres),
      # published by the release together with the services.
      repository: ghcr.io/laysi/trustiot-v2/postgres
      # Empty means Chart.appVersion.
      tag: ""
      # sha256 digest; when set, the image is pinned to it.
      digest: ""
      pullPolicy: IfNotPresent
    storage:
      # Required in bundled mode: data and WAL of the one instance, sized by each deployment
      # (README.md, 叢集內的 Postgres).
      size: ""
      # Empty: the cluster's default StorageClass.
      storageClassName: ""
    # Sized for one 8 GB node shared with ClickHouse and the services (README.md); the same in both
    # deployment shapes.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    # PostgreSQL memory and connection settings that fit the memory limit above. Only these keys
    # are accepted; TLS and authentication are set by the chart and CloudNativePG.
    parameters:
      shared_buffers: 128MB
      effective_cache_size: 384MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
      # Fits identity, assets, certs and telemetry-query at one replica each while all of them
      # roll at once (128) plus the 17 reserved connections, with room for 15 more; the render
      # fails when the enabled services need more. The memory estimate is in README.md
      # (「叢集內的 Postgres」).
      max_connections: 160
    # The image is built for arm64 only (decision 5).
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations: []
    # Where the CloudNativePG operator runs: the NetworkPolicy admits its status checks on the
    # Postgres pods. Match an operator that the customer already runs (deploy/cloudnative-pg).
    operator:
      namespace: cnpg-system
      podLabels:
        app.kubernetes.io/name: cloudnative-pg
  external:
    host: ""
    port: 5432
    database: trustiot
    # Server certificate verification (checklist M3); only verify-full is accepted.
    sslMode: verify-full
    # CA certificate that signed the server certificate; mounted read-only into the services that
    # list postgres under mesh.calls.
    caSecret:
      name: ""
      key: ca.crt
    # Existing Secret with the migration role: the owner of the database, with CREATEROLE and
    # without SUPERUSER or BYPASSRLS (README.md, "migration Job"). Only the migration Job reads
    # it. Required in external mode while the Job is enabled.
    migrationSecret:
      name: ""
      usernameKey: username
      passwordKey: password

clickhouse:
  # bundled: ClickHouse deployed by this chart (Laysi/trustiot-v2#59).
  # external: ClickHouse Cloud or another server (fallback only, decision 14).
  mode: bundled
  # Single-node ClickHouse in this cluster (decision 14). Users, roles, row policies, settings
  # profiles and quotas are created with SQL by the migration Job (services/ingest/migrations),
  # never in these values or the server configuration.
  bundled:
    image:
      # clickhouse/clickhouse-server 26.8 LTS, pinned to the multi-arch index digest (arm64
      # included). scripts/lib/stack.ts and services/ingest/tests use the same tag and digest; the
      # chart tests fail when the three differ, and Renovate updates the three together.
      repository: docker.io/clickhouse/clickhouse-server
      tag: "26.8"
      digest: sha256:110d3d1f8e1ed7e451a6b5d85a16761e948ad43bc2d9ddf10b155964a8b2b40c
      pullPolicy: IfNotPresent
    # Bootstrap account with access management, created by the image from the variables below
    # and used only by the migration Job. The image's passwordless "default" user is removed.
    adminUser: trustiot_admin
    # Its password is generated in the cluster (Laysi/trustiot-v2#403): the ClickHouse pod's init
    # container, which runs the migration image (arm64 only, so the chart adds
    # kubernetes.io/arch: arm64 to nodeSelector), fills the Secret
    # <release>-clickhouse-admin-password, which the chart declares empty, and the server starts
    # with that password; the migration Job reads it from the Secret. Nobody creates the Secret.
    # Increase this number to rotate the password: the upgrade restarts ClickHouse, whose init
    # container generates a new one first (docs/runbooks/secrets.md).
    adminPasswordGeneration: "1"
    # Only for installations from before Laysi/trustiot-v2#403 that still use a Secret a person
    # created: its name (and key) here make the server read that Secret instead, and there is no
    # init container. Leave the name empty, the default, to have the password generated;
    # README.md, "叢集內的 ClickHouse", has the move.
    adminSecret:
      name: ""
      key: password
    # With adminSecret only: the server reads the password only at start, so after changing that
    # Secret change this value too, so the upgrade restarts ClickHouse with the new password.
    adminSecretRevision: "1"
    storage:
      # Required in bundled mode; each deployment sizes it for its own load and retention:
      # rows per day x retention days x about 3.1 bytes per row (2026-10-09 measurement)
      # x 1.5 for merges and system tables. See deploy/chart/README.md.
      size: ""
      # Empty: the cluster's default StorageClass.
      storageClassName: ""
    # ClickHouse sizes its memory limit (90 %) and caches from the container's memory limit.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    # The image runs as the clickhouse user (UID 101) and declares no USER, so the UID is set
    # here; on OpenShift remove runAsUser, runAsGroup and fsGroup to let the SCC assign them.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    nodeSelector: {}
    tolerations: []
  external:
    # HTTPS endpoint, for example https://abc.clickhouse.cloud:8443
    url: ""
    # CA certificate for a private CA, mounted read-only into every service; leave the name
    # empty for a publicly trusted certificate.
    caSecret:
      name: ""
      key: ca.crt
    # Existing Secret with an account that has access management, for the migration Job only
    # (the bundled server's counterpart is adminSecret). Required in external mode while the Job
    # is enabled.
    migrationSecret:
      name: ""
      usernameKey: username
      passwordKey: password

# MQTT broker (Mosquitto 2.1, decision 6, Laysi/trustiot-v2#84; README.md, "MQTT broker"), inside
# the cluster only: a ClusterIP Service that no ingress route reaches. Port 8883 takes gateways,
# TLS with a gateway certificate of the certs service's CA, from mqtt-bridge only; port 1883 takes
# the cloud services that list mqtt-broker in mesh.calls (ingest, gateway-ops, certs), each with a
# broker account whose password is generated in the cluster. Off until a deployment turns it on.
mqttBroker:
  enabled: false
  image:
    # eclipse-mosquitto 2.1 (Alpine), pinned to the multi-arch index digest (arm64 included).
    # crates/protocol/tests/broker.rs, tools/migrate/tests/mqtt_broker.rs and scripts/lib/stack.ts
    # use the same tag and digest; the chart tests fail when they differ.
    repository: docker.io/library/eclipse-mosquitto
    tag: 2.1.2-alpine
    digest: sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    pullPolicy: IfNotPresent
  # The services' broker passwords are generated in the cluster: the broker pod's init container,
  # which runs the migration image (arm64 only, so the chart adds kubernetes.io/arch: arm64 to
  # nodeSelector), fills the Secret <release>-mqtt-broker-accounts, which the chart declares
  # empty, and gives the broker only their hashes. Increase this number to rotate them: the
  # upgrade restarts the broker, whose init container generates new ones first.
  passwordGeneration: "1"
  # How often the broker pod's trust sidecar fetches the CA certificates and CRLs from the certs
  # service and checks the server certificate Secret; the broker reloads them when they changed.
  trustInterval: 30s
  storage:
    # Sessions, queued and retained messages, the dynamic security file and the trust files.
    size: 1Gi
    # Empty: the cluster's default StorageClass.
    storageClassName: ""
  # The broker's memory_limit (it refuses new messages above it instead of being killed) is three
  # quarters of limits.memory, which must therefore be given in Mi or Gi.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # The image's mosquitto user (UID and GID 1883). Every container of the pod runs as this user:
  # the trust sidecar can signal the broker only as the same user (README.md, "MQTT broker").
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1883
    runAsGroup: 1883
    fsGroup: 1883
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []

qdrant:
  # bundled: Qdrant deployed in this cluster (on-prem, decision 19).
  # external: Qdrant Cloud or another server (SaaS).
  mode: ""
  external:
    # For example https://xyz.eu-central-1-0.aws.cloud.qdrant.io:6333
    url: ""
    # Retrieval uses a read-only key, background processing a write key
    # (docs/architecture/rag.md).
    credentialsSecret:
      name: ""
      readApiKeyKey: read-api-key
      writeApiKeyKey: write-api-key

# S3-compatible object storage for PDFs, page images and chat attachments (decision 20).
objectStorage:
  # Empty uses the AWS S3 endpoint for `region`; set it for R2 or other S3-compatible storage.
  endpoint: ""
  region: ""
  bucket: ""
  forcePathStyle: false
  credentialsSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

# Outgoing email for alerts and reports (decision 18); on-prem uses the customer's SMTP.
smtp:
  host: ""
  port: 587
  # starttls or tls (implicit TLS, usually port 465). Plain SMTP is not supported.
  security: starttls
  # Sender, for example "TrustIoT <noreply@example.com>".
  from: ""
  # Leave the name empty when the relay does not need authentication.
  credentialsSecret:
    name: ""
    usernameKey: username
    passwordKey: password

# The AI gateway's providers and model roles (services/ai-gateway, decisions 15 and 28, J8). Each
# provider speaks its native protocol; only ai-gateway gets the keys. The chart hands the gateway
# these settings in the ConfigMap <release>-ai-gateway, without any key (README.md, "AI 閘道").
ai:
  providers:
    # Anthropic Messages. A provider is configured when its apiKeySecret has a name.
    anthropic:
      # Empty: Anthropic's own API (https://api.anthropic.com). To go through Cloudflare AI Gateway,
      # set its https URL here (for example https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/anthropic).
      baseUrl: ""
      apiKeySecret:
        name: ""
        key: api-key
    # OpenAI Decisions. Empty baseUrl: OpenAI's own API (https://api.openai.com).
    openai:
      baseUrl: ""
      apiKeySecret:
        name: ""
        key: api-key
  # Model roles: <role>: {models: [<provider>/<model id>, ...]}, the first choice first and then its
  # fallbacks (1 to 8). The gateway needs at least one role, and every provider a role names needs
  # its apiKeySecret. Optional per role: maxConcurrent, queueWait, timeouts (connect, firstToken,
  # streamIdle, streamTotal, response), maxResponseBytes, maxEventBytes (README.md, "AI 閘道").
  roles: {}
  # The gateway's http.request_timeout: a call's time budget up to its response or first streamed
  # output is this minus a tenth, at most 2 s. Every role's queueWait plus the longer of its
  # response and firstToken limits must fit, or the gateway does not start; the defaults need 300 s.
  requestTimeout: 10m

observability:
  # Error tracking (decision 24): SaaS sends to sentry.io; on-prem is off unless the
  # customer runs Sentry. When enabled, every service gets SENTRY_DSN and SENTRY_ENVIRONMENT.
  sentry:
    enabled: false
    # Sentry environment tag, for example production or staging.
    environment: ""
    dsnSecret:
      name: ""
      key: dsn
  # OpenTelemetry collector (decision 22). Every service sends its logs, traces and metrics to it
  # over OTLP/HTTP (the chart sets TRUSTIOT__TELEMETRY__OTLP_ENDPOINT). The collector redacts
  # credentials, personal data, request bodies and chat content, then writes logs and traces to
  # the trustiot_logs database in ClickHouse (services/ingest/migrations/clickhouse/0006_logs.sql,
  # 30 day retention) and, when forwarding is on, also sends them to the customer's SIEM.
  # Metrics are accepted and dropped until their storage is decided (Laysi/trustiot-v2#183).
  collector:
    enabled: true
    image:
      # opentelemetry-collector-contrib (it has the ClickHouse exporter and the redaction
      # processor), pinned to the multi-arch index digest (arm64 included). Changing the
      # version can change the exporter's columns: check them against 0006_logs.sql.
      repository: docker.io/otel/opentelemetry-collector-contrib
      tag: "0.161.0"
      digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
      pullPolicy: IfNotPresent
    # The collector's ClickHouse account. The migration Job creates it with SQL and grants it the
    # trustiot_otel_collector role (INSERT into the log tables only), never in server
    # configuration files (decision 14), with a password it generates into the Secret
    # <release>-otel-collector-password (migrate.passwordGeneration).
    clickhouse:
      user: trustiot_collector
    # Copy of the redacted logs (and optionally traces) for the customer's SIEM over OTLP.
    forward:
      enabled: false
      # OTLP endpoint of the SIEM: for http the base URL (the exporter appends /v1/logs and
      # /v1/traces), for grpc https://host:port. https unless the SIEM is on a trusted network.
      endpoint: ""
      # http (OTLP/HTTP, protobuf) or grpc.
      protocol: http
      # Signals to forward: logs, traces.
      signals:
        - logs
      # Optional header the SIEM authenticates with, for example Authorization. The whole header
      # value (for example "Bearer <token>") is read from the Secret.
      authHeader:
        name: ""
        valueSecret:
          name: ""
          key: value
      # CA certificate for a SIEM with a private CA; leave the name empty for a public one.
      caSecret:
        name: ""
        key: ca.crt
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # The image runs as the numeric non-root UID 10001; it is not fixed here, so OpenShift's
    # restricted-v2 SCC can assign one.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # The image is multi-arch; while migrate.enabled is true the pod also runs the migration image
    # (its init container), which is arm64 only, so the chart adds kubernetes.io/arch: arm64.
    nodeSelector: {}
    tolerations: []
