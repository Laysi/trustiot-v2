# Defaults shared by every TrustIoT install. README.md documents every field.
#
# Values are layered (later layers win):
#   1. values.yaml                          defaults (this file)
#   2. values-saas.yaml | values-onprem.yaml   deployment shape
#   3. instance overlay                     hosts, external endpoints and Secret names of one install
# values.schema.json validates the merged result, so a missing or misspelled field fails
# `helm lint`, `helm template` and `helm install` instead of producing a broken release.
# Values never hold secret material: credentials are referenced by Secret name and key only.

global:
  # Deployment shape: "saas" (multi-tenant, behind Cloudflare Tunnel) or "onprem" (single tenant).
  # Set by values-saas.yaml or values-onprem.yaml.
  deploymentMode: ""
  # Names of existing Secrets (type kubernetes.io/dockerconfigjson) used to pull images,
  # for example the read-only GHCR pull token on SaaS.
  imagePullSecrets: []

# Public host names. Portability rule 1: use our own domain names (never IP addresses),
# so moving between SaaS and on-prem only changes DNS.
hosts:
  # SPA and API, served from the same origin (decision 2).
  app: ""
  # Gateways connect here: MQTT inside WebSocket on 443, and HTTPS certificate renewal.
  gateway: ""
  # Gateways download OTA updates from here.
  ota: ""

ingress:
  # How traffic reaches the ingress gateway (decisions 6 and 27):
  #   tunnel  ClusterIP only; cloudflared on the host forwards to it (SaaS).
  #   direct  The ingress gateway listens on 443 in the customer network (on-prem,
  #           and the SaaS fallback when Cloudflare is unavailable).
  # The MQTT broker is never exposed in either mode; gateways reach it only through
  # the ingress gateway and mqtt-bridge.
  exposure: ""
  # Istio mesh extension provider (istiod meshConfig.extensionProviders) that sends the cookie
  # of every request to the identity service (ext_authz). deploy/istio sets it up with
  # failOpen false, a short timeout and statusOnError 503; the chart only refers to it by name.
  authzProvider: trustiot-identity
  # Ingress gateway pods (Istio's gateway Deployment, configured through
  # infrastructure.parametersRef).
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "2"
      memory: 512Mi
  tunnel:
    # Sources allowed to reach the ingress pods when exposure is tunnel (NetworkPolicy): only the
    # host, where cloudflared and the kubelet run. On k3s the host reaches pods from cni0, the
    # first address of the node's pod CIDR (10.42.0.1 on a single-node default install).
    allowedSources:
      - 10.42.0.1/32
  direct:
    # Service type of the ingress gateway when exposure is direct; it listens on 443.
    # LoadBalancer uses k3s ServiceLB or the customer's load balancer.
    serviceType: LoadBalancer
    # Existing kubernetes.io/tls Secret with the outer TLS certificate (the customer's, or one
    # from our CA) for hosts.app, hosts.gateway and hosts.ota. Required when exposure is direct.
    tlsSecret: ""
  # The only paths that skip the cookie check (decision 27). Each is one exact path on a fixed
  # host and backend; the ingress strips x-internal-identity from these requests. A path is
  # exempt only while its backend service is enabled.
  publicPaths:
    # hosts.app -> identity
    login: /auth/login
    # hosts.app -> identity (external uptime checks)
    healthCheck: /healthz
    # hosts.gateway -> certs (gateways renew certificates with a TPM signature, decision 12)
    certRenewal: /certs/renew
    # hosts.gateway -> mqtt-bridge (MQTT inside WebSocket)
    mqtt: /mqtt
  # Routes that need the cookie: {host: app|gateway|ota, path, match: PathPrefix|Exact,
  # service: <key under services>, port: <port name, default http>}. Services add their routes
  # when they ship. Paths under /internal/ are never routed (decision 27).
  routes: []

# Defaults for every entry under `services`. An entry overrides them field by field
# (maps merge recursively, lists and scalars are replaced); each probe under `probes`
# is replaced as a whole; `env` is appended to `serviceDefaults.env`.
serviceDefaults:
  image:
    # Registry prefix; the image is <registry>/<service name> unless `repository` is set.
    registry: ghcr.io/laysi/trustiot-v2
    # Full repository; overrides registry/<service name>.
    repository: ""
    # Empty means Chart.appVersion (services are released together, decision 4).
    tag: ""
    # sha256 digest; when set, the image is pinned to it.
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Container ports; the Service exposes the same port numbers (servicePort overrides it).
  ports:
    - name: http
      containerPort: 8080
      appProtocol: http
  # Container port of the health endpoints, named "health": services serve /healthz and /readyz
  # there and nothing else (crates/service-kit, http.health_listen_addr). The probes use it, and
  # the Service does not expose it: only the kubelet calls it.
  healthPort: 8081
  # Extra environment variables for every service, so they must not read Secrets. Names starting
  # with TRUSTIOT_ plus a letter or digit, SENTRY_ or OTEL_ are reserved for the chart.
  env: []
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # runAsUser is not fixed, so OpenShift's restricted-v2 SCC can assign the UID.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Kubernetes probe objects. Liveness and readiness are mandatory; set startup to {} to disable it.
  # They use the health port: the node reaches a pod only on its probe ports (README.md, "節點來源"),
  # so a probe on http would open the whole API to every process on the node.
  probes:
    startup:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: health
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  # Delay before SIGTERM so endpoint removal reaches the ingress and ztunnel first; 0 disables it.
  preStopSleepSeconds: 5
  # Time between SIGTERM and SIGKILL: services fail readiness, finish in-flight work and close
  # long-lived connections within it. The pod's terminationGracePeriodSeconds is
  # preStopSleepSeconds + drainSeconds, because Kubernetes counts the preStop sleep in it.
  drainSeconds: 30
  # Size limit of the writable /tmp (emptyDir); the root filesystem is read-only.
  tmpSizeLimit: 64Mi
  # Services do not call the Kubernetes API.
  automountServiceAccountToken: false
  # Images are built for arm64 only (decision 5).
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

# TrustIoT services (docs/architecture/deployment.md). Each one is switched on by the issue
# that ships its image; until then it stays disabled. Besides the serviceDefaults fields, an
# entry can list `credentials`: the dependency Secrets that only this service receives
# (qdrant-read, qdrant-write, object-storage, smtp, ai; the AI keys only for ai-gateway and the
# Qdrant keys only for knowledge); see README.md.
services:
  identity:
    enabled: false
    # The signing key file is mode 0440, owned by root and the pod's fsGroup, so the service reads
    # it through this group and no other user in the container can (README.md, "內部身分"). On
    # OpenShift set fsGroup to null: the restricted-v2 SCC assigns one from the namespace range.
    podSecurityContext:
      fsGroup: 65532
  assets:
    enabled: false
  certs:
    enabled: false
  ingest:
    enabled: false
  telemetry-query:
    enabled: false
  gateway-ops:
    enabled: false
  mqtt-bridge:
    enabled: false
  assistant:
    enabled: false
  ai-gateway:
    enabled: false
  alerts:
    enabled: false
  field-context:
    enabled: false
  knowledge:
    enabled: false

# Service-to-service authorization (decision 27). ztunnel adds mTLS to every connection and each
# service has its own ServiceAccount; a service accepts connections only from the callers listed
# here and, for the services it routes to, the ingress gateway. Two layers enforce the list
# independently: an AuthorizationPolicy per service (by ServiceAccount) and NetworkPolicies that
# deny everything else in the namespace.
mesh:
  # SPIFFE trust domain of the mesh (Istio meshConfig.trustDomain), used in the callers'
  # identities <trustDomain>/ns/<namespace>/sa/<ServiceAccount>.
  trustDomain: cluster.local
  # Who may call whom: <caller>: [<callee>, ...]. Callers are keys under `services`; callees are
  # keys under `services` or the in-cluster components `clickhouse` (bundled mode) and
  # `otel-collector`. Each service's issue adds the internal APIs it calls. Calls involving a
  # disabled service or a component that is not deployed are skipped. The chart adds the
  # telemetry calls itself: every service to the collector, the collector to ClickHouse.
  calls:
    # ClickHouse (decision 14): ingest writes telemetry, telemetry-query reads it with per-tenant
    # read-only accounts (docs/architecture/deployment.md).
    ingest:
      - clickhouse
    telemetry-query:
      - clickhouse

# Internal identity (decision 27): for every request that passes the cookie check, the identity
# service signs a short-lived token for the backend, and every service verifies it with the
# public keys below. Rotation adds the new public key first, then swaps the private key, then
# removes the old public key (services/identity/README.md).
internalIdentity:
  # The identity service's Ed25519 public keys: {kid, x}, where x is the 32-byte public key in
  # base64url without padding. Not secret; every service gets them as the platform setting
  # TRUSTIOT_INTERNAL_IDENTITY_KEYS. Services refuse to start without them.
  publicKeys: []
  # Existing Secret with the identity service's private key in PKCS#8 PEM
  # (`openssl genpkey -algorithm ed25519`), mounted as a read-only file into the identity service
  # only. Its public key must be in publicKeys, or the identity service refuses to start.
  signingKeySecret:
    name: ""
    key: signing-key.pem

# External dependencies (portability rule 2). Managed or self-hosted differs only in values.

postgres:
  # bundled: CloudNativePG cluster deployed by this chart (Laysi/trustiot-v2#58).
  # external: a Postgres with Apache AGE that you run elsewhere.
  mode: bundled
  external:
    host: ""
    port: 5432
    database: trustiot
    # Server certificate verification (checklist M3); only verify-full is accepted.
    sslMode: verify-full
    # CA certificate that signed the server certificate; mounted read-only into every service.
    caSecret:
      name: ""
      key: ca.crt

clickhouse:
  # bundled: ClickHouse deployed by this chart (Laysi/trustiot-v2#59).
  # external: ClickHouse Cloud or another server (fallback only, decision 14).
  mode: bundled
  # Single-node ClickHouse in this cluster (decision 14). Users, roles, row policies, settings
  # profiles and quotas are created with SQL by the migration Job (services/ingest/migrations),
  # never in these values or the server configuration.
  bundled:
    image:
      # clickhouse/clickhouse-server 26.8 LTS, pinned to the multi-arch index digest (arm64
      # included). scripts/lib/stack.ts and services/ingest/tests use the same digest; the chart
      # tests fail when the three differ.
      repository: docker.io/clickhouse/clickhouse-server
      tag: "26.8"
      digest: sha256:110d3d1f8e1ed7e451a6b5d85a16761e948ad43bc2d9ddf10b155964a8b2b40c
      pullPolicy: IfNotPresent
    # Bootstrap account with access management, created by the image from the variables below
    # and used only by the migration Job. The image's passwordless "default" user is removed.
    adminUser: trustiot_admin
    # Existing Secret with the bootstrap account's password; required in bundled mode.
    adminSecret:
      name: ""
      key: password
    # The server reads the password only at start. After changing the Secret, change this value
    # too, so the upgrade restarts ClickHouse with the new password before the migration Job
    # uses it.
    adminSecretRevision: "1"
    storage:
      # Required in bundled mode; each deployment sizes it for its own load and retention:
      # rows per day x retention days x about 3.1 bytes per row (2026-10-09 measurement)
      # x 1.5 for merges and system tables. See deploy/chart/README.md.
      size: ""
      # Empty: the cluster's default StorageClass.
      storageClassName: ""
    # ClickHouse sizes its memory limit (90 %) and caches from the container's memory limit.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    # The image runs as the clickhouse user (UID 101) and declares no USER, so the UID is set
    # here; on OpenShift remove runAsUser, runAsGroup and fsGroup to let the SCC assign them.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    nodeSelector: {}
    tolerations: []
  external:
    # HTTPS endpoint, for example https://abc.clickhouse.cloud:8443
    url: ""
    # CA certificate for a private CA, mounted read-only into every service; leave the name
    # empty for a publicly trusted certificate.
    caSecret:
      name: ""
      key: ca.crt

qdrant:
  # bundled: Qdrant deployed in this cluster (on-prem, decision 19).
  # external: Qdrant Cloud or another server (SaaS).
  mode: ""
  external:
    # For example https://xyz.eu-central-1-0.aws.cloud.qdrant.io:6333
    url: ""
    # Retrieval uses a read-only key, background processing a write key
    # (docs/architecture/rag.md).
    credentialsSecret:
      name: ""
      readApiKeyKey: read-api-key
      writeApiKeyKey: write-api-key

# S3-compatible object storage for PDFs, page images and chat attachments (decision 20).
objectStorage:
  # Empty uses the AWS S3 endpoint for `region`; set it for R2 or other S3-compatible storage.
  endpoint: ""
  region: ""
  bucket: ""
  forcePathStyle: false
  credentialsSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

# Outgoing email for alerts and reports (decision 18); on-prem uses the customer's SMTP.
smtp:
  host: ""
  port: 587
  # starttls or tls (implicit TLS, usually port 465). Plain SMTP is not supported.
  security: starttls
  # Sender, for example "TrustIoT <noreply@example.com>".
  from: ""
  # Leave the name empty when the relay does not need authentication.
  credentialsSecret:
    name: ""
    usernameKey: username
    passwordKey: password

# OpenAI-compatible endpoints (decisions 15, 16, 26 and 28). On-prem points at the
# customer's endpoints (for example vLLM or Ollama).
ai:
  chat:
    baseUrl: ""
    apiKeySecret:
      name: ""
      key: api-key
  embedding:
    baseUrl: ""
    apiKeySecret:
      name: ""
      key: api-key
  # Reranking uses a chat-completions endpoint with a fast model (decision 26).
  rerank:
    baseUrl: ""
    apiKeySecret:
      name: ""
      key: api-key

observability:
  # Error tracking (decision 24): SaaS sends to sentry.io; on-prem is off unless the
  # customer runs Sentry. When enabled, every service gets SENTRY_DSN and SENTRY_ENVIRONMENT.
  sentry:
    enabled: false
    # Sentry environment tag, for example production or staging.
    environment: ""
    dsnSecret:
      name: ""
      key: dsn
  # OpenTelemetry collector (decision 22). Every service sends its logs, traces and metrics to it
  # over OTLP/HTTP (the chart sets TRUSTIOT__TELEMETRY__OTLP_ENDPOINT). The collector redacts
  # credentials, personal data, request bodies and chat content, then writes logs and traces to
  # the trustiot_logs database in ClickHouse (services/ingest/migrations/clickhouse/0006_logs.sql,
  # 30 day retention) and, when forwarding is on, also sends them to the customer's SIEM.
  # Metrics are accepted and dropped until their storage is decided (Laysi/trustiot-v2#183).
  collector:
    enabled: true
    image:
      # opentelemetry-collector-contrib (it has the ClickHouse exporter and the redaction
      # processor), pinned to the multi-arch index digest (arm64 included). Changing the
      # version can change the exporter's columns: check them against 0006_logs.sql.
      repository: docker.io/otel/opentelemetry-collector-contrib
      tag: "0.161.0"
      digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
      pullPolicy: IfNotPresent
    # The collector's ClickHouse account. The migration Job creates it with SQL and grants it the
    # trustiot_otel_collector role (INSERT into the log tables only), never in server
    # configuration files (decision 14).
    clickhouse:
      user: trustiot_collector
      # Existing Secret with the account's password; required when the collector is enabled.
      passwordSecret:
        name: ""
        key: password
    # Copy of the redacted logs (and optionally traces) for the customer's SIEM over OTLP.
    forward:
      enabled: false
      # OTLP endpoint of the SIEM: for http the base URL (the exporter appends /v1/logs and
      # /v1/traces), for grpc https://host:port. https unless the SIEM is on a trusted network.
      endpoint: ""
      # http (OTLP/HTTP, protobuf) or grpc.
      protocol: http
      # Signals to forward: logs, traces.
      signals:
        - logs
      # Optional header the SIEM authenticates with, for example Authorization. The whole header
      # value (for example "Bearer <token>") is read from the Secret.
      authHeader:
        name: ""
        valueSecret:
          name: ""
          key: value
      # CA certificate for a SIEM with a private CA; leave the name empty for a public one.
      caSecret:
        name: ""
        key: ca.crt
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # The image runs as the numeric non-root UID 10001; it is not fixed here, so OpenShift's
    # restricted-v2 SCC can assign one.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # The image is multi-arch.
    nodeSelector: {}
    tolerations: []
