# Ingress e2e overlay (ingress.e2e.ts). Use after a deployment shape and its instance overlay:
#   -f values-saas.yaml -f tests/values/saas-instance.yaml -f tests/e2e/values-e2e.yaml
# The test adds the identity double's image, the mesh extension provider name and, for the
# on-prem shape, the TLS Secret.
#
# Stand-ins: identity runs the identity double (tests/e2e/identity-double), and the other
# backends run traefik/whoami, which echoes every request header back. WHOAMI_NAME tells the
# test which backend answered.

services:
  identity:
    enabled: true
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
  # Needs the cookie: reached through the catch-all route below.
  assets:
    enabled: true
    image: &whoami
      repository: docker.io/traefik/whoami
      tag: v1.12.0
      digest: sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    env:
      - name: WHOAMI_PORT_NUMBER
        value: "8080"
      - name: WHOAMI_NAME
        value: protected-backend
    # whoami listens on one port only, so the whoami stand-ins are probed on http. The identity
    # double, like a TrustIoT service, is probed on its health port (healthPort).
    probes: &whoamiProbes
      startup:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 2
        failureThreshold: 30
      liveness:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        httpGet:
          path: /readyz
          port: http
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
    podSecurityContext: &nonroot
      runAsUser: 65532
      runAsGroup: 65532
  # Public paths on hosts.gateway.
  certs:
    enabled: true
    image: *whoami
    env:
      - name: WHOAMI_PORT_NUMBER
        value: "8080"
      - name: WHOAMI_NAME
        value: public-certs
    probes: *whoamiProbes
    podSecurityContext: *nonroot
  mqtt-bridge:
    enabled: true
    image: *whoami
    env:
      - name: WHOAMI_PORT_NUMBER
        value: "8080"
      - name: WHOAMI_NAME
        value: public-mqtt-bridge
    probes: *whoamiProbes
    podSecurityContext: *nonroot

ingress:
  # A catch-all like the SPA's: every path on hosts.app that is not public needs the cookie,
  # including /internal (denied) and the public paths of hosts.gateway.
  routes:
    - host: app
      path: /
      match: PathPrefix
      service: assets

# The ingress test needs no ClickHouse. External mode deploys no ClickHouse workload, so the
# run needs neither the admin Secret nor a data volume, and `helm install --wait` does not wait
# on a database (bundled ClickHouse: services/ingest tests and Laysi/trustiot-v2#60).
clickhouse:
  mode: external
  external:
    url: https://clickhouse.e2e.trustiot.test:8443

observability:
  sentry:
    # No Sentry Secret in the test namespace.
    enabled: false
