# Bundled Postgres e2e overlay (postgres.e2e.ts). Use after a deployment shape and its instance
# overlay:
#   -f values-saas.yaml -f tests/values/saas-instance.yaml -f tests/e2e/values-postgres-e2e.yaml
# The test adds the Postgres, example-service and migrate images and the name of the ClickHouse
# admin Secret it creates for the run.

# The migration Job runs as in a real install: it creates the roles and generates their
# passwords into the Secrets the chart declares (Laysi/trustiot-v2#60).

ingress:
  # The test never goes through the ingress gateway; keep it small and off the node's ports.
  replicas: 1
  direct:
    serviceType: ClusterIP

postgres:
  mode: bundled
  bundled:
    storage:
      size: 1Gi

# The bundled ClickHouse and the collector, so the Job also generates the collector's password and
# the collector has to start with it. Small enough for the lab cluster.
clickhouse:
  mode: bundled
  bundled:
    storage:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1536Mi

observability:
  sentry:
    # No Sentry Secret in the test namespace.
    enabled: false
  collector:
    enabled: true
    forward:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

services:
  # crates/service-kit's example-service, playing the identity service: identity uses Postgres
  # (mesh.calls), so the chart gives it the role identity_app and the password the Job generates,
  # and the example service's readiness check opens a verify-full connection with them.
  identity:
    enabled: true
    env:
      - name: TRUSTIOT__GREETING
        value: hello from the postgres e2e
    podSecurityContext:
      # The distroless nonroot base declares its user by name; give the kubelet the number.
      runAsUser: 65532
      runAsGroup: 65532
