# Stand-in service that exercises the generic service template on a real cluster before
# any TrustIoT image exists. traefik/whoami answers 200 on every path (so /healthz and
# /readyz pass) and exits right away on SIGTERM. Pinned to the multi-arch index digest,
# which includes linux/arm64.
# Use as the last -f after a deployment shape and an instance overlay.

# The Postgres image is not published yet (Laysi/trustiot-v2#57): the nightly builds it from
# deploy/images/postgres and loads it into the cluster's nodes under this name
# (scripts/nightly/platform.ts), so there is no registry to pull it from.
postgres:
  bundled:
    image:
      repository: localhost/trustiot-e2e/postgres
      tag: nightly
      pullPolicy: Never

services:
  smoke-echo:
    enabled: true
    image:
      repository: docker.io/traefik/whoami
      tag: v1.12.0
      digest: sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    env:
      - name: WHOAMI_PORT_NUMBER
        value: "8080"
    # whoami listens on one port only, so the stand-in is probed on http. TrustIoT services are
    # probed on their health port (healthPort), the only port the node reaches on them.
    probes:
      startup:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 2
        failureThreshold: 30
      liveness:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        httpGet:
          path: /readyz
          port: http
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
    podSecurityContext:
      # The image sets no USER; TrustIoT images declare a numeric non-root USER instead.
      runAsUser: 65532
      runAsGroup: 65532
