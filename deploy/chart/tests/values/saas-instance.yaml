# Example SaaS instance overlay for chart tests, lab installs and the nightly workflow.
# Uses reserved .test names (RFC 6761); the real SaaS overlay lives in deploy/flux.
# Use with: -f values-saas.yaml -f tests/values/saas-instance.yaml

hosts:
  app: app.saas.trustiot.test
  gateway: gw.saas.trustiot.test
  ota: ota.saas.trustiot.test

internalIdentity:
  # Example public key; its private key was discarded when it was generated, so nothing can sign
  # for it. The identity service's private key Secret (signingKeySecret) is left out: the nightly
  # and e2e installs run an identity double that does not read it.
  publicKeys:
    - kid: 2026-10-a
      x: jxSgv4kffdHZ1jN2sf_IVpE4VGbJdheBqhCAAqI89Q8

postgres:
  bundled:
    # Example size; each deployment sizes its volume from its data (README: 叢集內的 Postgres).
    storage:
      size: 20Gi

clickhouse:
  bundled:
    # The bootstrap admin password is generated in the cluster (Laysi/trustiot-v2#403): no
    # Secret to name here.
    # Example size; each deployment sizes its volume from its load (README: 叢集內的 ClickHouse).
    storage:
      size: 50Gi

qdrant:
  external:
    url: https://qdrant.saas.trustiot.test:6333
    credentialsSecret:
      name: trustiot-qdrant

objectStorage:
  endpoint: https://objects.saas.trustiot.test
  region: auto
  bucket: trustiot-saas-test
  credentialsSecret:
    name: trustiot-object-storage

smtp:
  host: smtp.saas.trustiot.test
  port: 587
  security: starttls
  from: TrustIoT <noreply@saas.trustiot.test>
  credentialsSecret:
    name: trustiot-smtp

ai:
  chat:
    baseUrl: https://llm.saas.trustiot.test/v1
    apiKeySecret:
      name: trustiot-ai-chat
  embedding:
    baseUrl: https://embedding.saas.trustiot.test/v1
    apiKeySecret:
      name: trustiot-ai-embedding
  rerank:
    baseUrl: https://llm.saas.trustiot.test/v1
    apiKeySecret:
      name: trustiot-ai-chat

observability:
  sentry:
    environment: test
    dsnSecret:
      name: trustiot-sentry
