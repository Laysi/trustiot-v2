# Temporary probe for Laysi/trustiot-v2#67 on a throwaway branch that is never merged.
# Every ci.yml job starts with the local setup-proto action, which has not run on a hosted
# runner before. This probe runs only that action, installing Bun (built-in proto plugin),
# so its result shows whether the proto bootstrap itself works on GitHub.
#
# For `pull_request` events GitHub reads the workflow files of the pull request's merge
# commit (refs/pull/<number>/merge), so a workflow runs on the very pull request that adds
# it; only `pull_request_target` takes workflows from the base branch.
name: probe

on:
  pull_request:

permissions: {}

jobs:
  setup-bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - run: bun --version
