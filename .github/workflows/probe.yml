# Temporary probe for Laysi/trustiot-v2#67 on a throwaway branch that is never merged.
# Installing Rust through `proto install rust` does not complete on hosted runners, so this
# probe's setup-proto installs the toolchain pinned in rust-toolchain.toml with the runner
# image's rustup instead, then prints the versions. Its result shows whether that works.
#
# For `pull_request` events GitHub reads the workflow files of the pull request's merge
# commit (refs/pull/<number>/merge), so a workflow runs on the very pull request that adds
# it; only `pull_request_target` takes workflows from the base branch.
name: probe

on:
  pull_request:

permissions: {}

jobs:
  rustup-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: rust
      - run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
