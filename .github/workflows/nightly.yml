# Nightly: installs Istio ambient into a k3d cluster, deploys the whole Helm chart once per
# values file (SaaS, then on-prem), and runs the smoke test and the ingress e2e test, so a
# deployment shape nobody is using day to day cannot rot unnoticed. Policy, what the test checks and what to do when it fails:
# docs/architecture/ci-release.md, section nightly.yml.
#
# Cost: one job on one hosted arm64 runner, one k3d cluster reused for both values files. A pull
# request that touches the chart or this workflow is deployed for real before it merges, but only
# once it carries the `smoke` label (Laysi/trustiot-v2#309): the coordinator adds it before
# merging, and from then on every push re-runs the test. Without the label a pull request event
# starts the workflow but skips every job, which costs no minutes. Those runs report through the
# check status, the job summary and the uploaded artifact: a pull request run gets no write token
# for comments, because it runs the workflow file of the pull request itself.
#
# Jobs and what each may do (every job lists its own `permissions`):
# - smoke   contents: read. Runs the chart and the stand-in service images on a throwaway
#           cluster; it has no write access and no secret, and hands over only the report.
# - notify  issues: write; actions: read. Scheduled and manual runs only: opens or updates the
#           failure issue, or closes it when a night passes again, with the workflow's own
#           GITHUB_TOKEN. No external service, no extra secret.
name: nightly

on:
  schedule:
    # 18:17 UTC is 02:17 in Taipei; an odd minute avoids the busy start of the hour.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail every shape on purpose after its install, to check the failure notification.
        type: boolean
        default: false
  pull_request:
    # `labeled`, so that adding the `smoke` label starts the test; the default types are
    # opened, synchronize and reopened. Adding any other label starts nothing (see smoke.if).
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/nightly.yml
      - .github/actions/setup-proto/**
      - .proto/plugins/**
      - .prototools
      - deploy/chart/**
      - deploy/istio/**
      - scripts/nightly/**

# No token scopes by default; each job asks for what it needs.
permissions: {}

concurrency:
  # A pull request's newer push replaces its running deployment. A scheduled or manual run is
  # never cancelled; a second one waits, so every night gets its own result. A pull request event
  # that deploys nothing (no `smoke` label, or another label added) gets a group of its own, so
  # it cannot cancel a deployment in progress. The condition is the one in smoke.if.
  group: >-
    ${{
      github.event_name != 'pull_request' && format('nightly-{0}', github.ref)
      || (contains(github.event.pull_request.labels.*.name, 'smoke')
        && (github.event.action != 'labeled' || github.event.label.name == 'smoke'))
        && format('nightly-{0}', github.event.pull_request.number)
      || format('nightly-no-smoke-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke
    # Scheduled and manual runs always; a pull request only with the `smoke` label, and for a
    # `labeled` event only when the label added is `smoke` (GitHub compares strings ignoring case).
    if: >-
      ${{
        github.event_name != 'pull_request'
        || (contains(github.event.pull_request.labels.*.name, 'smoke')
          && (github.event.action != 'labeled' || github.event.label.name == 'smoke'))
      }}
    # arm64, like every node we ship (decision 5): the chart's default nodeSelector is
    # kubernetes.io/arch: arm64, and the nightly must test that shape, not an amd64 override.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The k3s version of the SaaS host and the lab (docs/feasibility/2026-10-10-edge-poc.md),
      # pinned by the digest of the multi-arch index. Renovate keeps tag and digest together
      # (renovate.json5; it stays on the 1.36 minor until someone upgrades k3s on purpose).
      K3S_IMAGE: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
      # The platform the chart expects (deploy/istio/README.md). The Gateway API CRDs are applied
      # from the release asset after its SHA-256 matches; bump version and hash together.
      GATEWAY_API_VERSION: v1.6.1
      GATEWAY_CRDS_SHA256: 24d931f22abd8e40c973264319ead7cfa09d0fb7716b7ab1ee2ff174cb063a73
      # renovate: datasource=github-releases depName=istio/istio
      ISTIO_VERSION: 1.30.5
      NIGHTLY_SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun runs the test, helm, k3d and kubectl are the versions pinned in .prototools. Docker,
      # which k3d and the e2e test's image build need, and openssl are part of the runner image.
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun helm k3d kubectl
      # Installs Gateway API and Istio ambient, then per values file: the smoke deployment and the
      # ingress e2e test (deploy/chart/tests/e2e).
      - name: Deploy the chart with each values file and run the tests
        # The runner context is not available in job-level env, only in steps.
        env:
          NIGHTLY_OUT: ${{ runner.temp }}/nightly-out
        run: bun scripts/nightly/run.ts
      - name: Upload the report and the run log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          # The directory the previous step's NIGHTLY_OUT names, spelled out because step env does not carry over.
          path: ${{ runner.temp }}/nightly-out
          if-no-files-found: warn
          retention-days: 14

  # The script that holds the write token must be reviewed code: it runs for scheduled runs (always
  # the default branch) and for manual runs on the default branch. A manual run of another branch
  # still runs the smoke job but notifies nobody; pull requests never run this job.
  notify:
    name: notify
    needs: smoke
    # Also when the smoke job failed or timed out.
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - name: Download the report
        # Missing when the smoke job failed before it wrote one; the notification says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-report
          path: ${{ runner.temp }}/nightly-report
      - name: Open, update or close the failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_RESULT: ${{ needs.smoke.result }}
          NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
          NIGHTLY_JOB_NAME: smoke
        run: bun scripts/nightly/notify.ts
