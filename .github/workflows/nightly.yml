# Nightly: installs Istio ambient and the CloudNativePG operator into a k3d cluster, deploys the whole Helm chart once per
# values file (SaaS, then on-prem), and runs the smoke test and the ingress e2e test (plus, once,
# the service-to-service authorization e2e test), so a
# deployment shape nobody is using day to day cannot rot unnoticed. Policy, what the test checks and what to do when it fails:
# docs/architecture/ci-release.md, section nightly.yml.
#
# Cost: one job on one hosted arm64 runner, one k3d cluster reused for both values files. A pull
# request that touches the chart or this workflow is deployed for real before it merges, but only
# once it carries the `smoke` label (Laysi/trustiot-v2#309): the person who merges the pull
# request adds it before merging, and from then on every push re-runs the test. Without the label a
# pull request event starts the workflow but skips every job, which costs no minutes. Those runs
# report through the check status, the job summary and the uploaded artifact: a pull request run
# gets no write token for comments, because it runs the workflow file of the pull request itself.
#
# A scheduled run does nothing when it would test what the last nightly run on main passed
# (Laysi/trustiot-v2#433): the decide job compares the tree of this commit with the tree of the
# newest completed scheduled or manual run, and only a passed run with the same tree skips the
# deployment. Failed, cancelled or missing runs and API errors deploy; manual runs always do. Policy:
# docs/architecture/ci-release.md, section nightly.yml.
#
# Jobs and what each may do (every job lists its own `permissions`):
# - decide  contents: read; actions: read. Scheduled runs only (the default branch's reviewed copy of
#           the script, never code of a pull request): reads the earlier runs and commits, writes
#           nothing, and hands one boolean, `deploy`, to the other jobs.
# - smoke   contents: read. Runs the chart and the stand-in service images on a throwaway
#           cluster; it has no write access and no secret, and hands over only the report. Its
#           Rust images are rebuilt only when an input changed; scheduled and manual runs on main
#           save them to the Actions cache, pull requests only restore (see the cache steps).
# - notify  issues: write; actions: read. Scheduled and manual runs that deployed only: opens or
#           updates the failure issue, or closes it when a night passes again, with the workflow's own
#           GITHUB_TOKEN. A night that decide skipped neither opens nor closes it. No external service, no extra secret.
name: nightly

on:
  schedule:
    # 18:17 UTC is 02:17 in Taipei; an odd minute avoids the busy start of the hour.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail every shape on purpose after its install, to check the failure notification.
        type: boolean
        default: false
  pull_request:
    # `labeled`, so that adding the `smoke` label starts the test; the default types are
    # opened, synchronize and reopened. Adding any other label starts nothing (see smoke.if).
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/nightly.yml
      - .github/actions/setup-proto/**
      - .proto/plugins/**
      - .prototools
      - .dockerignore
      # What goes into the nightly's Rust images (scripts/nightly/image-cache.ts, NIGHTLY_IMAGES):
      # the workspace, the toolchain, the build scripts and every local crate tools/migrate,
      # services/identity, services/assets, services/ai-gateway, services/telemetry-query,
      # services/certs and services/assistant build from, plus the files tools/migrate compiles
      # in with #[path] (scripts/nightly/image-cache.test.ts keeps this list complete).
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deploy/images/rust-binary.Containerfile
      - scripts/**
      - crates/ai-clients/**
      - crates/ca-keys/**
      - crates/contract/**
      - crates/identity-keys/**
      - crates/outbox/**
      - crates/protocol/**
      - crates/service-kit/**
      - crates/testkit/**
      - crates/webpki-roots-empty/**
      # A dev-dependency of services/certs (tests/workstation_tool.rs).
      - factory/workstation/**
      # A dev-dependency of services/telemetry-query (tests/semantic.rs loads the lab dataset),
      # and what it depends on. services/ingest also holds the files tools/migrate compiles in
      # with #[path] (src/retention.rs, src/rollup.rs).
      - tools/lab-dataset/**
      - edge/agent/**
      - services/ingest/**
      - deploy/chart/**
      - deploy/cloudnative-pg/**
      - deploy/images/postgres/**
      - deploy/images/migrate/**
      - deploy/images/identity/**
      - deploy/images/assets/**
      - deploy/images/ai-gateway/**
      - deploy/images/telemetry-query/**
      - deploy/images/certs/**
      - deploy/images/assistant/**
      - deploy/istio/**
      - tools/migrate/**
      - services/identity/**
      - services/assets/**
      - services/ai-gateway/**
      - services/telemetry-query/**
      - services/certs/**
      - services/assistant/**
      - services/*/migrations/**

# No token scopes by default; each job asks for what it needs.
permissions: {}

concurrency:
  # A pull request's newer push replaces its running deployment. A scheduled or manual run is
  # never cancelled; a second one waits, so every night gets its own result. A pull request event
  # that deploys nothing (no `smoke` label, or another label added) gets a group of its own, so
  # it cannot cancel a deployment in progress. The condition is the one in smoke.if.
  group: >-
    ${{
      github.event_name != 'pull_request' && format('nightly-{0}', github.ref)
      || (contains(github.event.pull_request.labels.*.name, 'smoke')
        && (github.event.action != 'labeled' || github.event.label.name == 'smoke'))
        && format('nightly-{0}', github.event.pull_request.number)
      || format('nightly-no-smoke-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only a scheduled run asks (scripts/nightly/unchanged.ts); a manual run and a pull request skip
  # this job, so they start no runner for it and run no pull request code here. Its output is
  # exactly 'false' only when the deployment is to be skipped: a skipped, failed or silent job
  # leaves it empty and the deployment runs.
  decide:
    name: decide
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      # The earlier nightly runs (list workflow runs) and, with contents, the trees of two commits.
      actions: read
    outputs:
      deploy: ${{ steps.unchanged.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - id: unchanged
        name: Compare main with the last passed nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/nightly/unchanged.ts

  smoke:
    name: smoke
    needs: decide
    # Scheduled runs unless decide found main unchanged since the last passed run; manual runs
    # always (decide did not run, so its output is empty); a pull request only with the `smoke`
    # label, and for a `labeled` event only when the label added is `smoke` (GitHub compares
    # strings ignoring case). `!cancelled()` because a skipped `decide` would otherwise skip this
    # job too.
    if: >-
      ${{
        !cancelled()
        && needs.decide.outputs.deploy != 'false'
        && (github.event_name != 'pull_request'
          || (contains(github.event.pull_request.labels.*.name, 'smoke')
            && (github.event.action != 'labeled' || github.event.label.name == 'smoke')))
      }}
    # arm64, like every node we ship (decision 5): the chart's default nodeSelector is
    # kubernetes.io/arch: arm64, and the nightly must test that shape, not an amd64 override.
    runs-on: ubuntu-24.04-arm
    # 45 minutes before the migration Job's image was built here (Laysi/trustiot-v2#60), plus its
    # cold build when no cached image matches: 1 min 37 s in PR run 38330343474, so about 2 min
    # with the build tools (docs/architecture/ci-release.md, nightly.yml). Laysi/trustiot-v2#65
    # adds the identity and assets images (two more cold builds that reuse the first one's
    # dependencies) and per shape their rollout and the API check through the ingress. A cache
    # hit adds only the loads and the imports. Laysi/trustiot-v2#77 adds the service-to-service e2e
    # test once (SaaS shape, no image build) and about a dozen requests per shape.
    # Laysi/trustiot-v2#536 adds the AI gateway's image (one more cold build, whose AI client
    # crates no other image uses) and per shape its rollout, with no request to it.
    # Laysi/trustiot-v2#539 adds the telemetry-query image (one more cold build on the same
    # dependencies) and per shape its rollout, a few requests through the ingress and two
    # ClickHouse queries in the pod.
    # Laysi/trustiot-v2#517 adds the certs image (one more cold build, which also links certs-ca)
    # and per shape the CA ceremony: a helm upgrade and the wait for the service to load the
    # issuing CA certificate from the updated ConfigMap (the kubelet's sync, about 1 to 2 minutes)
    # and to publish its first CRL, plus a dozen requests.
    # Laysi/trustiot-v2#592 adds the assistant image (one more cold build on the AI gateway's and
    # the services' dependencies) and per shape its rollout and one query of pg_stat_activity, with
    # no request to it.
    timeout-minutes: 85
    permissions:
      contents: read
    env:
      # The k3s version of the SaaS host and the lab (docs/feasibility/2026-10-10-edge-poc.md),
      # pinned by the digest of the multi-arch index. Renovate keeps tag and digest together
      # (renovate.json5; it stays on the 1.36 minor until someone upgrades k3s on purpose).
      K3S_IMAGE: rancher/k3s:v1.36.5-k3s1@sha256:057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
      # The platform the chart expects (deploy/istio/README.md). The Gateway API CRDs are applied
      # from the release asset after its SHA-256 matches; bump version and hash together.
      GATEWAY_API_VERSION: v1.6.1
      GATEWAY_CRDS_SHA256: 24d931f22abd8e40c973264319ead7cfa09d0fb7716b7ab1ee2ff174cb063a73
      # renovate: datasource=github-releases depName=istio/istio
      ISTIO_VERSION: 1.30.5
      # The operator of the bundled Postgres (deploy/cloudnative-pg/README.md, which names the same
      # pair; scripts/nightly checks they agree). The release manifest is applied after its SHA-256
      # matches; bump version and hash together.
      CNPG_VERSION: 1.30.1
      CNPG_MANIFEST_SHA256: 37237f145d8138256ea25ae830f87759255665ff08f8d552fdd8224a5ec032fb
      NIGHTLY_SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
      # Whether this run may write the Actions cache: scheduled and manual runs on main only. A
      # pull request restores main's entries and never saves one (docs/architecture/ci-release.md,
      # nightly.yml, on why a pull request cannot plant an image for main).
      NIGHTLY_SAVES_CACHE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun runs the test, helm, k3d and kubectl are the versions pinned in .prototools. Docker,
      # which k3d and the images the tests build need, and openssl are part of the runner image.
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun helm k3d kubectl
      # The Rust images (NIGHTLY_IMAGES in scripts/nightly/image-cache.ts: deploy/images/migrate,
      # identity, assets, ai-gateway, telemetry-query, certs and assistant) are reused while nothing that goes
      # into them changed: the key is a digest of the git object hashes of every input of their
      # builds. One entry holds every tarball and the programs built with them (certs-ca,
      # NIGHTLY_PROGRAMS), and it is saved only with all of them. Exact key only, no restore-keys:
      # an image of other sources would test code that is not this commit's, and certs-ca runs on
      # the runner itself.
      - name: Compute the cache key of the Rust images
        id: rust-images
        run: bun scripts/nightly/image-cache.ts key >> "$GITHUB_OUTPUT"
      - name: Restore the Rust images
        id: rust-images-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache
          key: ${{ steps.rust-images.outputs.key }}
      # Only for a build: zig, cargo-zigbuild and cargo-auditable build the images the way
      # release.yml does; Rust comes from the runner's rustup (scripts/nightly/service-image.ts).
      # When a restored tarball turns out unusable, run.ts warns, installs them itself with proto
      # and builds.
      - name: Install the tools that build the Rust images
        if: ${{ steps.rust-images-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-proto
        with:
          tools: zig cargo-zigbuild cargo-auditable
      # Installs Gateway API, Istio ambient and CloudNativePG, builds the Postgres and Rust images,
      # then per values file: the smoke deployment with its API check and the ingress e2e test
      # (deploy/chart/tests/e2e), and after the SaaS one the service-to-service e2e test (mesh.e2e.ts).
      - name: Deploy the chart with each values file and run the tests
        # The runner context is not available in job-level env, only in steps.
        env:
          NIGHTLY_OUT: ${{ runner.temp }}/nightly-out
          NIGHTLY_IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache
          NIGHTLY_IMAGE_CACHE_SAVE: ${{ env.NIGHTLY_SAVES_CACHE == 'true' && steps.rust-images-cache.outputs.cache-hit != 'true' }}
        run: bun scripts/nightly/run.ts
      # Built images are saved even when a shape failed: they come from the sources alone. Only
      # with every tarball, so a later hit never lacks one (a run that stopped halfway saves
      # nothing, and the next one builds again).
      - name: Check for every built Rust image to save
        id: rust-images-built
        if: ${{ always() && env.NIGHTLY_SAVES_CACHE == 'true' && steps.rust-images-cache.outputs.cache-hit != 'true' }}
        run: bun scripts/nightly/image-cache.ts complete "$RUNNER_TEMP/image-cache" >> "$GITHUB_OUTPUT"
      - name: Save the Rust images
        if: ${{ always() && env.NIGHTLY_SAVES_CACHE == 'true' && steps.rust-images-built.outputs.built == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache
          key: ${{ steps.rust-images.outputs.key }}
      - name: Upload the report and the run log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          # The directory the previous step's NIGHTLY_OUT names, spelled out because step env does not carry over.
          path: ${{ runner.temp }}/nightly-out
          if-no-files-found: warn
          retention-days: 14

  # The script that holds the write token must be reviewed code: it runs for scheduled runs (always
  # the default branch) and for manual runs on the default branch. A manual run of another branch
  # still runs the smoke job but notifies nobody; pull requests never run this job.
  notify:
    name: notify
    needs: [decide, smoke]
    # Also when the smoke job failed or timed out, but not on a night decide skipped: that night
    # neither opens nor closes the failure issue (the `skipped` result of smoke is handled in
    # notify.ts as well).
    if: >-
      ${{
        always()
        && needs.decide.outputs.deploy != 'false'
        && (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - name: Download the report
        # Missing when the smoke job failed before it wrote one; the notification says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-report
          path: ${{ runner.temp }}/nightly-report
      - name: Open, update or close the failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_RESULT: ${{ needs.smoke.result }}
          NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
          NIGHTLY_JOB_NAME: smoke
        run: bun scripts/nightly/notify.ts
