# CI for every pull request (whatever its base branch, integration branches included) and
# every push to main. Policy and the required-checks list: docs/architecture/ci-release.md.
#
# Rules for this and every other workflow, enforced by the workflow-policy job
# (scripts/ci/check-workflows.ts): every job lists its `permissions`; every action is pinned
# to a full commit SHA with the tag in a trailing comment; no `pull_request_target` or
# `workflow_run` triggers, so pull requests from forks never get secrets or a write token.
# The same job runs actionlint (scripts/ci/lint-workflows.ts) so a file GitHub cannot parse
# fails here instead of at its first trigger.
#
# Cost (Laysi/trustiot-v2#309): every job runs on the 2-core arm64 runner, which costs less per
# minute than x64. The `changes` job (scripts/ci/changes.ts) decides from the changed paths
# whether `rust`, `cargo-deny`, `helm`, `host`, `postgres-image` and `frontend` run; a job it
# skips reports as skipped, which counts as passed. Each of them runs unless `changes` answered
# exactly 'false', so a failed or missing answer runs everything. `gitleaks` and
# `workflow-policy` always run. A new job that
# should depend on paths gets its rule in scripts/ci/changes.ts and an output of `changes`.
# On a push to main, a job that already ran and passed in the merged pull request's runs on the
# identical tree is skipped too (scripts/ci/tested-tree.ts). So these jobs must behave the same on
# a pull request and on a push, and their `name` must equal their id: changes.ts finds them by
# name in the pull request's run (scripts/ci/workflow-conditions.test.ts checks both).
#
# Checks that later issues add to this workflow:
# - Integration tests still missing (every migration on a fresh database already runs in
#   `cargo test`, in tools/migrate's tests with throwaway containers that fail under CI instead
#   of skipping): Mosquitto for the MQTT service tests (Laysi/trustiot-v2#91), the AGE roles'
#   cross-tenant tests (Laysi/trustiot-v2#176), and `cargo sqlx prepare --workspace --check`
#   (Laysi/trustiot-v2#383; no crate enables sqlx's macros feature yet).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml's deploy-pr job starts ci on the deploy branch it pushes: the PR it opens with
  # GITHUB_TOKEN starts no workflow, and workflow_dispatch is the one event that token may
  # trigger. The checks attach to the branch's head commit, so they show on that PR.
  workflow_dispatch:

# No token scopes by default; each job asks for what it needs.
permissions: {}

concurrency:
  # One run per pull request: a new push to a pull request cancels its running CI. A push to
  # main gets a group of its own commit, because GitHub replaces a pending run in a shared
  # group with a newer one even without cancel-in-progress; so every main commit gets a result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Read-only. On a push to main, changes.ts reads (Laysi/trustiot-v2#431):
    # - actions: which recent main commits ci passed on, to compare with the newest of them; and
    #   the runs of the merged pull request's last head and their jobs' conclusions;
    # - contents: that head's tree, its merge base with the pushed commit's parent, whether GitHub
    #   created and signed that parent and when, and the force pushes to main (repository activity);
    # - pull-requests: the pull request a main commit was merged from, and the pull requests with
    #   its head branch;
    # - issues and pull-requests: whether that pull request's base branch ever changed (GitHub
    #   lists the issue events endpoint under both).
    # If any of it cannot be read, the jobs run (scripts/ci/changes.ts).
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      cargo-deny: ${{ steps.decide.outputs.cargo-deny }}
      helm: ${{ steps.decide.outputs.helm }}
      host: ${{ steps.decide.outputs.host }}
      postgres-image: ${{ steps.decide.outputs.postgres-image }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push is compared with the newest green main commit, which can be any ancestor.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - id: decide
        name: Decide which jobs the changed paths need
        env:
          # Only a push reads the API; a pull request runs its own copy of the script, so it
          # gets no token at all.
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: bun scripts/ci/changes.ts

  rust:
    name: rust
    needs: changes
    # Also when `changes` failed: only an explicit 'false' skips the job.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04-arm
    # The test step runs the test binaries one at a time, and each container-backed test makes it
    # longer: the job took 27–30 minutes on 2026-10-27 and hit the old 30-minute limit
    # (Laysi/trustiot-v2#709). Laysi/trustiot-v2#710 is to shorten it and then lower this again.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # sqlx's query macros read the committed `.sqlx/` data instead of a live database, so
      # a query without up-to-date data fails to compile.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/setup-proto
        with:
          tools: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # Pull requests restore main's cache but do not save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The checks below run even when an earlier one fails, so one run reports them all.
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The --workspace commands build default features only. service-kit's `contract` feature
      # is on by default, but services/ai-gateway is to use the kit without it, so the code
      # paths without it get their own lint and test run (crates/service-kit/README.md).
      - name: clippy for service-kit without default features
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --package service-kit --no-default-features --all-targets --locked -- -D warnings
      # service-kit's container and job_lock tests, the ingest ClickHouse schema test and the
      # protocol broker ACL test start throwaway containers (PID 1, Postgres, ClickHouse and
      # Mosquitto) with podman or docker, both on the hosted runner. GitHub sets CI=true, which
      # makes them fail instead of skip when no container runtime works, so a green test step
      # means they ran.
      - name: test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --workspace --locked
      - name: test service-kit without default features
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --package service-kit --no-default-features --locked
      # api/openapi.json is generated from the code (tools/openapi). Regenerate it and fail on any
      # difference, so an API type cannot change without the committed spec changing with it.
      - name: OpenAPI spec is current
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo run --locked --package openapi
          if [[ -n "$(git status --porcelain -- api)" ]]; then
            git --no-pager diff -- api
            echo "::error file=api/openapi.json,title=OpenAPI spec is out of date::Run 'cargo run -p openapi' and commit api/openapi.json."
            exit 1
          fi
      - name: aarch64 build of the gateway crates
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          # The gateway runs on aarch64: crates/protocol and every workspace member under
          # edge/ must build for it (docs/architecture/repository-layout.md), the agent's
          # executable included (glibc, docs/architecture/ci-release.md).
          packages=()
          for manifest in crates/protocol/Cargo.toml edge/*/Cargo.toml; do
            if [[ -f "$manifest" ]]; then
              pkgid="$(cargo pkgid --locked --manifest-path "$manifest")"
              packages+=(--package "$pkgid")
            fi
          done
          if (( ${#packages[@]} == 0 )); then
            echo "::notice title=aarch64 build::No gateway crates yet (crates/protocol, edge/*)."
            exit 0
          fi
          # On the arm64 runner the host is the gateway target: build natively, which reuses
          # the build cache of the steps above. On an x64 host, cross-compile: ring builds C
          # for the target and the executable links against the target's glibc, so the pinned
          # Zig is the C compiler and linker (cargo-zigbuild, as the release build uses it).
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$host" == aarch64-unknown-linux-gnu ]]; then
            cargo build --locked "${packages[@]}"
          else
            proto install zig
            proto install cargo-zigbuild
            rustup target add aarch64-unknown-linux-gnu
            # --reporter text: proto prints NDJSON when it thinks an agent runs it.
            zigbuild="$(proto bin cargo-zigbuild --reporter text | tail -n 1)"
            CARGO_ZIGBUILD_ZIG_PATH="$(proto bin zig --reporter text | tail -n 1)" PATH="$(dirname "$zigbuild"):$PATH" \
              cargo zigbuild --locked --target aarch64-unknown-linux-gnu "${packages[@]}"
          fi

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cargo-deny != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: rust cargo-deny
      # Licenses, RustSec advisories, banned crates and sources, as configured in deny.toml.
      - run: cargo deny --locked check

  helm:
    name: helm
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.helm != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun helm kubeconform kubectl flux
      # helm lint --strict, then helm template with values-saas.yaml and values-onprem.yaml,
      # each validated by kubeconform -strict, plus the chart's own rules and the README field
      # check (deploy/chart/README.md). kubeconform downloads the Kubernetes schemas.
      - run: bun test deploy/chart
      # The SaaS GitOps tree (deploy/flux/README.md): kustomize build, kubeconform against the
      # pinned Flux CRDs, Flux's manifests equal to the pinned flux CLI's, the chart source's
      # signature check, the instance values against the chart schema, and .sops.yaml.
      - name: deploy/flux
        if: ${{ !cancelled() }}
        run: bun test deploy/flux

  host:
    name: host
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.host != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/setup-proto
        with:
          tools: bun
      - name: Install dependencies
        run: bun install --cwd deploy/host --frozen-lockfile
      # The SaaS host installer (deploy/host/README.md). Its tests run every step against a
      # simulated host and score the cloudflared unit with the runner's systemd-analyze; CI=true
      # makes them fail instead of skip when systemd-analyze or gpg is missing.
      - name: Type check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd deploy/host typecheck
      - name: Test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd deploy/host test
      - name: Build the x86_64 and aarch64 executables
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd deploy/host build

  postgres-image:
    name: postgres-image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.postgres-image != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: bun
      # The Postgres image with Apache AGE (deploy/images/postgres/README.md). The test builds it
      # natively on this arm64 runner, through containerBuildArgs like every container build,
      # then starts Postgres the way CloudNativePG runs it for CREATE EXTENSION age and cypher()
      # queries. release.yml cross-compiles it on x86 without an emulator instead; the test checks
      # statically that every RUN is in a --platform=$BUILDPLATFORM stage, which that build needs.
      # CI=true makes the test fail instead of skip when the image cannot run.
      - name: Build and test the image
        run: bun test deploy/images/postgres

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/setup-proto
        with:
          tools: bun
      # The single-page app (frontend/README.md). The lock file is frozen and no dependency may
      # run an install script (trustedDependencies is empty).
      - name: Install dependencies
        run: bun install --cwd frontend --frozen-lockfile
      # The typed API client is generated from api/openapi.json and committed; fail when it differs.
      - name: API client is current
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend api:check
      - name: Type check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend lint
      # Includes the translation checks: every key in both languages, and every message key the
      # services can send (crates/contract/src, services/*/src) translated.
      - name: Test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend test
      - name: Build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend build
      # The layout services/web serves and the CSP the build must satisfy: no inline script or
      # style, no data: URIs, no source maps, hashed names under static/.
      - name: Check the build output
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd frontend check:dist

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit reachable from the checked-out commit is scanned.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-proto
        with:
          tools: gitleaks
      - name: gitleaks
        run: |
          # Scan the history of HEAD only. gitleaks' default (`--all`) would also scan every
          # other branch that the full-depth checkout fetched. Merge commits are diffed
          # against their first parent so that content added while merging is scanned too.
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          gitleaks git --no-banner --redact --verbose \
            --log-opts="--full-history --diff-filter=tuxdb --diff-merges=first-parent HEAD" \
            --report-format=json --report-path="$report" . || status=$?
          if (( status != 0 )) && [[ -s "$report" ]]; then
            # One annotation per finding; the report is redacted, so no secret is printed.
            jq -r '
              def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
              def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
              unique_by(.Fingerprint)[]
              | "::error file=\(.File | prop),line=\(.StartLine),title=gitleaks \(.RuleID | prop)::"
                + ("Secret in commit \(.Commit[0:12]) (fingerprint \(.Fingerprint)). Revoke it, "
                  + "then remove it from history or add the fingerprint to .gitleaksignore "
                  + "with a reason." | data)
            ' "$report"
          fi
          exit "$status"

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/setup-proto
        with:
          # helm: scripts/nightly/manifests.test.ts renders the chart to check what the nightly deploys.
          tools: bun helm actionlint
      - name: Check workflow permissions and action pinning
        run: bun scripts/ci/check-workflows.ts
      # Container build files, build arguments, secrets in run scripts and Secret manifests
      # (docs/architecture/secrets.md); covers every Dockerfile or Containerfile in the repo.
      - name: Check secret handling
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun scripts/ci/check-secret-handling.ts
      # What GitHub itself would reject when it parses a workflow, for example a context that
      # is not available at that key. Without this, such a file only fails when it is triggered.
      - name: Lint workflows with actionlint
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun scripts/ci/lint-workflows.ts
      - name: Install script dependencies
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun install --cwd scripts --frozen-lockfile
      # Both cover all of scripts/, the local dev environment included. Its podman end-to-end
      # test skips unless TRUSTIOT_DEV_E2E is set: it builds the services and pulls the stack.
      - name: Type check scripts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd scripts typecheck
      - name: Test scripts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bun run --cwd scripts test
